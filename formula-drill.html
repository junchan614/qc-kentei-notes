<title>QC公式ドリル</title>
<style>
:root{
  --bg:#f2f4f2;
  --surface:#ffffff;
  --surface-2:#eaf0ed;
  --border:#d6ddd8;
  --text:#182420;
  --muted:#5b6b63;
  --accent:#1f6f5c;
  --accent-strong:#154d40;
  --accent-soft:#e2f0ea;
  --good:#2f8f5f;
  --good-soft:#e2f5ea;
  --bad:#c14b3f;
  --bad-soft:#fbeae7;
  --warn:#a9752a;
  --warn-soft:#f7edd9;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --sans:'IBM Plex Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  --display:'IBM Plex Sans Condensed',var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11150f; --surface:#181d17; --surface-2:#1f2620; --border:#31392f;
    --text:#e7ede8; --muted:#9dab9f;
    --accent:#59b898; --accent-strong:#82d3b3; --accent-soft:#1c3129;
    --good:#4fbf82; --good-soft:#173626;
    --bad:#e2827a; --bad-soft:#3a231f;
    --warn:#d9ab63; --warn-soft:#382d17;
  }
}
:root[data-theme="dark"]{
  --bg:#11150f; --surface:#181d17; --surface-2:#1f2620; --border:#31392f;
  --text:#e7ede8; --muted:#9dab9f;
  --accent:#59b898; --accent-strong:#82d3b3; --accent-soft:#1c3129;
  --good:#4fbf82; --good-soft:#173626;
  --bad:#e2827a; --bad-soft:#3a231f;
  --warn:#d9ab63; --warn-soft:#382d17;
}
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.6;padding-inline:16px;padding-block:0 24px;}
.wrap{max-width:640px;margin:0 auto;}
.masthead{padding-block:20px 8px;}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.12em;color:var(--accent-strong);text-transform:uppercase;font-weight:600;}
h1{font-family:var(--display);font-size:1.7rem;margin:.2em 0 .3em;text-wrap:balance;}
.lede{color:var(--muted);font-size:.9rem;max-width:60ch;}

.statbar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  margin-top:16px;
}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:8px 10px;text-align:center;
}
.stat .v{font-family:var(--mono);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-strong);}
.stat .k{font-size:.68rem;color:var(--muted);margin-top:2px;}

.filters{margin-top:16px;}
.filters-label{font-size:.78rem;color:var(--muted);margin-bottom:6px;font-family:var(--display);letter-spacing:.03em;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;}
.chipbtn{
  font-family:var(--sans);font-size:.8rem;font-weight:600;
  border:1.5px solid var(--border);background:var(--surface);color:var(--muted);
  padding:6px 12px;border-radius:999px;cursor:pointer;
}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);}
.chipbtn.bonus[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}
.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.deckinfo{margin-top:10px;font-size:.78rem;color:var(--muted);font-family:var(--mono);}

.card-area{margin-top:20px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:28px 24px 24px;min-height:220px;display:flex;flex-direction:column;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.domain-badge{
  font-family:var(--display);font-size:.72rem;letter-spacing:.06em;font-weight:700;
  background:var(--accent-soft);color:var(--accent-strong);
  padding:4px 10px;border-radius:999px;text-transform:uppercase;
}
.lap-badge{font-family:var(--mono);font-size:.72rem;color:var(--muted);}

.prompt{
  font-family:var(--display);font-size:1.35rem;line-height:1.45;
  margin:20px 0;flex:1;display:flex;align-items:center;text-wrap:balance;
}

.reveal-btn{
  font-family:var(--sans);font-size:1rem;font-weight:700;
  background:var(--accent);color:#fff;border:none;border-radius:10px;
  padding:14px;cursor:pointer;width:100%;
}
.reveal-btn:hover{background:var(--accent-strong);}
.reveal-btn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;}

.answer-block{
  background:var(--surface-2);border-radius:10px;padding:14px 16px;
  font-family:var(--mono);font-size:1rem;line-height:1.7;
  border-left:3px solid var(--accent);
}
.answer-block .note{font-family:var(--sans);font-size:.82rem;color:var(--muted);margin-top:8px;line-height:1.6;}
.answer-block[hidden]{display:none;}

.refs{margin-top:12px;padding-top:10px;border-top:1px dashed var(--border);}
.refs .refs-label{font-family:var(--sans);font-size:.74rem;color:var(--muted);margin-bottom:6px;}
.refs .refs-list{display:flex;flex-wrap:wrap;gap:6px;}
.ref-link{
  font-family:var(--sans);font-size:.76rem;font-weight:600;text-decoration:none;
  background:var(--surface);color:var(--accent-strong);border:1px solid var(--border);
  padding:4px 10px;border-radius:999px;
}
.ref-link:hover{border-color:var(--accent);background:var(--accent-soft);}
.ref-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.judge-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.judge-btn{
  font-family:var(--sans);font-size:.95rem;font-weight:700;border:none;border-radius:10px;
  padding:14px;cursor:pointer;
}
.judge-btn.wrong{background:var(--bad-soft);color:var(--bad);border:1.5px solid var(--bad);}
.judge-btn.right{background:var(--good-soft);color:var(--good);border:1.5px solid var(--good);}
.judge-btn:hover.wrong{background:var(--bad);color:#fff;}
.judge-btn:hover.right{background:var(--good);color:#fff;}
.judge-btn:focus-visible{outline:2px solid currentColor;outline-offset:2px;}

.judge-row[hidden],.reveal-btn[hidden]{display:none;}

.weak-panel{
  margin-top:22px;background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;
}
.weak-panel summary{cursor:pointer;font-family:var(--display);font-size:.92rem;font-weight:700;color:var(--text);}
.weak-list{margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.weak-row{
  display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-size:.82rem;border-bottom:1px dashed var(--border);padding-bottom:6px;
}
.weak-row .wp{color:var(--text);}
.weak-row .wr{font-family:var(--mono);color:var(--bad);white-space:nowrap;}
.weak-empty{font-size:.82rem;color:var(--muted);}

.bottom-actions{margin-top:20px;display:flex;justify-content:flex-end;}
.reset-btn{
  font-family:var(--sans);font-size:.76rem;color:var(--muted);
  background:transparent;border:1px solid var(--border);border-radius:999px;
  padding:6px 12px;cursor:pointer;
}
.reset-btn:hover{color:var(--bad);border-color:var(--bad);}
.reset-btn.confirm{color:var(--bad);border-color:var(--bad);font-weight:700;}

footer{margin-top:26px;font-size:.76rem;color:var(--muted);text-align:center;padding-bottom:10px;}
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">QC検定2級・暗記ドリル</div>
    <h1>公式暗記ドリル</h1>
    <p class="lede">6分野・39項目の「丸暗記するしかない公式・ルール」を、答えを見る前に思い出せるかセルフチェックする無限ループ形式のドリルです。間違えたカードは近いうちにまた出てきます。</p>
  </header>

  <div class="statbar">
    <div class="stat"><div class="v" id="statTotal">0</div><div class="k">通算解答</div></div>
    <div class="stat"><div class="v" id="statAcc">–</div><div class="k">正答率</div></div>
    <div class="stat"><div class="v" id="statStreak">0</div><div class="k">連続正解</div></div>
    <div class="stat"><div class="v" id="statLap">1</div><div class="k">周回</div></div>
  </div>

  <div class="filters">
    <div class="filters-label">出題範囲</div>
    <div class="chiprow" id="filterChips"></div>
    <div class="deckinfo" id="deckInfo"></div>
  </div>

  <div class="card-area">
    <div class="card" id="card">
      <div class="card-top">
        <span class="domain-badge" id="domainBadge">—</span>
        <span class="lap-badge" id="remainBadge">残り —</span>
      </div>
      <div class="prompt" id="promptText">出題範囲を選んでいます…</div>
      <button class="reveal-btn" id="revealBtn" type="button">答えを見る</button>
      <div class="answer-block" id="answerBlock" hidden>
        <div id="answerText"></div>
        <div class="note" id="answerNote"></div>
        <div class="refs" id="answerRefs" hidden>
          <div class="refs-label">この公式が登場した過去問の解説:</div>
          <div class="refs-list" id="refsList"></div>
        </div>
      </div>
      <div class="judge-row" id="judgeRow" hidden>
        <button class="judge-btn wrong" id="judgeWrong" type="button">✗ 忘れていた</button>
        <button class="judge-btn right" id="judgeRight" type="button">○ 覚えていた</button>
      </div>
    </div>
  </div>

  <details class="weak-panel">
    <summary>苦手ランキング(2回以上出題したものだけ)</summary>
    <div class="weak-list" id="weakList"><div class="weak-empty">まだデータがありません。何問か解くと表示されます。</div></div>
  </details>

  <div class="bottom-actions">
    <button class="reset-btn" id="resetBtn" type="button">統計をリセット</button>
  </div>

  <footer>QC検定2級学習用オリジナルドリル ／ projects/qc-kentei/formula-drill.html</footer>
</div>

<script>
(function(){
  "use strict";

  var DOMAINS = {
    basic: {label:'統計的方法の基礎', short:'基礎', bonus:false},
    test:  {label:'検定と推定',       short:'検定推定', bonus:false},
    reg:   {label:'相関・回帰分析',   short:'相関回帰', bonus:false},
    exp:   {label:'実験計画法',       short:'実験計画', bonus:false},
    chart: {label:'管理図',           short:'管理図', bonus:false},
    cpk:   {label:'ヒストグラム・工程能力指数', short:'工程能力', bonus:false},
    z:     {label:'頻出z値(ボーナス)', short:'z値', bonus:true}
  };

  var DECK = [
    {id:'bs1', dom:'basic', prompt:'不偏分散(標本分散)の式は?', answer:'s² = S / (n−1)', note:'nで割る母分散の式と混同しない。', refs:['40th-chi-square-meaning.html','39th-data-summary.html']},
    {id:'bs2', dom:'basic', prompt:'正規分布の標準化(Z値)の式は?', answer:'Z = (x − μ) / σ', note:'規格値・境界値どちらの計算にも使う型。', refs:['35th-normal-assembly.html','36th-binomial-normal.html','38th-normal-cp.html']},
    {id:'bs3', dom:'basic', prompt:'Xの定数倍 cX の分散は?', answer:'V[cX] = c² · V[X]', note:'標準偏差はc倍、分散はc²倍で効く。', refs:['40th-normal-composition.html']},
    {id:'bs4', dom:'basic', prompt:'2変数の和 X+Y の分散の一般式は?', answer:'V[X+Y] = σx² + σy² + 2cov(X,Y)', note:'独立でなければ「+2cov」が残る形そのものを覚える。', refs:['35th-normal-assembly.html','38th-normal-cp.html']},
    {id:'bs5', dom:'basic', prompt:'X,Yが独立のとき cov(X,Y) はどうなる?', answer:'cov(X,Y) = 0', note:'定義から導けるが、試験中は結論だけ即答できるように。', refs:['35th-normal-assembly.html','38th-normal-cp.html']},
    {id:'bs6', dom:'basic', prompt:'二項分布 B(n,P) で Pr(X=x) を求める式は?', answer:'Pr(X=x) = ₙCₓ Pˣ (1−P)ⁿ⁻ˣ', note:'', refs:['36th-binomial-normal.html']},
    {id:'bs7', dom:'basic', prompt:'古典的確率 P(A) の定義は?', answer:'P(A) = 条件を満たす場合の数 / 全体の場合の数', note:'実際に試行して得る統計的確率(相対度数)とは別物。', refs:['39th-probability.html']},

    {id:'te1', dom:'test', prompt:'母平均のt検定の検定統計量 t0 は?', answer:'t0 = (x̄ − μ0) / √(V/n)', note:'σ²ではなく不偏分散Vを使う。', refs:['37th-onesided-t-test.html','40th-mean-variance-test.html']},
    {id:'te2', dom:'test', prompt:'母分散のχ²検定の検定統計量 χ0² は?', answer:'χ0² = S / σ0²', note:'Sは偏差平方和(分散ではない)。', refs:['35th-variance-test.html','40th-mean-variance-test.html','40th-chi-square-meaning.html']},
    {id:'te3', dom:'test', prompt:'2つの母分散を比較するF検定、F0はどう作る?', answer:'F0 = 大きい方のV / 小さい方のV', note:'常にF0≥1にして、棄却域を上側だけで済ませる。', refs:['39th-f-test.html']},
    {id:'te4', dom:'test', prompt:'分割表の期待度数Eの式は?', answer:'E = 行計 × 列計 / 総計', note:'', refs:['38th-chi-square.html']},
    {id:'te5', dom:'test', prompt:'分割表のχ0²とその自由度は?', answer:'χ0² = Σ(実測−期待)²/期待、自由度=(行数−1)(列数−1)', note:'', refs:['38th-chi-square.html']},
    {id:'te6', dom:'test', prompt:'対立仮説の不等号と、片側/両側検定の対応は?', answer:'< または > なら片側(向きは不等号の方向)、≠ なら両側でα/2を使う', note:'', refs:['36th-chi-square-variance.html','35th-variance-test.html','37th-onesided-t-test.html']},
    {id:'te7', dom:'test', prompt:'「あわてもの」と「ぼんやりもの」は、それぞれ第何種の過誤?', answer:'あわてもの = 第一種の過誤(α)、ぼんやりもの = 第二種の過誤(β)', note:'あわてもの=無いのに「ある」と早とちり。', refs:['37th-onesided-t-test.html']},

    {id:'rg1', dom:'reg', prompt:'相関係数 r の式は?', answer:'r = S(xy) / √(S(xx)·S(yy))', note:'', refs:['35th-regression.html','correlation-coefficient.html']},
    {id:'rg2', dom:'reg', prompt:'回帰直線の傾きβ̂1と切片β̂0の式は?', answer:'β̂1 = S(xy)/S(xx)、β̂0 = ȳ − β̂1x̄', note:'', refs:['35th-regression.html','36th-regression.html']},
    {id:'rg3', dom:'reg', prompt:'回帰による平方和 S(R) の式は?', answer:'S(R) = S(xy)² / S(xx)', note:'', refs:['regression-sr.html','40th-regression-anova.html']},
    {id:'rg4', dom:'reg', prompt:'単回帰の分散分析表の自由度φ(R)・φ(e)は?', answer:'φ(R) = 1、φ(e) = n − 2', note:'説明変数1個ぶんが要因側に取られる。', refs:['regression-anova.html','38th-regression-anova.html']},
    {id:'rg5', dom:'reg', prompt:'寄与率 R² の式は?', answer:'R² = S(R) / S(yy)', note:'', refs:['38th-regression-anova.html','regression-r2-se.html']},
    {id:'rg6', dom:'reg', prompt:'回帰係数bの信頼区間の式は?', answer:'b ± t(n−2) · √(V(e)/S(xx))', note:'', refs:['38th-regression-anova.html','regression-r2-se.html']},
    {id:'rg7', dom:'reg', prompt:'符号検定で「相関あり」と判定する条件は?', answer:'少数派の打点数が符号検定表の値より小さければ有意(相関あり)', note:'', refs:['39th-sign-test.html']},

    {id:'ex1', dom:'exp', prompt:'一元配置実験の要因平方和 S(A) の式は?', answer:'S(A) = Σ(T(i)²/n(i)) − CT', note:'T(i)=水準iの合計、CT=修正項。', refs:['35th-anova-experiment.html','36th-anova-oneway.html','39th-anova-unequal.html']},
    {id:'ex2', dom:'exp', prompt:'一元配置実験の自由度φ(A)・φ(E)は?', answer:'φ(A) = a−1、φ(E) = N−a = Σ(n(i)−1)', note:'', refs:['36th-anova-oneway.html','39th-anova-unequal.html']},
    {id:'ex3', dom:'exp', prompt:'分散分析の分散比 F0 の式は?', answer:'F0 = V(A) / V(E)', note:'', refs:['38th-anova-graphs.html','36th-anova-oneway.html']},
    {id:'ex4', dom:'exp', prompt:'1つの水準の母平均の区間推定の式は?', answer:'x̄(i) ± t(φ(E)) · √(V(E)/n(i))', note:'', refs:['37th-anova-ci.html','anova-ve-then-n.html']},
    {id:'ex5', dom:'exp', prompt:'2水準の母平均の差の区間推定の式は?', answer:'(x̄(i)−x̄(j)) ± t(φ(E)) · √{V(E)(1/n(i)+1/n(j))}', note:'', refs:['37th-anova-ci.html','39th-anova-unequal.html']},
    {id:'ex6', dom:'exp', prompt:'二元配置実験の自由度φ(A×B)・φ(E)は?', answer:'φ(A×B) = (a−1)(b−1)、φ(E) = ab(r−1)', note:'', refs:['40th-two-way-anova.html','two-way-anova-df.html']},
    {id:'ex7', dom:'exp', prompt:'交互作用が有意なとき、最適水準の点推定に使う値は?', answer:'加法モデルではなく、そのセルの実測平均をそのまま使う', note:'', refs:['35th-anova-experiment.html']},

    {id:'ch1', dom:'chart', prompt:'X̄管理図のUCL/LCLの式は?', answer:'UCL/LCL = X̄̄ ± A2 · R̄', note:'', refs:['37th-xbar-r-chart.html']},
    {id:'ch2', dom:'chart', prompt:'R管理図のUCLの式と、LCLの注意点は?', answer:'UCL = D4 · R̄。n≤6のときLCLは考えない', note:'D3が定義されない/0になるため。', refs:['37th-xbar-r-chart.html','control-chart-coefficients.html']},
    {id:'ch3', dom:'chart', prompt:'np管理図のCL・UCL/LCLの式は?', answer:'CL = np̄、UCL/LCL = np̄ ± 3√(np̄(1−p̄))', note:'', refs:['40th-np-chart.html','np-chart-variance.html']},
    {id:'ch4', dom:'chart', prompt:'c管理図のCL・UCL/LCLの式は?', answer:'CL = c̄、UCL/LCL = c̄ ± 3√c̄', note:'ポアソン分布は分散=平均なので(1−p̄)が付かない。', refs:['35th-control-chart.html']},
    {id:'ch5', dom:'chart', prompt:'計算上LCLが負になったらどう扱う?', answer:'0ではなく「限界線を考えない(示さない)」として扱う', note:'', refs:['35th-control-chart.html','40th-np-chart.html']},
    {id:'ch6', dom:'chart', prompt:'限界線内でも異常と判定される「連」のルールは?', answer:'中心線の片側に7点以上連続すれば異常と判定する', note:'', refs:['40th-np-chart.html']},

    {id:'cp1', dom:'cpk', prompt:'ヒストグラムの区間幅hの決め方は?', answer:'h = R/k を、測定単位mの整数倍に切り上げる', note:'', refs:['37th-histogram-cp.html']},
    {id:'cp2', dom:'cpk', prompt:'工程能力指数 Cp の式は?', answer:'Cp = (SU − SL) / 6σ', note:'両側規格。中心のズレは考えない。', refs:['37th-histogram-cp.html','38th-normal-cp.html','40th-process-capability.html']},
    {id:'cp3', dom:'cpk', prompt:'CpU・CpLの式は?', answer:'CpU = (SU−x̄)/3σ、CpL = (x̄−SL)/3σ', note:'', refs:['40th-process-capability.html']},
    {id:'cp4', dom:'cpk', prompt:'Cpk の式は?', answer:'Cpk = min(CpU, CpL)', note:'狭い方(悪い方)に合わせる。', refs:['40th-process-capability.html','36th-problem-solving.html']},
    {id:'cp5', dom:'cpk', prompt:'Cp(Cpk)の一般的な判断の目安は?', answer:'≥1.33で十分、1.00〜1.33で不足気味、1.00未満で不足', note:'', refs:['summary-histogram-cpk.html']},

    {id:'z1', dom:'z', prompt:'z値: 裾の確率10%(片側)に対応するzは?', answer:'z = 1.28', note:'下位/上位10%点の計算に使う。', refs:['36th-binomial-normal.html']},
    {id:'z2', dom:'z', prompt:'z値: 片側5%(有意水準5%の片側検定)に対応するzは?', answer:'z = 1.645', note:'', refs:['37th-onesided-t-test.html','40th-mean-variance-test.html']},

  };

  var STORE_KEY = 'qc-formula-drill-v1';
  var state = {stats:{}, totalAnswered:0, totalCorrect:0, streak:0, lap:1, activeDomains:null};

  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        state.stats = parsed.stats || {};
        state.totalAnswered = parsed.totalAnswered || 0;
        state.totalCorrect = parsed.totalCorrect || 0;
        state.lap = parsed.lap || 1;
        state.activeDomains = parsed.activeDomains || null;
      }
    }catch(e){}
  }
  function saveState(){
    try{
      localStorage.setItem(STORE_KEY, JSON.stringify({
        stats: state.stats, totalAnswered: state.totalAnswered,
        totalCorrect: state.totalCorrect, lap: state.lap, activeDomains: state.activeDomains
      }));
    }catch(e){}
  }

  function cardStat(id){
    if(!state.stats[id]) state.stats[id] = {seen:0, correct:0, wrong:0};
    return state.stats[id];
  }

  var activeDomains = {};
  Object.keys(DOMAINS).forEach(function(k){ activeDomains[k] = !DOMAINS[k].bonus; });

  var pool = [];
  var queue = [];
  var current = null;
  var revealed = false;

  function rebuildPool(){
    pool = DECK.filter(function(c){ return activeDomains[c.dom]; });
    queue = shuffle(pool.slice());
    updateDeckInfo();
  }
  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  var domainBadge = document.getElementById('domainBadge');
  var remainBadge = document.getElementById('remainBadge');
  var promptText = document.getElementById('promptText');
  var revealBtn = document.getElementById('revealBtn');
  var answerBlock = document.getElementById('answerBlock');
  var answerText = document.getElementById('answerText');
  var answerNote = document.getElementById('answerNote');
  var answerRefs = document.getElementById('answerRefs');
  var refsList = document.getElementById('refsList');
  var judgeRow = document.getElementById('judgeRow');
  var judgeWrong = document.getElementById('judgeWrong');
  var judgeRight = document.getElementById('judgeRight');
  var deckInfo = document.getElementById('deckInfo');
  var statTotal = document.getElementById('statTotal');
  var statAcc = document.getElementById('statAcc');
  var statStreak = document.getElementById('statStreak');
  var statLap = document.getElementById('statLap');
  var weakList = document.getElementById('weakList');

  function updateDeckInfo(){
    deckInfo.textContent = '対象 '+pool.length+'枚中 残り'+queue.length+'枚(この周)';
  }

  function nextCard(){
    if(queue.length === 0){
      if(pool.length === 0){
        current = null;
        promptText.textContent = '出題範囲を1つ以上選んでください。';
        domainBadge.textContent = '—';
        remainBadge.textContent = '残り —';
        revealBtn.hidden = true;
        judgeRow.hidden = true;
        answerBlock.hidden = true;
        return;
      }
      state.lap++;
      saveState();
      queue = shuffle(pool.slice());
    }
    current = queue.shift();
    revealed = false;
    domainBadge.textContent = DOMAINS[current.dom].short;
    remainBadge.textContent = '残り '+queue.length+'枚';
    promptText.textContent = current.prompt;
    revealBtn.hidden = false;
    answerBlock.hidden = true;
    judgeRow.hidden = true;
    updateDeckInfo();
    renderStats();
  }

  revealBtn.addEventListener('click', function(){
    if(!current) return;
    revealed = true;
    answerText.textContent = current.answer;
    answerNote.textContent = current.note || '';
    answerNote.hidden = !current.note;
    renderRefs(current.refs);
    answerBlock.hidden = false;
    revealBtn.hidden = true;
    judgeRow.hidden = false;
  });

  function renderRefs(fileList){
    if(!fileList || fileList.length === 0){
      answerRefs.hidden = true;
      refsList.innerHTML = '';
      return;
    }
    refsList.innerHTML = fileList.map(function(fname){
      var meta = FILEMETA[fname];
      if(!meta) return '';
      return '<a class="ref-link" href="'+meta.url+'" target="_blank" rel="noopener">'+escapeHtml(meta.label)+'</a>';
    }).join('');
    answerRefs.hidden = false;
  }

  function judge(correct){
    if(!current || !revealed) return;
    var st = cardStat(current.id);
    st.seen++;
    if(correct){ st.correct++; state.streak++; } else { st.wrong++; state.streak = 0; }
    state.totalAnswered++;
    if(correct) state.totalCorrect++;

    if(!correct){
      var reinsertAt = Math.min(queue.length, 2 + Math.floor(Math.random()*3));
      queue.splice(reinsertAt, 0, current);
    }
    saveState();
    nextCard();
  }
  judgeWrong.addEventListener('click', function(){ judge(false); });
  judgeRight.addEventListener('click', function(){ judge(true); });

  function renderStats(){
    statTotal.textContent = state.totalAnswered;
    statAcc.textContent = state.totalAnswered ? Math.round(state.totalCorrect/state.totalAnswered*100)+'%' : '–';
    statStreak.textContent = state.streak;
    statLap.textContent = state.lap;
    renderWeak();
  }

  function renderWeak(){
    var rows = Object.keys(state.stats)
      .map(function(id){
        var st = state.stats[id];
        var card = DECK.filter(function(c){return c.id===id;})[0];
        if(!card || st.seen < 2) return null;
        return {card:card, st:st, rate: st.wrong/st.seen};
      })
      .filter(function(r){ return r && r.rate > 0; })
      .sort(function(a,b){ return b.rate - a.rate; })
      .slice(0,5);

    if(rows.length === 0){
      weakList.innerHTML = '<div class="weak-empty">まだデータがありません。何問か解くと表示されます。</div>';
      return;
    }
    weakList.innerHTML = rows.map(function(r){
      var pct = Math.round(r.rate*100);
      return '<div class="weak-row"><span class="wp">['+DOMAINS[r.card.dom].short+'] '+escapeHtml(r.card.prompt)+'</span><span class="wr">誤答率 '+pct+'%('+r.st.wrong+'/'+r.st.seen+')</span></div>';
    }).join('');
  }
  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var filterChips = document.getElementById('filterChips');
  Object.keys(DOMAINS).forEach(function(key){
    var meta = DOMAINS[key];
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chipbtn' + (meta.bonus ? ' bonus' : '');
    btn.textContent = meta.short + (meta.bonus ? ' +5' : '');
    btn.setAttribute('aria-pressed', activeDomains[key] ? 'true' : 'false');
    btn.addEventListener('click', function(){
      activeDomains[key] = !activeDomains[key];
      btn.setAttribute('aria-pressed', activeDomains[key] ? 'true' : 'false');
      state.activeDomains = activeDomains;
      saveState();
      rebuildPool();
      nextCard();
    });
    filterChips.appendChild(btn);
  });

  var resetBtn = document.getElementById('resetBtn');
  var resetConfirming = false;
  resetBtn.addEventListener('click', function(){
    if(!resetConfirming){
      resetConfirming = true;
      resetBtn.textContent = 'もう一度押すと統計を消去します';
      resetBtn.classList.add('confirm');
      setTimeout(function(){
        resetConfirming = false;
        resetBtn.textContent = '統計をリセット';
        resetBtn.classList.remove('confirm');
      }, 3500);
      return;
    }
    state.stats = {};
    state.totalAnswered = 0;
    state.totalCorrect = 0;
    state.streak = 0;
    state.lap = 1;
    saveState();
    resetConfirming = false;
    resetBtn.textContent = '統計をリセット';
    resetBtn.classList.remove('confirm');
    renderStats();
  });

  loadState();
  if(state.activeDomains){
    Object.keys(activeDomains).forEach(function(k){
      if(typeof state.activeDomains[k] === 'boolean') activeDomains[k] = state.activeDomains[k];
    });
    Array.prototype.forEach.call(filterChips.children, function(btn, idx){
      var key = Object.keys(DOMAINS)[idx];
      btn.setAttribute('aria-pressed', activeDomains[key] ? 'true' : 'false');
    });
  }
  rebuildPool();
  nextCard();
  renderStats();
})();
</script>
