,"field":"信頼性工学","fmt":"mc","stem":"製品を長年使い続け、内部の部品の摩耗や疲労が進んで、時間とともに故障率が上昇していく時期を何と呼ぶか。","options":["摩耗故障期","初期故障期","偶発故障期","定常故障期"],"answer":0,"explanation":"長期間稼働して部品が摩耗・疲労し、寿命が近づいて故障率が上がる時期が摩耗故障期。初期故障期は稼働開始直後で、故障率が時間とともに減っていく時期。偶発故障期は中間の、故障率が低く一定の時期で、時間が経つほど故障率が上がるという特徴はない。故障率が「上がる」のが摩耗、「下がる」のが初期、「一定」が偶発と、傾きで覚える。","src":"解説書 p.390・391(補筆を含む)","conflict":""},{"id":"r40q7n43","round":40,"q":7,"no":43,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"バスタブ曲線で、故障率が低い値のままほぼ一定に推移する中央の期間は、摩耗故障期と呼ばれる。","ok":false,"explanation":"誤り。故障率が低く一定で、いつ不具合が起きてもおかしくない中央の期間は偶発故障期と呼ぶ。摩耗故障期は、部品の摩耗や疲労が進んで故障率が上がる後半の期間で、中央ではない。故障率が「一定」なら偶発、「上がる」なら摩耗と覚える。","src":"解説書 p.390・391","conflict":"","alt":{"stem":"バスタブ曲線で、故障率が低い値のままほぼ一定に推移する中央の期間は、偶発故障期と呼ばれる。","explanation":"正しい。故障率が低く一定で、いつ不具合が起きてもおかしくない中央の期間は偶発故障期と呼ぶ。摩耗故障期は、部品の摩耗や疲労が進んで故障率が上がる後半の期間で、中央ではない。決め手は、故障の原因が偶然の要因で故障率が一定なら偶発、劣化が進んで故障率が上がるなら摩耗という点である。"}},{"id":"r40q7n44","round":40,"q":7,"no":44,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"FMEA(故障モード影響解析)で、故障モードのリスクを評価するとき、影響度と検知の難易度に掛け合わせて算出する要素はどれか。","options":["発生頻度","部品の調達費用","検査の所要時間","生産数量"],"answer":0,"explanation":"FMEAでは、洗い出した故障モードが製品やシステムに与えるリスクを、一般に影響度、発生頻度、検知の難易度の積で評価する。ほかの選択肢は、故障そのもののリスクの大きさを表す要素ではなく、掛け合わせる対象にはならない。FMEAは部品や工程の故障モードから積み上げるボトムアップの手法で、上から掘り下げるFTAとは向きが逆。リスクは「影響度×発生頻度×検知の難易度」と覚える。","src":"解説書 p.391(補筆を含む)","conflict":""},{"id":"r40q8n45","round":40,"q":8,"no":45,"part":"手法","field":"抜取検査","fmt":"mc","stem":"規定された要求事項を満たしていないことを表すJISの用語はどれか。","options":["不適合","故障","誤り","条件外"],"answer":0,"explanation":"JIS Z 8101-2は、要求事項を満たしていないことを「不適合」、一つ以上の不適合があるアイテムを「不適合品」と定義している。故障は、アイテムが要求された機能を遂行する能力を失うことを指し、要求事項を満たさない状態一般をいう語とは違う。誤りや条件外は、この定義に対応するJISの用語ではない。「要求事項を満たさない=不適合」と、要求事項とセットで覚える。JISは日本産業規格の略。","src":"解説書 p.391・392(補筆を含む)","conflict":""},{"id":"r40q8n46","round":40,"q":8,"no":46,"part":"手法","field":"抜取検査","fmt":"mc","stem":"ロットの中に含まれる、規定要求事項を満たしていないアイテムの数を、ロットの大きさで割った値を何というか。","options":["不適合品率","適合品率","抜取率","合格判定率"],"answer":0,"explanation":"不適合品の個数をロット全体の個数で割った値が不適合品率で、ロットに含まれる不適合品の割合を表す。適合品率は、割る前の数が適合品の個数になるので逆の割合になる。抜取率はロットのうち抜き取ったサンプルの割合で、合格判定率という指標は一般には使わない。分子が「不適合品の個数」なら不適合品率と確認する。","src":"解説書 p.391・392","conflict":""},{"id":"r40q8n47","round":40,"q":8,"no":47,"part":"手法","field":"抜取検査","fmt":"tf","stem":"サンプルを測定して得た計量値に演算を行い、事前に求めた基準値と比較して検査ロットの合否を判定する抜取検査を、計数値抜取検査という。","ok":false,"explanation":"誤り。この説明は計量値抜取検査のもの。計数値抜取検査は、サンプルの各アイテムを適合品と不適合品に分け、その個数に基づいて合否を判定する。個数のように数えて得るデータが計数値、長さや重さのように測って得るデータが計量値。決め手は、判定に使うのが「数えた個数」か「測った値」かの違い。","src":"解説書 p.392","conflict":"","alt":{"stem":"サンプルの各アイテムを適合品と不適合品に分け、その個数に基づいて検査ロットの合否を判定する抜取検査を、計数値抜取検査という。","explanation":"正しい。計数値抜取検査は、サンプルの各アイテムを適合品と不適合品に分け、その個数に基づいて合否を判定する。サンプルを測定して得た計量値に演算を行い、基準値と比較して判定するのは計量値抜取検査で、これとは区別する。個数のように数えて得るデータが計数値、長さや重さのように測って得るデータが計量値である。決め手は、判定に使うのが数えた個数か、測った値かという点にある。"}},{"id":"r40q8n48","round":40,"q":8,"no":48,"part":"手法","field":"抜取検査","fmt":"mc","stem":"サンプルを測定して特定の検査項目の計量値を求め、その結果に演算を行い、事前に求めた基準値と比較して検査ロットの合格・不合格を判定する抜取検査はどれか。","options":["計量値抜取検査","計数値抜取検査","全数検査","無検査"],"answer":0,"explanation":"サンプルを測定して得た計量値の結果を使って判定するのが計量値抜取検査。計数値抜取検査は、適合品・不適合品の個数を数えて合否を判定する点が違う。全数検査は、ロットのすべてのアイテムを検査するもので、サンプルを抜き取らない。無検査は検査そのものを行わない。データが「測った値」なら計量値、「数えた個数」なら計数値。","src":"解説書 p.392","conflict":""},{"id":"r40q8n49","round":40,"q":8,"no":49,"part":"手法","field":"抜取検査","fmt":"mc","stem":"抜取検査の生産者危険の説明として、正しいものはどれか。","options":["なるべく合格させたい良いロットが、不合格と判定されてしまう確率である。","なるべく不合格にしたい悪いロットが、合格と判定されてしまう確率である。","合格と判定されたロットの中に、不適合品が含まれている確率である。","サンプルの中に不適合品が一つも含まれない確率である。"],"answer":0,"explanation":"生産者危険は、本来合格させたい不適合品率の上限p0のロットが、不合格にされてしまう確率で、記号はαを使う。生産者は良いロットを通したい立場なので、それが落とされれば不利益になる。悪いロットが合格してしまう確率は消費者危険βの説明で、消費者に不利益が生じる。合格ロットの中に不適合品が含まれている確率や、サンプルに不適合品が一つも含まれない確率は、ロットを合否判定する誤りの確率ではない。生産者=良いロットが落ちる=α、消費者=悪いロットが通る=β。","src":"解説書 p.392","conflict":""},{"id":"r40q8n50","round":40,"q":8,"no":50,"part":"手法","field":"抜取検査","fmt":"tf","stem":"消費者危険βは、なるべく不合格としたい不適合品率の高いロットが、不合格と判定される確率である。","ok":false,"explanation":"誤り。消費者危険は、不適合品率がp1のような、本来は不合格とすべきロットが「合格」と判定されてしまう確率。悪いロットが通ってしまうと、それを受け取る消費者に不利益を与えるため、消費者危険と呼ぶ。不合格と判定されるのは正しい判断であり、危険ではない。悪いロットが通る誤りが消費者危険と覚える。","src":"解説書 p.392","conflict":"","alt":{"stem":"消費者危険βは、なるべく不合格としたい不適合品率の高いロットが、合格と判定される確率である。","explanation":"正しい。消費者危険は、不適合品率がp1のような本来は不合格とすべきロットが合格と判定されてしまう確率である。悪いロットが通ると受け取る消費者に不利益を与えるためこう呼ぶ。不合格と判定されるのは正しい判断で、危険ではない。"}},{"id":"r40q9n51","round":40,"q":9,"no":51,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"顧客のニーズを満たす製品やサービスを提供するために、企画や設計より前にまず行うべきことはどれか。","options":["顧客のニーズを的確に把握すること","販売価格を確定すること","検査基準を標準化すること","出荷後の回収計画を立てること"],"answer":0,"explanation":"ニーズを満たす製品やサービスを提供するには、まず顧客のニーズを知り、理解すること、つまり把握が出発点になる。把握したニーズは、その次の段階である企画や設計に反映する。販売価格の確定、検査基準の標準化、回収計画は、いずれも製品像が決まったあとの活動なので、最初に行うことではない。「ニーズの把握→企画・設計に反映→そのとおりに生産・提供」の順に覚える。","src":"解説書 p.393","conflict":""},{"id":"r40q9n52","round":40,"q":9,"no":52,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品開発で、把握した顧客のニーズを反映させる上流の段階として、設計とともに挙げられるものはどれか。","options":["企画","販売","保守・修理","回収"],"answer":0,"explanation":"顧客のニーズは、新製品開発の次の段階である企画や設計に反映される。販売、保守・修理、回収は製品ができあがったあとの下流の活動で、ニーズを製品像へ落とし込む段階ではない。ニーズは企画・設計という上流に入れると覚える。","src":"解説書 p.393(補筆を含む)","conflict":""},{"id":"r40q9n53","round":40,"q":9,"no":53,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"市場調査から製品やサービスの実現、販売、保守・修理、回収、廃棄に至る一連の活動を意図どおりに実践し、顧客に提供する製品やサービスの品質を保証する考え方はどれか。","options":["プロセス保証","結果保証","全数検査","源流管理"],"answer":0,"explanation":"市場調査から廃棄までの一連の活動は、すべて品質にかかわるプロセスであり、それらを意図どおりに実践して品質を保証するのがプロセス保証。結果保証は、できあがった製品を検査して品質を確かめる考え方で、プロセスの管理を通じて保証するプロセス保証とは重点が違う。全数検査は検査の方法の一つで、保証の考え方そのものではない。源流管理は問題の起きる上流で手を打つ考え方で、一連の活動を実践する保証とは別。「途中の活動で品質を作り込み、保証する」がプロセス保証。","src":"解説書 p.393(補筆を含む)","conflict":""},{"id":"r40q9n54","round":40,"q":9,"no":54,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"JISで、インプットをアウトプットに変換する、相互に関連する、または相互に作用する一連の活動を指す用語はどれか。","options":["プロセス","品質保証","標準","要求事項"],"answer":0,"explanation":"インプットをアウトプットに変換する、相互に関連する一連の活動がプロセス。品質保証体系図には、製品やサービスの提供にかかわるこのプロセスがまとめられる。品質保証は、品質要求事項が満たされるという確信を与えることに焦点を合わせた品質マネジメントの一部で、インプットをアウトプットに変換する活動そのものを指す語ではない。標準は決められた取り決め、要求事項は満たすべき事項を指す。「入れたものを出すものに変える活動=プロセス」と覚える。JISは日本産業規格の略。","src":"解説書 p.393(補筆を含む)","conflict":""},{"id":"r40q9n55","round":40,"q":9,"no":55,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製品やサービスの提供にかかわるプロセスを体系図にまとめ、各部門が意図どおりに実行できるようにする。この図は、何を確実にするために活用されるか。","options":["品質保証","品質方針の策定","年度方針の各階層への展開","原価低減"],"answer":0,"explanation":"品質保証体系図は、プロセスを一覧にまとめ、各部門が意図どおりに実行して品質を保証できるようにするための図である。品質方針の策定は経営層が行う品質の方向づけで、体系図の目的ではない。年度方針の各階層への展開は方針管理の役割で、プロセスの実行を確実にする図とは別。原価低減は別の経営目的である。決め手は、プロセスを体系図にまとめて各部門が意図どおりに実行できるようにし、品質を保証すること。","src":"解説書 p.394","conflict":""},{"id":"r40q9n56","round":40,"q":9,"no":56,"part":"実践","field":"品質保証:新製品開発","fmt":"tf","stem":"品質保証体系図では、部門を縦軸に、時系列的な段階を横軸にとる。","ok":false,"explanation":"誤り。品質保証体系図は、企画から設計、生産準備、生産、販売、保守へと進む時系列的な段階を縦軸にとり、部門を横軸にとる。縦軸と横軸が入れ替わっている点が誤り。段階を縦軸に置くことで、活動の順序と流れが明確になる。「段階は縦、部門は横」と覚える。","src":"解説書 p.394","conflict":"","alt":{"stem":"品質保証体系図では、時系列的な段階を縦軸に、部門を横軸にとる。","explanation":"正しい。品質保証体系図は、企画から設計、生産準備、生産、販売、保守へと進む時系列的な段階を縦軸にとり、部門を横軸にとる。段階を縦軸に置くことで、活動の順序と流れが明確になる。縦軸と横軸を入れ替えた記述は誤りである。決め手は、製品が顧客に届くまでの活動の順序と各部門の役割を一目で示すという目的である。"}},{"id":"r40q9n57","round":40,"q":9,"no":57,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"品質保証体系図を使うと、時系列的な段階と部門を合わせて、組織として実施すべきことやそのつながりの全体像を、上から広く見渡して捉えられる。この見方を表す語はどれか。","options":["俯瞰","仰視","フィードバック","フィードフォワード"],"answer":0,"explanation":"俯瞰は、上から広い範囲を見下ろし、物事の全体像を捉えること。仰視は下から上を見上げることで、全体をつかむ見方ではない。フィードバックは結果を原因側へ返して修正する考え方、フィードフォワードは予測に基づいて先回りして手を打つ考え方で、どちらも制御の考え方であり、全体像を見渡す見方ではない。全体像を上から見渡すなら俯瞰と覚える。","src":"解説書 p.394","conflict":""},{"id":"r40q10n61","round":40,"q":10,"no":61,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"現場で工程の現状を見極めるため、事実を示すデータを集めて数値化し、解析して改善を行い、改善の効果もデータで評価して管理する考え方はどれか。","options":["事実に基づく管理","重点指向","プロセス管理","源流管理"],"answer":0,"explanation":"データや事実に基づいて管理し、改善の効果もデータで評価する考え方が「事実に基づく管理」で、ファクト・コントロールとも呼ばれる。重点指向は、効果の大きい問題に絞って資源を集中する考え方で、データで判断することそのものではない。プロセス管理は、結果だけを追わず、結果を生む仕事の過程を管理する考え方。源流管理は、問題が起きる上流で対策を打つ考え方。決め手は「事実を示すデータで判断・評価する」という点。","src":"解説書 p.395・396","conflict":""},{"id":"r40q10n65","round":40,"q":10,"no":65,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"製品やサービスに対する顧客の信頼と満足を得るために、全部門が協力し、一人ひとりが自分の業務の中で品質に影響する項目を常に考えて仕事を進める。この根底にある考え方はどれか。","options":["全員参加","人間性尊重","教育・訓練","5S活動"],"answer":0,"explanation":"各組織・各階層の人がそれぞれの役割を果たし、協力して組織全体で最大の効果を出すのが「全員参加」。この文のキーワードは、全部門と協力である。人間性尊重は、人の自主性や満足、活力ある組織づくりに着目する考え方で、全部門の協力という視点とは焦点が違う。教育・訓練や5S活動は、活動や手段の名前であり、考え方の名前ではない。「全部門・協力」なら全員参加、「満足・自主性」なら人間性尊重と対で覚える。","src":"解説書 p.397","conflict":""},{"id":"r40q11n66","round":40,"q":11,"no":66,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"工程図記号で、二つの要素工程がもつ機能が一つの工程で同時にとられる場合に、それぞれの記号を重ねて図示する記号を何というか。","options":["複合記号","臨時記号","特別記号","追加記号"],"answer":0,"explanation":"二つの要素工程の機能や状態が、一つの要素工程で同時にとられるとき、それぞれの記号を組み合わせて一つの記号にしたものが複合記号。主となる要素工程の記号を外側、従となる要素工程の記号を内側に示す。臨時記号、特別記号、追加記号は、工程図記号の区分として定められた語ではない。「機能を複数合わせる=複合」と覚える。","src":"解説書 p.397・398(補筆を含む)","conflict":""},{"id":"r40q11n67","round":40,"q":11,"no":67,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"工程図記号で、加工を主とする工程が、同時に品質特性を試験して基準と比較し、合格・不合格や良不良を判定する機能も併せもつ。加工に重ねて示すこの機能の基本図記号はどれか。","options":["品質検査","数量検査","運搬","貯蔵"],"answer":0,"explanation":"品質特性を試験し、その結果を基準と比べて合否や良不良を判定する過程が品質検査で、これを内側に入れると、加工を行いながら品質検査も行う工程を示す。数量検査は、量や個数を測って基準と比較する過程で、品質特性を試験して合否を判定するものとは違う。運搬は位置を変える過程、貯蔵は計画により貯える過程で、検査ではない。決め手は、検査が調べる対象が「品質特性」か「量・個数」かの違い。","src":"解説書 p.397・398","conflict":""},{"id":"r40q11n68","round":40,"q":11,"no":68,"part":"実践","field":"管理図","fmt":"mc","stem":"製品の表面に生じる小さな凹みがある製品の数を用いて工程の状態を評価するとき、管理図は、データの種類による分類でどれにあたるか。","options":["計数値管理図","計量値管理図","数量管理図","品質管理図"],"answer":0,"explanation":"凹みがある製品の個数は、数えて得るデータなので計数値で、使う管理図は計数値管理図。計量値管理図は、厚みや重さのように測って得るデータに使う。数量管理図や品質管理図という分類はない。「数えるなら計数値、測るなら計量値」と、データのつくり方で区別する。","src":"解説書 p.398・399(補筆を含む)","conflict":""},{"id":"r40q11n69","round":40,"q":11,"no":69,"part":"実践","field":"管理図","fmt":"mc","stem":"毎日同じ大きさのサンプルを取り、凹みのある製品の個数をそのまま打点して管理したい。管理限界線が直線になり見やすい管理図はどれか。","options":["np管理図","p管理図","c管理図","u管理図"],"answer":0,"explanation":"群の大きさが一定で、不適合品の個数をそのまま打点するのがnp管理図で、管理限界線が直線になる。p管理図は不適合品率を打点し、群の大きさが変わる場合にも使える。この問題の決め手は「個数をそのまま打点する」点である。c管理図とu管理図は、製品の個数ではなく、凹みなどの不適合の数(欠点数)を扱う。「個数=n」に「p」を掛けた形で、np=不適合品の個数と覚える。","src":"解説書 p.398・399(補筆を含む)","conflict":""},{"id":"r40q11n70","round":40,"q":11,"no":70,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"QC工程図は、材料供給から完成品になるまでの個別工程を工程図記号で図示し、工程の流れに沿って各工程で何を明らかにしたものか。","options":["管理項目","回帰式","パレート図","リスク"],"answer":0,"explanation":"QC工程図には、各工程で管理すべき項目が示され、その管理項目をどのように管理するかも併せて明記される。回帰式は変数間の関係を式にしたもの、パレート図は項目を大きい順に並べる道具で、工程ごとに明示するものではない。リスクも、QC工程図の記載事項ではない。「工程ごとの管理項目とその管理方法」がセットで書かれた表と覚える。","src":"解説書 p.399・407","conflict":""},{"id":"r40q11n71","round":40,"q":11,"no":71,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"QC工程図で、各工程の管理項目とあわせて明記される、その管理項目をどのように管理するかの内容はどれか。","options":["管理方法","回避法","標準偏差","散布図"],"answer":0,"explanation":"QC工程図は、各工程の管理項目を定め、その管理項目に対する管理方法(や管理頻度)を明記する。回避法は、リスクへの対応の一種で、管理項目の管理のやり方ではない。標準偏差はばらつきの大きさを表す統計量、散布図は二つの変数の関係を見る道具で、どちらも管理のやり方を指す語ではない。「何を管理するか=管理項目、どう管理するか=管理方法」と対で覚える。","src":"解説書 p.399","conflict":""},{"id":"r40q11n72","round":40,"q":11,"no":72,"part":"実践","field":"その他手法(QC七つ道具・工程能力指数)","fmt":"mc","stem":"製品の厚みを自動で計測し、データのばらつきによる分布の形を視覚的に把握するために自動で作図するグラフはどれか。","options":["ヒストグラム","散布図","パレート図","管理図"],"answer":0,"explanation":"計測した値を区間ごとに数えて柱の高さで表し、分布の形を確認するのがヒストグラム。規格値や平均値の線を書き込めば、平均が規格に対してずれていないかもわかる。散布図は二つの変数の関係、パレート図は項目別の大きさの比較を見る道具で、一つの特性の分布の形を見るものではない。管理図は工程が管理状態かを時間順に見るグラフ。決め手は、見たいものが「分布の形」であること。","src":"解説書 p.399","conflict":""},{"id":"r40q11n73","round":40,"q":11,"no":73,"part":"実践","field":"その他手法(QC七つ道具・工程能力指数)","fmt":"mc","stem":"生産している製品の厚みが、規格の許容範囲に十分入って余裕があるかどうかを、一つの数値で確認するのに算出する指標はどれか。","options":["工程能力指数","標準偏差","回帰式","相関係数"],"answer":0,"explanation":"工程能力指数は、規格の幅に対して、工程のばらつきがどれだけ収まっているか、つまり余裕があるかを表す指数。標準偏差は、ばらつきの大きさを表すだけで、規格との比較はしない。回帰式や相関係数は、二つの変数の関係を扱うもので、規格に対する余裕を見る指標ではない。「規格に対する余裕」を一つの数値で示すのが工程能力指数と覚える。","src":"解説書 p.399(補筆を含む)","conflict":""},{"id":"r40q12n74","round":40,"q":12,"no":74,"part":"実践","field":"方針管理","fmt":"mc","stem":"経営層は、顧客に提供する製品やサービスの品質についての基本的な考え方を、品質方針として示す。この品質方針を指針として、新製品で達成すべき水準として具体的に定めるものはどれか。","options":["品質目標","納期短縮","コンプライアンス","管理項目"],"answer":0,"explanation":"品質方針は、新製品の品質目標や、すでに実績のある現行製品の品質改善計画を立てるときの基本的な指針になる。方針が向かう先を具体的な目標にしたものが品質目標である。管理項目は、目標の達成状況や実施の状況を測るために選ぶ項目であり、方針から導かれる「目指す水準」そのものではない。納期短縮やコンプライアンスは、品質に関する方針の具体化としては筋が違う。覚え方は、方針が方向、目標が到達点。","src":"解説書 p.399","conflict":""},{"id":"r40q12n75","round":40,"q":12,"no":75,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針を経営層だけで決めず、案を各部門に検討してもらい、その意見を経営層に返して修正し、年度の方針を決めていく進め方をキャッチボールという。経営層から現場の第一線までの全階層の人が方針づくりに関わるこの進め方は、経営層の意図を伝えて意欲を高めるほか、企業の体質改善にも大きく貢献する。方針づくりへのこうしたかかわり方を表す語はどれか。","options":["全員参加","納期短縮","分業体制","顧客"],"answer":0,"explanation":"案のやり取りを通じて、経営層から現場までの全員が方針づくりに関わることになる。これが全員参加で、企業の体質改善にもつながる。顧客は品質を考えるうえでの相手であって、社内で方針を練り上げる過程の特徴を表す語ではない。納期短縮は達成をめざす目標の一つで、分業体制は仕事の分け方であり、どちらも全階層が方針づくりに関わるかかわり方を表す語ではない。覚え方は、キャッチボールは上下のやり取りなので、皆が関わる全員参加。","src":"補筆","conflict":""},{"id":"r40q12n76","round":40,"q":12,"no":76,"part":"実践","field":"方針管理","fmt":"tf","stem":"方針管理のキャッチボールでは、経営層が作成した方針案を各事業部や各部課が検討する際、職場第一線の意見はなるべく取り入れないようにして検討を行うことが重要である。","ok":false,"explanation":"誤り。各事業部や各部課で検討するときには、職場第一線の意見もできるだけ取り入れ、その結果を経営層にフィードバックして、必要なら修正したうえで次年度の方針を決める。現場の意見を取り入れることが、意図の伝達と従業員の意欲向上、ひいては全員参加につながる。覚え方は、キャッチボールは投げっぱなしにせず、現場から返ってくる。","src":"補筆","conflict":"","alt":{"stem":"方針管理のキャッチボールでは、経営層が作成した方針案を各事業部や各部課が検討する際、職場第一線の意見もできるだけ取り入れて検討を行うことが重要である。","explanation":"正しい。各事業部や各部課で検討するときには、職場第一線の意見もできるだけ取り入れ、その結果を経営層にフィードバックして、必要なら修正したうえで次年度の方針を決める。現場の意見を取り入れることが、意図の伝達と従業員の意欲向上、ひいては全員参加につながる。覚え方は、キャッチボールは投げっぱなしにせず、現場から返ってくる。"}},{"id":"r40q12n77","round":40,"q":12,"no":77,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針は、目的、目標値、方策の三つで構成される。このうち、従来のやり方の延長では達成できないような画期的な水準を示し、関係者の意欲と創造性を引き出すのがよいとされる要素はどれか。","options":["目標値","方策","管理項目","コンプライアンス"],"answer":0,"explanation":"画期的な水準を示して挑戦意欲をかき立てるのは、達成すべき水準を示す目標値の役割である。方策は、目的を納得したうえで「どのような方法を用いるか」を示す要素で、水準そのものではない。管理項目は、結果や実施状況を測るために選ぶ項目であり、方針の構成要素には入らない。覚え方は、水準を示すのが目標値、手段を示すのが方策。","src":"補筆","conflict":""},{"id":"r40q12n78","round":40,"q":12,"no":78,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針を構成する要素のうち、目的を十分に納得したうえで、どのような方法を用いるのかを示すものはどれか。この要素の成果を評価するときは、達成度とあわせて、画期的な改善がなされたプロセスも評価することが大切である。","options":["方策","目標値","管理項目","品質目標"],"answer":0,"explanation":"「どのような方法で達成するか」を示すのが方策で、成果の評価では結果の達成度だけでなく、そこに至るプロセスの改善も見る。目標値は達成すべき水準を示す要素で、手段ではない。品質目標は品質に関する目標であり、方針の構成要素として方法を示すものではない。管理項目は、結果や実施状況を測るための項目にとどまる。覚え方は、水準が目標値、手段が方策。","src":"補筆","conflict":""},{"id":"r40q13n80","round":40,"q":13,"no":80,"part":"実践","field":"機能別管理","fmt":"tf","stem":"機能別管理で扱う経営基本要素は品質、コスト、量、納期に限られ、安全、環境、人材育成などは対象に含まれない。","ok":false,"explanation":"誤り。経営基本要素は、広義の品質として管理するQCD+PSME、すなわち品質、コスト、納期、量、安全、士気・倫理・人材育成、環境などと同じ内容と考えられている。したがって安全、環境、人材育成も機能別管理の対象になる。「限られる」という言い切りが誤りの1点で、要素は品質・コスト・量・納期にとどまらない。覚え方は、QCDに加えてPSMEまで含めた要素ごとに管理する。","src":"解説書 p.401","conflict":"","alt":{"stem":"機能別管理で扱う経営基本要素には、品質、コスト、量、納期のほか、安全、環境、人材育成なども含まれる。","explanation":"正しい。経営基本要素は、広義の品質として管理するQCD+PSME、すなわち品質、コスト、納期、量、安全、士気・倫理・人材育成、環境などと同じ内容と考えられている。したがって安全、環境、人材育成も機能別管理の対象になる。要素は品質・コスト・量・納期にとどまらない。"}},{"id":"r40q13n81","round":40,"q":13,"no":81,"part":"実践","field":"機能別管理","fmt":"mc","stem":"組織全体での対応が必要な経営基本要素の改善活動を推進するには、そのための役割、責任、権限、力量をもつ人が必要である。機能別管理において、これが本来の職務にあたるのは誰か。","options":["トップマネジメント","第三者","供給者","品質管理部門"],"answer":0,"explanation":"組織全体にまたがる要素を動かせる立場にあるのはトップマネジメントで、本来はその職務である。機能別委員会は、それを代行する組織という位置づけになる。第三者は外部の立場、供給者は納入側の相手であり、社内で組織全体の改善を推進する役割ではない。品質管理部門は一部門にすぎず、部門横断の権限をもつとは限らない。覚え方は、全社にまたがる話はトップの仕事。","src":"解説書 p.401","conflict":""},{"id":"r40q14n83","round":40,"q":14,"no":83,"part":"実践","field":"診断・監査","fmt":"mc","stem":"顧客から示された個別の要求仕様に適合させるために、工程の中で管理する対象として定める特性を、何というか。","options":["管理項目","受入検査項目","品質マニュアル","設計書"],"answer":0,"explanation":"要求仕様に適合させるために管理すべき特性として設定するものが管理項目で、これを明示することが品質保証の第一歩になる。受入検査項目は受け入れる側が確認する項目で、自社の工程で管理する対象を指す語ではない。品質マニュアルと設計書は、特性そのものではなく文書の名前である。覚え方は、管理する特性を決めたら管理項目、それを手順に落とすのが標準書。","src":"解説書 p.402","conflict":""},{"id":"r40q14n84","round":40,"q":14,"no":84,"part":"実践","field":"診断・監査","fmt":"mc","stem":"材料の選定、加工の手順、加工後の検査の手順とその判断根拠などを明示し、作業を進める基準として作成する文書はどれか。","options":["標準書","品質マニュアル","設計書","検査記録"],"answer":0,"explanation":"作業のやり方や判断の基準を具体的に定めた文書が標準書。品質マニュアルは、組織の品質マネジメントシステムの全体像を示す文書であり、個々の作業手順を書くものではない。設計書は製品の仕様や構造を定める文書。検査記録は、検査を行った結果を残すもので、作業の基準を定める文書ではない。覚え方は、作業の基準なら標準書。","src":"解説書 p.402","conflict":""},{"id":"r40q14n85","round":40,"q":14,"no":85,"part":"実践","field":"診断・監査","fmt":"tf","stem":"設備の不具合が原因で不適合品が出たとき、原因となった部品の設計を見直し、同じ不具合が起きないようにする対策は、応急措置にあたる。","ok":false,"explanation":"誤り。原因を根本から取り除き、再発を防ぐ対策は恒久措置である。応急措置は、恒久的な対策が済むまでの間、いま起きている不適合品の流出を止めるための暫定的な手当てで、不具合品の選別や設備の一時停止などがそれにあたる。決め手は時間軸で、根を断って再発を防ぐなら恒久、当面の流出を止めるなら応急。","src":"解説書 p.402","conflict":"","alt":{"stem":"設備の不具合が原因で不適合品が出たとき、原因となった部品の設計を見直し、同じ不具合が起きないようにする対策は、恒久措置にあたる。","explanation":"正しい。原因を根本から取り除き、再発を防ぐ対策が恒久措置である。応急措置は、恒久的な対策が済むまでの間、いま起きている不適合品の流出を止めるための暫定的な手当てで、不具合品の選別や設備の一時停止などがそれにあたる。決め手は時間軸で、根を断って再発を防ぐなら恒久、当面の流出を止めるなら応急。"}},{"id":"r40q14n87","round":40,"q":14,"no":87,"part":"実践","field":"診断・監査","fmt":"mc","stem":"内部監査を、規格で定められた厳密な意味での監査としてだけでなく、被監査側が自ら気づいて改善に向かうよう、対話で支援する場ととらえることがある。この対話による支援の手法を何というか。","options":["コーチング","見える化","数値化","ブレーンストーミング"],"answer":0,"explanation":"相手の話を聴いて質問を重ね、本人が自分で課題に気づき、解決に動けるよう支援する手法がコーチングである。内部監査を厳密な適合確認だけでなく、改善のための機会ととらえるときに使える考え方になる。見える化は状況を目に見える形にすること、数値化は数字で表すことで、対話で気づきを促す手法ではない。ブレーンストーミングは、集団でアイデアを多く出す手法で、被監査側の気づきを支援するものではない。覚え方は、教えるより気づかせるのがコーチング。","src":"解説書 p.402(コーチングの説明は補筆を含む)","conflict":""},{"id":"r40q14n88","round":40,"q":14,"no":88,"part":"実践","field":"診断・監査","fmt":"mc","stem":"内部監査は、規格に定められた厳密な意味での監査というより、対話を通じて何を改善するための場ととらえることもできるか。","options":["プロセス","監査計画","規格の要求事項","被監査部門の担当者"],"answer":0,"explanation":"内部監査は、不適合を見つけて指摘するだけでなく、仕事の進め方であるプロセス(インプットをアウトプットに変換する一連の活動)を改善する機会になる。監査計画や規格の要求事項は、監査を行う際の枠組みや基準であり、対話を通じて改善する対象ではない。被監査部門の担当者は、対話の相手であって、改善する対象は担当者本人ではなく仕事の進め方である。覚え方は、内部監査はできているかの確認に加え、プロセスをよくする場。","src":"解説書 p.402","conflict":""},{"id":"r40q14n89","round":40,"q":14,"no":89,"part":"実践","field":"診断・監査","fmt":"mc","stem":"内部監査を実施するときは、個人の感想や推測ではなく、誰が確認しても同じだと認められる事実関係を明確にすることに力を入れる。この事実関係に求められる性質はどれか。","options":["客観的","定量的","コーチング","稼働率"],"answer":0,"explanation":"監査では、監査する人の主観に左右されない、客観的な事実を明確にすることが基本である。定量的とは数値で表せることだが、事実は数値で表せるものだけではなく、観察や記録で確かめられる事実も含まれるため、事実に求める性質の答えにはならない。コーチングは対話による支援の手法、稼働率は設備の指標で、事実の性質を表す語ではない。覚え方は、監査の事実は客観的、姿勢は公正性。","src":"解説書 p.402(前後の続きは次ページ。補筆を含む)","conflict":""},{"id":"r40q15n91","round":40,"q":15,"no":91,"part":"実践","field":"品質管理周辺の実践活動","fmt":"mc","stem":"生産設備を導入するとき、製品の使用・加工条件、設備の用途、保全性、安全・衛生、環境、省エネルギーなどとの関係を考慮して、その目的に応じて設定しておくものはどれか。","options":["選定基準","管理項目","標準書","予防保全"],"answer":0,"explanation":"設備の導入時に、その設備を選ぶ判断のよりどころとして明確にしておくものが選定基準で、導入後の保全基準とあわせて定める。管理項目は、工程で管理する特性のことで、導入時の選択基準ではない。標準書は作業のやり方を定める文書。予防保全は導入後に行う保全の活動そのものであり、導入前に設定する基準ではない。覚え方は、買う前が選定基準、使い始めてからが保全基準。","src":"補筆","conflict":""},{"id":"r40q15n92","round":40,"q":15,"no":92,"part":"実践","field":"品質管理周辺の実践活動","fmt":"mc","stem":"生産設備は使用とともに損耗し、性能や精度が低下していく。放置すると生産能率が落ちるだけでなく、製品の品質低下にもつながる。生産管理の一環としての設備の管理の進め方として最も適切なものはどれか。","options":["設備が不調になる前から、部品や要員を確保して計画的に管理する。","設備が不調になってから、原因を調べて修理する。","不適合な製品が出はじめたときにだけ、集中して点検する。","設備の管理は現場の作業者の判断にまかせ、組織としての計画は立てない。"],"answer":0,"explanation":"設備の損耗と劣化は避けられないので、状態が良いうちから、部品や要員を確保する態勢も含めて計画的に管理しておかなければ、不測の事態に対応できない。不調になってから、または不適合が出てから動くのは事後の対応で、損失が出たあとになる。作業者まかせで計画を立てないのも、生産管理の一環としての管理にならない。覚え方は、設備管理は壊れてからでなく、良いうちから計画的に。","src":"解説書 p.404","conflict":""},{"id":"r40q15n93","round":40,"q":15,"no":93,"part":"実践","field":"品質管理周辺の実践活動","fmt":"mc","stem":"設備に故障が起きたり、不適合な製品が生産され始めたりしてからでは遅い。故障を予測して事前に計画的な保全を行うために、設備の性能・精度についてまず必要なことはどれか。","options":["性能・精度の現状を把握する。","性能・精度の向上を模索する。","設備の台数を作業者と同数にそろえる。","保全を特定の期間に集中的に実施する。"],"answer":0,"explanation":"設備の状態を監視し、故障に至る前の早い段階で兆候を捉えるには、性能・精度の現状を把握しておく必要がある。この情報が、故障の予測に必要な材料になる。向上を模索するのは改善の話で、故障を予測する準備にはならない。設備の台数を作業者と同数にそろえたり、保全を集中的に行ったりすることも、予測とは関係がない。覚え方は、予測の前提は現状把握。","src":"解説書 p.404","conflict":""},{"id":"r40q15n94","round":40,"q":15,"no":94,"part":"実践","field":"品質管理周辺の実践活動","fmt":"mc","stem":"設備の始業点検や給油、定期的なオーバーホールなどを通じて、設備のトラブルや故障を未然に防ぎ、稼働停止や損失を避ける。故障の予測をめざして、事前に計画的に保全を進める活動を何というか。","options":["予防保全","事後保全","改良保全","保全予防"],"answer":0,"explanation":"故障やトラブルを起こさないよう、あらかじめ計画的に保全することが予防保全である。事後保全は、故障してから直すやり方で、ここでは逆である。改良保全は、故障しにくい設備に改良する保全で、日常の点検や給油ではない。保全予防は、設計の段階から保全の手間が少ない設備にしておく活動で、名前が似ているがこの説明とは別。覚え方は、壊れる前に計画的に行うのが予防保全。","src":"解説書 p.404","conflict":""},{"id":"r40q16n95","round":40,"q":16,"no":95,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"JIS Q 9000で、品質は「対象に本来備わっている特性の集まりが、何を満たす程度」と定義されている。顧客や社会の何を満たす程度か。","options":["要求事項","規格","顧客満足","利害関係者"],"answer":0,"explanation":"品質は、本来備わっている特性の集まりが要求事項を満たす程度である。要求事項は、明示されたもの、暗黙のうちに了解されたもの、義務として要求されているものを含む。規格は要求事項の一部を文書にしたものにすぎず、品質の定義の相手にはならない。顧客満足は、顧客の期待が満たされている程度を指す別の概念。利害関係者は満たす相手の側の人を指す語。覚え方は、品質は要求事項を満たす程度。JISは日本産業規格の略。","src":"補筆","conflict":""},{"id":"r40q16n96","round":40,"q":16,"no":96,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"適切な力量をもち権限を与えられた人々が積極的に関わることで、顧客や社会に対する価値を創造し提供する、組織の能力を強化する。この考え方に対応する品質マネジメントの原則はどれか。","options":["人々の積極参加","リーダーシップ","関係性管理","プロセスアプローチ"],"answer":0,"explanation":"人々の積極参加は、力量があり、権限を与えられた人々が積極的に関わることが、価値を生み出す組織の能力を強化するために不可欠だとする原則。リーダーシップは、目的と方向を一致させ、人々がそれに参画する状況をつくる原則。関係性管理は、供給者などの利害関係者との関係を管理する原則。プロセスアプローチは、活動を相互に関連するプロセスとして管理する考え方。覚え方は、人に着目するなら積極参加、方向づけならリーダーシップ。","src":"補筆","conflict":""},{"id":"r40q16n97","round":40,"q":16,"no":97,"part":"実践","field":"品質マネジメントシステム","fmt":"tf","stem":"品質マネジメントの原則の人々の積極参加は、品質管理部門の人たちが適切な力量をもち権限を与えられることで、顧客や社会に対する価値を創造し提供する組織の能力を強化する、という考え方である。","ok":false,"explanation":"誤り。対象は品質管理部門の人たちに限らず、組織の全階層の人々である。全階層の人たちが力量をもち、権限を与えられて積極的に参加してはじめて、組織全体の価値創造の能力が強化される。特定の部門だけに任せると、その部門の外で品質の作り込みが行われなくなる。覚え方は、積極参加は一部の部門ではなく全階層。","src":"補筆","conflict":"","alt":{"stem":"品質マネジメントの原則の人々の積極参加は、組織の全階層の人々が適切な力量をもち権限を与えられることで、顧客や社会に対する価値を創造し提供する組織の能力を強化する、という考え方である。","explanation":"正しい。対象は品質管理部門の人たちに限らず、組織の全階層の人々である。全階層の人たちが力量をもち、権限を与えられて積極的に参加してはじめて、組織全体の価値創造の能力が強化される。特定の部門だけに任せると、その部門の外で品質の作り込みが行われなくなる。決め手は、積極参加の対象が一部の部門ではなく全階層にある点である。"}},{"id":"r40q16n98","round":40,"q":16,"no":98,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"組織の品質マネジメントシステムが規格に適合しているかを、第三者の立場で審査するのはどれか。","options":["認証機関","標準化団体","監査法人","内部監査"],"answer":0,"explanation":"品質マネジメントシステムの認証審査を行う第三者が認証機関である。標準化団体は規格そのものを作成・発行する団体で、個々の組織を審査するものではない。監査法人は主に財務諸表などの会計の監査を行う組織で、品質マネジメントシステムを審査する立場ではない。内部監査は組織自身が行う監査で、第三者ではない。覚え方は、第三者が審査するなら認証機関。","src":"補筆","conflict":""},{"id":"r40q16n99","round":40,"q":16,"no":99,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"第三者による認証審査は、顧客をはじめとする様々な立場の者に代わって、供給者の品質マネジメントシステムを評価するものである。この様々な立場の者を総称する用語はどれか。","options":["利害関係者","供給者","標準化団体","監査法人"],"answer":0,"explanation":"組織の活動や成果に利害をもつ顧客や社会などをまとめて利害関係者という。個々の顧客がすべての供給者を審査するのは現実的でないため、認証機関が利害関係者に代わって評価する。供給者は評価される側の組織で、代わって評価してもらう側ではない。標準化団体は規格を作る団体、監査法人は会計監査を行う組織で、評価を頼む側の総称ではない。覚え方は、認証は皆の代わりに審査するもの。","src":"補筆","conflict":""},{"id":"r40q16n100","round":40,"q":16,"no":100,"part":"実践","field":"品質マネジメントシステム","fmt":"tf","stem":"認証機関は、供給者の品質マネジメントシステムを、その供給者の社内標準に基づいて評価し、要求を満たしているかどうかを判断する。","ok":false,"explanation":"誤り。認証審査で評価の物差しになるのは、ISO 9001などの規格である。社内標準は組織が自分で定めた基準なので、社内標準を満たすかどうかを判断しても、利害関係者の代わりに評価したことにならない。規格という共通の基準に基づくからこそ、認証結果が信頼できる。覚え方は、認証は社内標準ではなく規格で評価する。","src":"補筆","conflict":"","alt":{"stem":"認証機関は、供給者の品質マネジメントシステムを、ISO 9001などの規格に基づいて評価し、要求を満たしているかどうかを判断する。","explanation":"正しい。認証審査で評価の物差しになるのは、ISO 9001などの規格である。社内標準は組織が自分で定めた基準なので、それを満たすかどうかを判断しても、利害関係者の代わりに評価したことにならない。共通の基準である規格に基づくからこそ、認証結果が信頼できる。"}},{"id":"r40q16n101","round":40,"q":16,"no":101,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"組織自身が、自らの品質マネジメントシステムが効果的に機能していることを、客観的に評価し、改善の機会を特定するために実施する活動はどれか。","options":["内部監査","認証審査","自主点検","監査法人による監査"],"answer":0,"explanation":"組織自身が自らのシステムを、独立して客観的に評価し、改善の機会を見つけるのが内部監査である。認証審査は第三者が外部から行う審査で、組織自身が行う活動ではない。自主点検は自己確認にとどまり、独立した立場からの客観的な評価という性格が弱い。監査法人による監査は会計の監査が中心で、品質マネジメントシステムを対象にしない。覚え方は、自分の組織を自分で客観的に見るのが内部監査。","src":"解説書 p.406","conflict":""},{"id":"r40q10n58","round":40,"q":10,"no":58,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"自社商品の開発で、アンケートやSNSから集めた顧客の声を分析して企画に反映している。この活動の根底にある、QC的ものの見方・考え方はどれか。","options":["顧客重視","後工程はお客様","品質第一","プロセス管理"],"answer":0,"explanation":"市場や顧客のニーズを把握し、それを満たす製品・サービスを開発して提供する考え方が「顧客重視」で、マーケットインとも呼ばれる。紛らわしいのは「後工程はお客様」で、こちらは社内の次の工程を顧客とみなし、後工程に不良品を流さないという考え方。顧客の声を集めて商品開発に活かす、という文なら外部の顧客が相手なので顧客重視になる。覚え方は、外の顧客なら「顧客重視」、社内の次の工程なら「後工程はお客様」。","src":"解説書 p.395・396","conflict":""},{"id":"r40q10n59","round":40,"q":10,"no":59,"part":"実践","field":"QC的ものの見方・考え方","fmt":"tf","stem":"売上の増大や原価の低減よりも品質を最優先し、市場・顧客のニーズに合致した製品・サービスを提供する考え方を、「重点指向」という。","ok":false,"explanation":"この説明は「品質第一」のものなので誤り。品質・コスト・納期のうち品質(Q)を高くすれば、コスト(C)は下がり納期(D)も良くなる、という順序で品質を先に置く。「重点指向」は、効果の大きい問題に絞って資源を集中する考え方で、品質を優先する話とは別。決め手は文の目的で、「品質を最優先」なら品質第一、「絞り込んで集中」なら重点指向。","src":"解説書 p.395・396","conflict":"","alt":{"stem":"売上の増大や原価の低減よりも品質を最優先し、市場・顧客のニーズに合致した製品・サービスを提供する考え方を、「品質第一」という。","explanation":"正しい。この説明は「品質第一」のものである。品質・コスト・納期のうち品質(Q)を高くすれば、コスト(C)は下がり納期(D)も良くなる、という順序で品質を先に置く。「重点指向」は、効果の大きい問題に絞って資源を集中する考え方で、品質を優先する話とは別である。決め手は、目的が品質を最優先して顧客のニーズに応えることなら品質第一、効果の大きい問題に絞り込んで集中することなら重点指向という点である。"}},{"id":"r40q10n60","round":40,"q":10,"no":60,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"計画を立てる、実施する、結果を評価する、確実に歯止めをかける。この流れを繰り返して仕事を進める基本の考え方を表す用語はどれか。","options":["管理のサイクル","SDCA","源流管理","因果関係"],"answer":0,"explanation":"計画(Plan)・実施(Do)・評価(Check)・処置と歯止め(Act)を回す考え方はPDCAで、「管理のサイクル」「管理のサークル」とも呼ばれる。選択肢にPDCAという語がなくても、言い換えの「管理のサイクル」を選ぶ。SDCAは標準を守って現状の水準を維持するための回し方(標準化Standardize→実施→確認→処置)で、計画から始めるPDCAとは区別する。計画から始まる=PDCA=管理のサイクル、標準から始まる=SDCA。","src":"解説書 p.395","conflict":""},{"id":"r40q10n62","round":40,"q":10,"no":62,"part":"実践","field":"QC的ものの見方・考え方","fmt":"tf","stem":"複数の問題点があるとき、効果の大きいものに絞って集中的に資源を投入し、効率よく大きな成果を上げようとする考え方は「事実に基づく管理」である。","ok":false,"explanation":"誤り。この文が述べているのは「重点指向」で、決め手は文の目的にある。「絞って資源を集中する」なら重点指向。「事実に基づく管理」は、事実を示すデータを集めて数値化し、データで評価して管理・改善する考え方(ファクト・コントロール)で、「データで判断する」ことが決め手になる。問題文にパレート図が出てくると重点指向のヒントになることが多いが、パレート図はデータにもとづく道具でもあるため、道具の名前だけでは区別できない。見分けるときは、目的が「絞り込み」か「データによる判断」かで決める。","src":"解説書 p.395・396","conflict":"","alt":{"stem":"複数の問題点があるとき、効果の大きいものに絞って集中的に資源を投入し、効率よく大きな成果を上げようとする考え方は「重点指向」である。","explanation":"正しい。絞って資源を集中し、効率よく成果を上げようとする考え方が重点指向である。事実に基づく管理は、事実を示すデータを集めて数値化し、データで評価して管理・改善する考え方(ファクト・コントロール)で、これとは区別する。決め手は、目的が絞り込みにあるか、データによる判断にあるかという点である。"}},{"id":"r40q10n63","round":40,"q":10,"no":63,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"工程の品質水準を維持管理して安定した状態になったあと、さらに一段高い品質水準へ引き上げていく活動に移る。この活動を表す用語はどれか。","options":["継続的改善","重点指向","SDCA","全員参加"],"answer":0,"explanation":"水準を引き上げる活動を繰り返し行うのが「継続的改善」。JIS Q 9000は、パフォーマンスを向上するために繰り返し行われる活動と定義している。SDCAは水準を「維持」する回し方なので、この文の次のステップである「引き上げ」にはならない。維持=SDCA、向上=継続的改善と対にして覚える。","src":"解説書 p.395・397","conflict":""},{"id":"r40q10n64","round":40,"q":10,"no":64,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"顧客満足(CS)とあわせて、働く従業員の満足(ES)や社会満足(SS)を高めることを重視し、QCサークル活動を導入して従業員の自主性を育てている。この根底にある考え方はどれか。","options":["人間性尊重","全員参加","教育・訓練","5S活動"],"answer":0,"explanation":"従業員の満足と自主性に着目する考え方は「人間性尊重」で、QCサークル活動の基本理念の一つでもある。「全員参加」は、全部門・全階層が役割を果たして協力する点がキーワードで、従業員一人ひとりの満足や自主性を育てるという視点とは焦点が違う。「満足・自主性」なら人間性尊重、「全部門・協力」なら全員参加と覚える。","src":"解説書 p.397","conflict":""},{"id":"r40q13n79","round":40,"q":13,"no":79,"part":"実践","field":"機能別管理","fmt":"mc","stem":"機能別管理の説明として最も適切なものはどれか。","options":["品質、コスト、量、納期などの経営基本要素ごとに全社的な目標を定め、各部門の業務分担を適正にしたうえで、部門横断的に連携・協力して達成を図る活動","各部門が自部門の業務範囲だけを対象に、日常の業務を標準どおりに維持する活動","トップマネジメントが年度の重点課題を決め、方針として各階層へ展開する活動","供給者に対して品質保証の要求事項を示し、受入検査で適合を確認する活動"],"answer":0,"explanation":"機能別管理は、品質・コスト・量・納期などの経営基本要素ごとに全社目標を決め、部門横断で連携して達成する活動。QCD+PSME(品質・コスト・納期・量・安全・士気や人材育成・環境)と同じ内容の要素を扱う。自部門の業務範囲で日常業務を標準どおりに維持する活動は、日常管理の説明。年度の重点課題を方針として各階層へ展開する活動は、方針管理の説明で、年度方針を上から下へ展開するもの。機能別管理のキーワードは「要素ごと」「部門横断」。","src":"解説書 p.401","conflict":""},{"id":"r40q13n82","round":40,"q":13,"no":82,"part":"実践","field":"機能別管理","fmt":"tf","stem":"機能別委員会の委員長は、当該機能の経営指標を担当する役員が務めることが多い。","ok":true,"explanation":"正しい。機能別管理を効果的に進めるため、品質保証委員会や原価管理委員会のように機能ごとに委員会を置き、その機能を担当する役員を長として構成する。もともとは経営者(トップマネジメント)の職務であり、機能別委員会はそれを代行する組織という位置づけで、場合によってはトップマネジメント自身が委員長を務める。委員長は「その機能の担当役員」と覚える。","src":"解説書 p.401","conflict":""},{"id":"r40q14n86","round":40,"q":14,"no":86,"part":"実践","field":"診断・監査","fmt":"mc","stem":"検査員の教育訓練が簡略化されたことが不適合品流出の真因と判明した。検査能力を育成する対策の効果が確認されるまでの間、熟練者を急ぎ検査業務に就かせて、不適合品の流出を防ぐことにした。この措置はどれか。","options":["応急措置","恒久措置","遡及措置","品質マニュアルの改訂"],"answer":0,"explanation":"対策の効果が出るまでの間に、いま起きている流出を止める暫定的な手当てが「応急措置」。これに対し、人材を育成して検査能力を根本から確保するのは、再発を防ぐ「恒久措置」になる。時間軸で判断し、「効果が出るまでの間」ならば応急、「長期的に根を断つ」ならば恒久。遡及措置は、すでに出荷した製品にさかのぼって行う措置なので、この場面の対策ではない。","src":"解説書 p.402","conflict":""},{"id":"r40q14n90","round":40,"q":14,"no":90,"part":"実践","field":"診断・監査","fmt":"mc","stem":"内部監査では、客観的な事実関係の明確化に注力し、事態の改善に協力する姿勢を示すことが重要である。あわせて確保に努めることで、被監査側に不安を与えず、正しい情報を引き出せるものはどれか。","options":["公正性","稼働率","収益","見える化"],"answer":0,"explanation":"監査する側が偏りなく、公平な立場で臨む「公正性」を確保すると、被監査側は不安を感じにくくなり、正しい情報を得られる。その結果、監査する側とされる側の双方にとってよい結果につながる。稼働率や収益は経営の指標で、監査の姿勢を表す語ではない。見える化は状況を見えるようにする手段であり、被監査側の不安を取り除く条件とは別。監査の姿勢は「客観的」と「公正性」の2語で覚える。","src":"解説書 p.402(前後の続きは次ページ。補筆を含む)","conflict":""}];

  if(mem) return mem;
  var d = null;
  try{ d = JSON.parse(localStorage.getItem(STORE)||"null"); }catch(e){}
  mem = d && d.items ? d : {items:{}, sessions:[]};
  return mem;
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(mem)); }catch(e){} }

/* ---------- 出題の重み(弱点優先) ---------- */
function fieldAcc(){
  var f = {}, m = load();
  BANK.forEach(function(q){
    var s = m.items[q.id]; if(!s || !s.n) return;
    var o = f[q.field] || (f[q.field] = {n:0, c:0});
    o.n += s.n; o.c += s.c;
  });
  return f;
}
function weightOf(q, facc){
  var s = load().items[q.id];
  var fa = facc[q.field]; var acc = (fa && fa.n >= 3) ? fa.c/fa.n : 0.6;
  var w = 1 + (1 - acc) * 2;                  // 分野が苦手なほど重い
  if(!s || !s.n) return w * 1.5;               // 未着手は少し優先
  if(s.last === "w") w *= 4 + Math.min(s.n - s.c, 4);
  else if(s.streak >= 3) w *= 0.15;
  else if(s.streak >= 2) w *= 0.3;
  return w;
}
function pickWeighted(pool, n){
  var facc = fieldAcc(), out = [], arr = pool.map(function(q){ return {q:q, w:weightOf(q, facc)}; });
  while(out.length < n && arr.length){
    var tot = arr.reduce(function(a,b){return a+b.w;}, 0), r = Math.random()*tot, i = 0;
    for(; i < arr.length-1; i++){ r -= arr[i].w; if(r <= 0) break; }
    out.push(arr[i].q); arr.splice(i,1);
  }
  return out;
}
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---------- 画面: ホーム ---------- */
var cfg = {mode:"weak", size:65, field:"all"};
function segHtml(id, items, cur){
  return '<div class="seg" id="'+id+'">'+items.map(function(it){
    return '<button data-v="'+esc(it[0])+'" class="'+(String(cur)===String(it[0])?"on":"")+'">'+esc(it[1])+'</button>';
  }).join("")+'</div>';
}
function fields(){ var s = {}; BANK.forEach(function(q){ s[q.field] = 1; }); return Object.keys(s); }
function home(){
  var m = load(), seen = 0, wrongNow = 0;
  BANK.forEach(function(q){ var s = m.items[q.id]; if(s && s.n){ seen++; if(s.last==="w") wrongNow++; } });
  var modes = [["weak","弱点を優先"],["random","全範囲ランダム"],["field","分野を選ぶ"],["wrong","間違えた問題だけ"]];
  var sizes = [[15,"15問(約10分)"],[30,"30問(約20分)"],[65,"65問(本番相当・45分)"]];
  var h = '<h1>QC検定2級 文章問題クイズ</h1>'+
    '<p class="sub">過去問6回分の文章問題を、1問ずつ作り直した固定問題セット(全'+BANK.length+'問)。目標は1問あたり約'+PER_Q_SEC+'秒、65問で45分。</p>'+
    '<div class="card"><div class="lab">出題方法</div>'+segHtml("sMode", modes, cfg.mode)+
    '<div class="lab">問題数</div>'+segHtml("sSize", sizes, cfg.size)+
    '<div id="fieldBox" class="'+(cfg.mode==="field"?"":"hide")+'"><div class="lab">分野</div>'+
      segHtml("sField", [["all","すべて"]].concat(fields().map(function(f){return [f,f];})), cfg.field)+'</div>'+
    '<p class="sub" style="margin-top:12px">着手済み '+seen+' / '+BANK.length+'問、直近で間違えたまま '+wrongNow+'問</p>'+
    '<div class="row" style="margin-top:8px"><button class="btn" id="go">はじめる</button></div></div>'+
    '<div class="card"><b>分野ごとの正答率</b>'+fieldTable()+'</div>'+
    '<div class="card"><b>進捗の持ち運び</b><p class="sub">記録はこの端末のブラウザにだけ保存されます。スマホとPCで同期したいときは、書き出した文字列をもう一方に貼り付けてください(貼り付けた側の記録は上書きされます)。</p>'+
    '<div class="row"><button class="btn ghost" id="exp">書き出す</button><button class="btn ghost" id="imp">貼り付けて読み込む</button></div>'+
    '<textarea id="io" class="hide"></textarea></div>';
  $app.innerHTML = h;
  document.getElementById("sMode").onclick = function(e){ var v=e.target.dataset.v; if(!v) return; cfg.mode=v; home(); };
  document.getElementById("sSize").onclick = function(e){ var v=e.target.dataset.v; if(!v) return; cfg.size=+v; home(); };
  var sf = document.getElementById("sField"); if(sf) sf.onclick = function(e){ var v=e.target.dataset.v; if(!v) return; cfg.field=v; home(); };
  document.getElementById("go").onclick = start;
  var io = document.getElementById("io");
  document.getElementById("exp").onclick = function(){ io.classList.remove("hide"); io.value = JSON.stringify(load()); io.select(); };
  document.getElementById("imp").onclick = function(){
    if(io.classList.contains("hide")){ io.classList.remove("hide"); io.value=""; io.placeholder="ここに貼り付けてから、もう一度「貼り付けて読み込む」を押す"; return; }
    try{ var d = JSON.parse(io.value); if(!d.items) throw 0; mem = d; save(); home(); }catch(e){ io.value=""; io.placeholder="読み込めませんでした。書き出した文字列をそのまま貼り付けてください。"; }
  };
}
function fieldTable(){
  var f = fieldAcc(), rows = Object.keys(f).map(function(k){ return {k:k, n:f[k].n, c:f[k].c}; });
  if(!rows.length) return '<p class="sub">まだ記録がありません。</p>';
  rows.sort(function(a,b){ return a.c/a.n - b.c/b.n; });
  return '<table><tr><th>分野</th><th class="num">正答率</th><th class="num">回答数</th></tr>'+rows.map(function(r){
    return '<tr><td>'+esc(r.k)+'</td><td class="num">'+Math.round(100*r.c/r.n)+'%</td><td class="num">'+r.n+'</td></tr>';
  }).join("")+'</table>';
}

/* ---------- 出題 ---------- */
var run = null;
function start(){
  var pool = BANK.slice(), m = load();
  if(cfg.mode==="field" && cfg.field!=="all") pool = pool.filter(function(q){ return q.field===cfg.field; });
  if(cfg.mode==="wrong") pool = pool.filter(function(q){ var s=m.items[q.id]; return s && s.last==="w"; });
  if(!pool.length){ alert_("該当する問題がありません。"); return; }
  var n = Math.min(cfg.size, pool.length);
  var qs = cfg.mode==="random" || cfg.mode==="field" || cfg.mode==="wrong" ? shuffle(pool).slice(0,n) : pickWeighted(pool, n);
  run = {qs:qs, i:0, log:[], t0:Date.now(), budget:n*PER_Q_SEC*1000, done:false, pausedMs:0, pauseStart:null};
  show();
}
function alert_(msg){ var d = document.createElement("p"); d.className="res ng"; d.textContent = msg; $app.insertBefore(d, $app.firstChild); }

function fmtClock(ms){ ms = Math.max(0, ms); var s = Math.floor(ms/1000); return Math.floor(s/60)+":"+("0"+(s%60)).slice(-2); }
var tick = null;
function pauseTimer(){
  if(run && !run.pauseStart){
    run.pauseStart = Date.now(); clearInterval(tick);
    var el = document.getElementById("clock"); if(el) el.textContent += "(一時停止中)";
    var btn = document.getElementById("pauseBtn"); if(btn){ btn.textContent = "再開"; btn.classList.add("active"); }
  }
}
function resumeTimer(){
  if(run && run.pauseStart){
    run.pausedMs += Date.now()-run.pauseStart; run.pauseStart = null;
    var btn = document.getElementById("pauseBtn"); if(btn){ btn.textContent = "一時停止"; btn.classList.remove("active"); }
  }
}
function togglePause(){ if(!run) return; if(run.pauseStart) resumeTimer(); else pauseTimer(); }
function view(q){
  // 正誤問題に alt(正しい文の版)があれば、出題のたびに半々で切り替える(「正誤なら誤りが多い」という読みを防ぐ)
  if(q.fmt!=="tf" || !q.alt) return q;
  if(!run.vw) run.vw = {};
  if(!run.vw[q.id]) run.vw[q.id] = Math.random()<0.5 ? {fmt:"tf", stem:q.alt.stem, ok:true, explanation:q.alt.explanation, alt:1} : q;
  return run.vw[q.id];
}
function show(){
  var q = run.qs[run.i], v = view(q);
  run.shown = Date.now();
  var opts = "";
  if(q.fmt==="mc"){
    q._ord = shuffle(q.options.map(function(_,i){return i;}));
    opts = q._ord.map(function(oi,k){ return '<button class="opt" data-k="'+k+'">'+esc(q.options[oi])+'</button>'; }).join("");
  }else{
    opts = '<div class="tfrow"><button class="opt" data-k="1">正しい</button><button class="opt" data-k="0">誤り</button></div>';
  }
  var s = load().items[q.id];
  $app.innerHTML =
    '<div class="top"><span>'+(run.i+1)+' / '+run.qs.length+'</span><span class="clockWrap"><span id="clock"></span><button type="button" class="pausebtn" id="pauseBtn">一時停止</button></span></div>'+
    '<div class="bar"><i style="width:'+(100*run.i/run.qs.length)+'%"></i></div>'+
    '<div class="card"><div class="chips"><span class="chip">'+esc(q.field)+'</span><span class="chip">'+(q.fmt==="mc"?"4択":"正誤")+'</span>'+
      (s && s.last==="w" ? '<span class="chip warn">前回まちがい</span>' : '')+'</div>'+
    '<div class="stem">'+esc(v.stem)+(q.fmt==="tf"?'<br><span class="sub">この文は正しいか。</span>':'')+'</div>'+
    '<div id="opts">'+opts+'</div><div id="fb"></div></div>'+
    '<div class="row"><button class="btn ghost" id="quit">やめる</button></div>';
  document.getElementById("opts").onclick = function(e){ var b = e.target.closest(".opt"); if(b && !b.disabled) answer(+b.dataset.k); };
  document.getElementById("quit").onclick = function(){ resumeTimer(); if(run.log.length){ finish(); } else { home(); } };
  document.getElementById("pauseBtn").onclick = togglePause;
  clearInterval(tick);
  run.pauseStart = null;                     // この問題の表示中はタイマー稼働
  var upd = function(){ var el = document.getElementById("clock"); if(!el) return;
    var left = run.budget - (Date.now()-run.t0-run.pausedMs);
    el.textContent = "残り "+fmtClock(left)+(left<0?"(超過)":""); el.style.color = left<0 ? "var(--ng)" : ""; };
  upd(); tick = setInterval(upd, 1000);
}
function answer(k){
  var q = run.qs[run.i], v = view(q), ms = Date.now()-run.shown, right, pickedText = null;
  if(q.fmt==="mc"){ right = q._ord[k] === q.answer; }
  else{ right = ((k===1) === !!v.ok); }
  var btns = document.querySelectorAll("#opts .opt");
  btns.forEach(function(b){
    b.disabled = true; var bk = +b.dataset.k;
    if(q.fmt==="mc"){ if(q._ord[bk]===q.answer) b.classList.add("ok"); else if(bk===k) b.classList.add("ng"); }
    else{ if((bk===1)===!!v.ok) b.classList.add("ok"); else if(bk===k) b.classList.add("ng"); }
  });
  var m = load(), s = m.items[q.id] || (m.items[q.id] = {n:0, c:0, streak:0, last:""});
  s.n++; if(right){ s.c++; s.streak++; s.last="c"; } else { s.streak = 0; s.last="w"; }
  s.t = Date.now(); save();
  run.log.push({id:q.id, right:right, ms:ms});
  var last = run.i === run.qs.length-1;
  var ans = q.fmt==="mc" ? '正解: '+esc(q.options[q.answer]) : '正解: '+(v.ok?'正しい':'誤り');
  document.getElementById("fb").innerHTML =
    '<div class="res '+(right?'ok':'ng')+'">'+(right?'正解':'不正解')+' <span class="sub" style="font-weight:400">('+Math.round(ms/1000)+'秒 / 目標'+PER_Q_SEC+'秒)</span></div>'+
    '<p><b>'+ans+'</b></p><div class="exp">'+esc(v.explanation)+'</div>'+
    '<p class="sub">出典: '+esc(q.src||"")+' ・ 第'+q.round+'回 問'+q.q+'</p>'+
    '<div class="row"><button class="btn" id="next">'+(last?'結果を見る':'次へ')+'</button></div>';
  pauseTimer();
  var nx = document.getElementById("next"); nx.onclick = function(){ resumeTimer(); if(last) finish(); else { run.i++; show(); } }; nx.focus();
}

/* ---------- 結果 ---------- */
function finish(){
  clearInterval(tick);
  resumeTimer();                             // 開いたままの一時停止(解説を読んでいる途中で終了した場合)を閉じる
  var byId = {}; BANK.forEach(function(q){ byId[q.id]=q; });
  var n = run.log.length, c = run.log.filter(function(x){return x.right;}).length, ms = Date.now()-run.t0-run.pausedMs;
  var pf = {}, ff = {};
  run.log.forEach(function(x){ var q = byId[x.id];
    var a = pf[q.part] || (pf[q.part]={n:0,c:0}); a.n++; if(x.right) a.c++;
    var b = ff[q.field] || (ff[q.field]={n:0,c:0}); b.n++; if(x.right) b.c++; });
  var m = load(); m.sessions.push({t:Date.now(), n:n, c:c, ms:ms}); m.sessions = m.sessions.slice(-50); save();
  var pct = n ? Math.round(100*c/n) : 0;
  var perQ = n ? Math.round(ms/1000/n) : 0;
  var partRows = Object.keys(pf).map(function(k){ var p = Math.round(100*pf[k].c/pf[k].n);
    return '<tr><td>'+esc(k)+'</td><td class="num">'+pf[k].c+' / '+pf[k].n+'</td><td class="num '+(p>=50?'pass':'fail')+'">'+p+'%</td></tr>'; }).join("");
  var fieldRows = Object.keys(ff).sort(function(a,b){ return ff[a].c/ff[a].n - ff[b].c/ff[b].n; }).map(function(k){
    return '<tr><td>'+esc(k)+'</td><td class="num">'+ff[k].c+' / '+ff[k].n+'</td><td class="num">'+Math.round(100*ff[k].c/ff[k].n)+'%</td></tr>'; }).join("");
  var wrong = run.log.filter(function(x){return !x.right;}).map(function(x){ return byId[x.id]; });
  $app.innerHTML = '<h1>結果</h1>'+
    '<div class="card"><p style="font-size:28px;margin:0"><b>'+c+' / '+n+'</b>('+pct+'%)</p>'+
    '<p class="sub">所要 '+fmtClock(ms)+'(持ち時間 '+fmtClock(run.budget)+')・1問あたり '+perQ+'秒(目標 '+PER_Q_SEC+'秒)。'+
    (ms<=run.budget ? '持ち時間内です。' : '持ち時間を超えました。')+'</p></div>'+
    '<div class="card"><b>手法・実践別</b><table><tr><th>区分</th><th class="num">正解</th><th class="num">率(合格目安50%)</th></tr>'+partRows+'</table></div>'+
    '<div class="card"><b>分野別(低い順)</b><table><tr><th>分野</th><th class="num">正解</th><th class="num">率</th></tr>'+fieldRows+'</table></div>'+
    (wrong.length ? '<div class="card"><b>まちがえた問題('+wrong.length+')</b>'+wrong.map(function(q){
      var v = view(q);
      return '<p><b>'+esc(v.stem)+'</b><br><span class="sub">'+esc(q.fmt==="mc" ? "正解: "+q.options[q.answer] : "正解: "+(v.ok?"正しい":"誤り"))+'</span></p><div class="exp">'+esc(v.explanation)+'</div>';
    }).join("")+'</div>' : '')+
    '<div class="row"><button class="btn" id="again">もう一度</button><button class="btn ghost" id="toHome">ホームへ</button></div>';
  document.getElementById("again").onclick = start;
  document.getElementById("toHome").onclick = home;
  window.scrollTo(0,0);
}

/* ---------- 公開期限 ---------- */
if(Date.now() >= CLOSE_AT){
  $app.innerHTML = '<h1>公開は終了しました</h1><p class="sub">このクイズは受験日('+EXAM_DATE+')までの公開でした。</p>';
}else{
  home();
}
</script>
