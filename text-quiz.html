<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QC検定 文章問題クイズ</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2330; --sub:#5b6474; --line:#dcd9d0;
  --acc:#1f5fbf; --acc-soft:#e3edfb; --ok:#1c7a46; --ok-soft:#e1f3e8; --ng:#b3261e; --ng-soft:#fbe6e4; --warn:#8a5a00; --warn-soft:#fbf0d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --card:#1d212a; --ink:#e8eaee; --sub:#9aa3b2; --line:#2f3542;
    --acc:#7aa9f0; --acc-soft:#22314a; --ok:#6cc48f; --ok-soft:#1c3327; --ng:#f0857e; --ng-soft:#3b2220; --warn:#e3b95a; --warn-soft:#3a3120;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --card:#1d212a; --ink:#e8eaee; --sub:#9aa3b2; --line:#2f3542;
  --acc:#7aa9f0; --acc-soft:#22314a; --ok:#6cc48f; --ok-soft:#1c3327; --ng:#f0857e; --ng-soft:#3b2220; --warn:#e3b95a; --warn-soft:#3a3120;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 4px}
h2{font-size:17px;margin:20px 0 8px}
p{margin:8px 0}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;min-height:48px}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px}
.seg button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
.lab{font-size:13px;color:var(--sub);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--sub)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.clockWrap{display:flex;align-items:center;gap:6px}
.pausebtn{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--sub)}
.pausebtn.active{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.stem{font-size:18px;line-height:1.8;margin:8px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.ng{background:var(--ng-soft);border-color:var(--ng)}
.opt:disabled{cursor:default}
.tfrow{display:flex;gap:10px}.tfrow .opt{text-align:center;font-weight:600;font-size:18px}
.res{border-radius:10px;padding:10px 14px;font-weight:700;margin:12px 0 4px}
.res.ok{background:var(--ok-soft);color:var(--ok)}.res.ng{background:var(--ng-soft);color:var(--ng)}
.exp{border-left:4px solid var(--acc);padding:4px 0 4px 12px;margin:10px 0;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
th{color:var(--sub);font-weight:600}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--ng);font-weight:700}
textarea{width:100%;min-height:90px;font:12px/1.4 monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.hide{display:none}
@media (max-width:480px){.stem{font-size:17px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var BANK = [{"id":"r35q7n40","round":35,"q":7,"no":40,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"達成したい目的が決まっているとき、そのための方策を一段ずつ具体的な手段へと枝分かれさせて展開し、実行できる最終手段を追求するために使う手法はどれか。","options":["連関図法","親和図法","系統図法","PDPC法"],"answer":2,"explanation":"目的から手段へ、手段をさらに下位の手段へと多段階に展開して、論理的に見通しのよい構造にするのが系統図法。連関図法は、原因と結果などが複雑に絡み合っているときに要因のつながりを整理して重要要因を絞り込む手法で、一方向に枝分かれさせる系統図法とは目的が違う。親和図法は言語データを類似性でまとめる手法で、手段の展開はしない。決め手は「目的から手段へ多段階に展開する」という目的で、単に目的と手段という語が出るだけでは連関図法との区別はつかない。PDPC法(過程決定計画図)は、不測の事態を予測して望ましい結果へ導く手法で、目的が異なる。","src":"補筆","conflict":""},{"id":"r35q7n41","round":35,"q":7,"no":41,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"複数の事象を行と列に並べて表にまとめ、交点ごとに互いの関係の有無や関連の強さを記入することで、問題の所在や着眼点を明らかにする手法はどれか。","options":["マトリックス・データ解析法","マトリックス図法","親和図法","連関図法"],"answer":1,"explanation":"行と列の要素の交点に関係の有無や強弱を書き込んで、問題の構造をつかむのがマトリックス図法。名前が似ているマトリックス・データ解析法は、たくさんの数値データの関係を少数の総合特性に要約して傾向をつかむ手法で、交点に関連度を記入する手法ではない。親和図法は言語データの類似性によるまとめ、連関図法は絡み合った原因の整理であり、表の形にはしない。交点に関連度を書くのがマトリックス図法、数値データを要約するのがマトリックス・データ解析法。","src":"補筆","conflict":""},{"id":"r35q7n42","round":35,"q":7,"no":42,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"混沌とした状況の中で集めた言葉やアイデアなどの言語データを、似たもの同士でまとめていき、問題の本質や全体像をつかんだり発想を得たりするための手法はどれか。","options":["系統図法","連関図法","マトリックス図法","親和図法"],"answer":3,"explanation":"言語データを類似性でグルーピングしていき、混沌の中から問題の本質を見いだすのが親和図法。連関図法は、すでに把握している原因と結果の絡み合いを整理する手法で、言語データを似たもの同士でまとめる作業は中心にならない。系統図法は目的に対する手段を展開し、マトリックス図法は要素間の関係を表で表す。決め手は、材料が言語データで、まとめ方が「類似性」であること。","src":"補筆","conflict":""},{"id":"r35q7n43","round":35,"q":7,"no":43,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"計画を進めていく途中で起こりうる不測の事態をあらかじめ予測し、それを避けたり対処したりする策を事前に用意して、プロセスを望ましい結果へ導くための手法はどれか。","options":["アローダイアグラム法","系統図法","PDPC法","連関図法"],"answer":2,"explanation":"進行中に起こる事態を予測し、そのときの対処や回避策を織り込んでおくことで、望ましい結果へ導くのがPDPC法(過程決定計画図)。アローダイアグラム法は、作業の前後関係と所要日数から日程を整理して短縮策を検討する手法で、不測の事態への備えが目的ではない。系統図法は手段の展開、連関図法は原因の絡み合いの整理。「起こりうる事態への備え」ならPDPC法、「作業の順序と日程」ならアローダイアグラム法。","src":"補筆","conflict":""},{"id":"r35q7n44","round":35,"q":7,"no":44,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"原因と結果が何重にも絡み合っている問題について、要因どうしの因果関係を論理的につないで全体像を描き、主要な原因を絞り込むために使う手法はどれか。","options":["連関図法","系統図法","親和図法","アローダイアグラム法"],"answer":0,"explanation":"複雑に絡み合った原因と結果の関係を矢印などでつなぎ、重要な要因を絞り込んで問題を解明するのが連関図法。系統図法は目的から手段へ一方向に展開する手法で、要因が相互に絡む状況には向かない。親和図法は言語データを類似性でまとめる手法で、因果のつながりを追うものではない。決め手は「因果が絡み合っているのを解きほぐし、主要因を絞る」という目的。","src":"補筆","conflict":""},{"id":"r35q7n45","round":35,"q":7,"no":45,"part":"手法","field":"新QC七つ道具","fmt":"tf","stem":"アローダイアグラム法は、計画の進行中に起こりうる不測の事態を予測し、その回避策をあらかじめ定めておくための手法である。","ok":false,"explanation":"誤り。この説明はPDPC法のもの。アローダイアグラム法は、計画に必要な各作業の前後関係を矢印で表して作業手順を整理し、所要日程の短縮策や実行計画を検討する手法。決め手は目的で、「作業の前後関係と日程」ならアローダイアグラム法、「不測の事態への事前の備え」ならPDPC法と区別する。","src":"補筆","conflict":"","alt":{"stem":"アローダイアグラム法は、計画に必要な各作業の前後関係を矢印で表して作業手順を整理し、所要日程の短縮策や実行計画を検討するための手法である。","explanation":"正しい。アローダイアグラム法は作業の前後関係を矢印で表し、手順と日程を整理する手法。計画の進行中に起こりうる不測の事態を予測して回避策を定める手法はPDPC法で、目的が別物である。決め手は、作業の前後関係と日程の検討が目的かどうかである。"}},{"id":"r35q7n46","round":35,"q":7,"no":46,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"多数の特性についての数値データが並んでいるとき、それらの関係を少数の総合特性に要約して見通しよく整理し、傾向をつかんだり分類したりするための手法はどれか。","options":["マトリックス図法","マトリックス・データ解析法","親和図法","連関図法"],"answer":1,"explanation":"たくさんの特性間の関係を、少数の総合特性にまとめて傾向や分類を見通すのがマトリックス・データ解析法で、多数の数値データを統計的に要約する点が、言語データ中心の他の手法との違い。マトリックス図法は、行と列の交点に関連の有無や強さを書き込んで問題の所在をつかむ手法で、数値データの要約はしない。親和図法と連関図法は言語データや因果関係を整理する手法。数値データを要約するのがマトリックス・データ解析法。","src":"補筆","conflict":""},{"id":"r35q8n47","round":35,"q":8,"no":47,"part":"手法","field":"抜取検査","fmt":"mc","stem":"抜取検査の方式の中には、長さや重さのように測定して得る値によって検査単位の品質を表すことを前提とするものがある。この前提となっているデータの種類はどれか。","options":["計量値","計数値","順序尺度のデータ","名義尺度のデータ"],"answer":0,"explanation":"測定して得られる連続的な値を計量値といい、長さや重さのように測って得るデータがこれにあたる。数えて得られる値は計数値で、不適合品数や不適合品率のようにカウントして得るデータを指す。順序尺度や名義尺度のデータは、大小関係や区分はあっても測定値としては扱わない、順位や分類のためのデータ。測って得るか数えて得るかで、計量値と計数値を区別するのが基本。","src":"補筆","conflict":""},{"id":"r35q8n48","round":35,"q":8,"no":48,"part":"手法","field":"抜取検査","fmt":"mc","stem":"標準偏差既知でロットの不適合品率を保証する計量規準型一回抜取検査を使うとき、検査する特性値の分布について満たしている必要がある条件はどれか。","options":["ポアソン分布に従うこと","二項分布に従うこと","正規分布に従うものとして扱えること","特性値の分布は問わないこと"],"answer":2,"explanation":"この方式の合格判定値は、特性値が正規分布に従うことを前提に、合格判定係数を使って求める。したがって、特性値が正規分布に従うものとして扱えることが適用条件になる。二項分布は不適合品数、ポアソン分布は欠点数のような計数値の分布に使うもので、計量値を扱うこの方式の前提ではない。計量値なら正規分布、と考えるとよい。","src":"補筆","conflict":""},{"id":"r35q8n49","round":35,"q":8,"no":49,"part":"手法","field":"抜取検査","fmt":"mc","stem":"計量規準型一回抜取検査を適用するには、検査の対象となる製品や部品が、同じ条件で作られたまとまりとして扱えなければならない。このまとまりを表す用語はどれか。","options":["サンプル","検査単位","ロット","工程"],"answer":2,"explanation":"同じ条件のもとで生産された品物の集まりで、合格か不合格かを判定する対象となる単位がロット。サンプルは、そのロットから抜き取った一部で、判定のための測定に使う。検査単位は、1個1個の品物のように、測定や判定の最小の単位。ロット全体を判定の対象とし、サンプルはそこから取り出したもの、と関係で覚える。","src":"補筆","conflict":""},{"id":"r35q8n50","round":35,"q":8,"no":50,"part":"手法","field":"抜取検査","fmt":"mc","stem":"計量規準型一回抜取検査で、ロットの不適合品率を保証するために、検査を始める前の時点でロットの特性値についてあらかじめ与えておく必要がある量はどれか。","options":["平均値","標準偏差","不適合品率","範囲"],"answer":1,"explanation":"この方式は、ロットの特性値の標準偏差が既知であることを前提とし、その値を使って合格判定値を計算する。平均値は、サンプルから求めて判定に使う量で、事前にわかっているものではない。不適合品率は、この検査が保証しようとする目標側の量。標準偏差をあらかじめ指定し、サンプルの平均値で判定する、という役割分担で覚える。","src":"補筆","conflict":""},{"id":"r35q8n51","round":35,"q":8,"no":51,"part":"手法","field":"抜取検査","fmt":"mc","stem":"特性値が低いほうが好ましい場合の計量規準型一回抜取検査で、上限規格値から合格判定係数と標準偏差の積を引いて上限合格判定値を求めた。サンプル平均がどうであれば、ロットを合格とするか。","options":["上限合格判定値以上のとき","下限合格判定値以下のとき","上限合格判定値以下のとき","下限合格判定値以上のとき"],"answer":2,"explanation":"低いほうが好ましい特性では、サンプル平均が上限合格判定値以下であればロットを合格にする。特性値が低いほど好ましいので、平均が上限合格判定値より小さければ品質は十分よいと判断できる。上限合格判定値以上を合格にすると、平均が高いロットを通してしまう。下限合格判定値を使うのは、高いほうが好ましい特性の場合。低いほうが好ましいなら上限側で判定し、平均が判定値以下で合格。","src":"補筆","conflict":""},{"id":"r35q8n52","round":35,"q":8,"no":52,"part":"手法","field":"抜取検査","fmt":"mc","stem":"特性値が低いほうが好ましい場合の計量規準型一回抜取検査で、上限規格値が50、合格判定係数が1.5、標準偏差が2であった。サンプル平均が47.5だったとき、ロットの判定として正しいのはどれか。","options":["合格とする","不合格とする","サンプルを増やして再判定する","標準偏差が不明なので判定できない"],"answer":1,"explanation":"上限合格判定値は、上限規格値から合格判定係数と標準偏差の積を引いて、50から1.5×2の3を引いた47になる。サンプル平均47.5は上限合格判定値の47を超えているので、ロットは不合格。標準偏差は2と与えられており判定できないことはなく、この方式は一回の抜取りで合否を決めるので再判定もしない。上限合格判定値を超えたら不合格、以下なら合格。","src":"補筆","conflict":""},{"id":"r35q8n53","round":35,"q":8,"no":53,"part":"手法","field":"抜取検査","fmt":"tf","stem":"特性値が高いほうが好ましい場合の計量規準型一回抜取検査では、下限規格値に合格判定係数と標準偏差の積を加えて下限合格判定値を求め、サンプル平均がこの値以上ならロットを合格とする。","ok":true,"explanation":"正しい。高いほうが好ましい特性では、規格の下限に余裕を上乗せした下限合格判定値を基準にし、サンプル平均がそれ以上ならば合格になる。低いほうが好ましい場合は上限規格値から余裕を引いて上限合格判定値を作るので、余裕を足すか引くかが上限側と下限側の違い。下限側は足して以上で合格、上限側は引いて以下で合格。","src":"補筆","conflict":""},{"id":"r35q8n54","round":35,"q":8,"no":54,"part":"手法","field":"抜取検査","fmt":"tf","stem":"特性値が高いほうが好ましい場合の計量規準型一回抜取検査では、サンプル平均が下限合格判定値より大きいとき、ロットを不合格とする。","ok":false,"explanation":"誤り。高いほうが好ましい特性では、サンプル平均が下限合格判定値以上であれば合格で、不合格になるのは平均が下限合格判定値より小さいとき。平均が大きいことは、高いほうが好ましい特性にとっては良い状態なので、それを不合格にすると判断が逆になる。高いほうが好ましいなら、下限合格判定値を下回ったら不合格。","src":"補筆","conflict":"","alt":{"stem":"特性値が高いほうが好ましい場合の計量規準型一回抜取検査では、サンプル平均が下限合格判定値より小さいとき、ロットを不合格とする。","explanation":"正しい。高いほうが好ましい特性では、サンプル平均が下限合格判定値以上であれば合格で、不合格になるのは平均が下限合格判定値より小さいときである。平均が大きいことは好ましい方向の状態なので、それを不合格にすると判断が逆になる。決め手は、好ましい方向に外れても合格、下限を下回ったときだけ不合格という向きの考え方である。"}},{"id":"r35q9n55","round":35,"q":9,"no":55,"part":"実践","field":"管理の方法","fmt":"mc","stem":"ある運送会社が、新しい会員向け配送サービスを始める前に、過去の類似サービスで起きた苦情を分類して共通する失敗の型を洗い出し、それぞれに対策を組み込んだ。この対応はどれにあたるか。","options":["応急対策","再発防止","妥当性確認","未然防止"],"answer":3,"explanation":"新サービスはまだ立ち上げ前で、実際にはトラブルが起きていない。その段階で起こりうる問題を想定して対策を打つのは未然防止。応急対策は、すでに起きた問題の被害を抑える手当て、再発防止は、起きた問題の原因を調べて取り除き、同じ原因で繰り返さないようにする対策なので、どちらも問題が起きたあとの対応になる。決め手は、対策を打つ時点で問題が実際に起きているかどうか。","src":"解説書 p.212","conflict":""},{"id":"r35q9n56","round":35,"q":9,"no":56,"part":"実践","field":"管理の方法","fmt":"mc","stem":"ある缶詰工場で、出荷した缶詰にへこみが見つかった。原因を調べて対策を打つのはこれからだが、まず同じロットの在庫を全数選別して良品を確保し、店頭に出ているものも良品と交換した。この対応はどれにあたるか。","options":["再発防止","応急対策","未然防止","妥当性確認"],"answer":1,"explanation":"すでに起きた問題の被害を最小限に抑えるため、良品を確保して入れ替えるのは応急対策。根本の原因を取り除く前の、とりあえずの手当てである。再発防止は、原因を調べて取り除き、今後二度と同じ原因で起きないようにする対策で、この場面ではまだ行われていない。未然防止はまだ問題が起きていない段階の対策。原因を除く前に、いま出ている被害を止めるのが応急対策。","src":"解説書 p.212","conflict":""},{"id":"r35q9n57","round":35,"q":9,"no":57,"part":"実践","field":"管理の方法","fmt":"tf","stem":"洗浄機の水温設定のミスが原因で洗浄不良が起きたと突き止め、設定値が勝手に変わらないよう制御プログラムを改めた。この対応は応急対策にあたる。","ok":false,"explanation":"誤り。この対応は再発防止にあたる。洗浄不良の原因を調べて水温設定のミスと特定し、その原因そのものを取り除いているので、今後同じ原因では起きなくなる。応急対策は、原因を除く前に、いま出ている被害を抑える手当てのことで、不良品の選別や交換などが該当する。原因まで手を入れているなら再発防止、被害を抑えるだけなら応急対策。","src":"解説書 p.212","conflict":"","alt":{"stem":"洗浄機の水温設定のミスが原因で洗浄不良が起きたと突き止め、設定値が勝手に変わらないよう制御プログラムを改めた。この対応は再発防止にあたる。","explanation":"正しい。洗浄不良の原因を調べて水温設定のミスと特定し、その原因そのものを取り除いているので、今後同じ原因では起きなくなる。応急対策は、原因を除く前に、いま出ている被害を抑える手当て(不良品の選別や交換など)のことで、これとは区別する。決め手は、手を入れた先が原因そのものか、出ている被害だけかという点にある。"}},{"id":"r35q9n58","round":35,"q":9,"no":58,"part":"実践","field":"管理の方法","fmt":"mc","stem":"ある塗装ラインで塗装ムラが発生した。調べると、乾燥炉の温度のばらつきが原因と分かったため、炉の温度制御を改良して、同じ原因でムラが起きないようにした。この対応はどれにあたるか。","options":["未然防止","再発防止","応急対策","妥当性確認"],"answer":1,"explanation":"発生した問題の原因を調査で特定し、その原因を取り除いて同じ原因で起きないようにしているので、再発防止。不良品の選別や交換のような被害を抑える手当ては応急対策で、原因には手をつけない。未然防止は、まだ問題が起きていない段階で先に対策する場合。問題が起きたあとに、原因を調べて除いたなら再発防止。","src":"解説書 p.212","conflict":""},{"id":"r35q9n59","round":35,"q":9,"no":59,"part":"実践","field":"管理の方法","fmt":"tf","stem":"部品のはめ合い不良の原因が、購入した樹脂材の仕様書の寸法許容差の設定不備にあると特定され、仕様書そのものを改めた。この対応は再発防止にあたる。","ok":true,"explanation":"正しい。はめ合い不良が起きたあとに原因を調べ、加工ではなく材料仕様の不備と特定して、その仕様を見直している。原因そのものを取り除いており、同じ原因での再発をなくす対策なので再発防止。不良品を選別して交換するだけなら応急対策になる。原因を除いて根を断つなら再発防止。","src":"解説書 p.212","conflict":""},{"id":"r35q10n60","round":35,"q":10,"no":60,"part":"実践","field":"標準化","fmt":"mc","stem":"工程を最適化して得られた内容を、共通に繰り返し使えるよう、一定の手続きを経て取決めとして設定する活動を表す用語はどれか。","options":["明文化","標準化","検証","品質マネジメント"],"answer":1,"explanation":"最適な状態を追求し、共通に繰り返して使うための取決めを一定の手続きで設定する活動が標準化で、その結果として決めたものが標準作業や作業標準になる。明文化は文章に書き出すことを指し、書くだけでは組織として決める手続きを経たことにはならない。検証は決めた内容が正しく機能するかを確かめる行為で、決める活動そのものではない。決める手続きまで含むのが標準化。","src":"補筆","conflict":""},{"id":"r35q10n61","round":35,"q":10,"no":61,"part":"実践","field":"日常管理","fmt":"mc","stem":"作業管理では、標準作業とあわせて、決められた作業をこなすために必要な時間の基準を設定し、決められたことを順守して目的を達成する活動を行う。この時間の基準を表す用語はどれか。","options":["標準時間","作業手順","生産技術","検証"],"answer":0,"explanation":"標準作業に対して、その作業を行うのに必要な時間の基準を定めたものが標準時間で、作業管理では標準作業と標準時間の両方を設定して順守させる。作業手順は作業を行う順序や方法のことで、時間の基準ではない。生産技術は生産の方法を設計する技術の分野を指し、時間の設定とは別。作業のやり方を決めるのが標準作業、かかる時間の基準が標準時間。","src":"補筆","conflict":""},{"id":"r35q10n62","round":35,"q":10,"no":62,"part":"実践","field":"標準化","fmt":"tf","stem":"作業標準の分類で、製造技術標準は、生産上の主に人を対象とした技術的な事項を決めたものである。","ok":false,"explanation":"誤り。製造技術標準が主に対象とするのは物で、材料や設備、製品などに関する技術的な事項を決める。人を対象に作業方法を決めるのは製造作業標準のほうで、監督者や作業者への具体的な指示は作業指示票で行う。物の技術的な事項は製造技術標準、人の作業方法は製造作業標準と分けて覚える。","src":"補筆","conflict":"","alt":{"stem":"作業標準の分類で、製造技術標準は、生産上の主に物を対象とした技術的な事項を決めたものである。","explanation":"正しい。製造技術標準は、材料や設備、製品など物に関する技術的な事項を決める標準である。人を対象に作業方法を決めるのは製造作業標準で、両者は対象が異なる。決め手は、決める対象が物の技術的事項か人の作業方法かという点である。"}},{"id":"r35q10n63","round":35,"q":10,"no":63,"part":"実践","field":"標準化","fmt":"mc","stem":"作業標準の一般的な分類で、製造作業標準が生産上の主に対象とし、作業方法に関連する事項を決めているものはどれか。","options":["物","金","情報","人"],"answer":3,"explanation":"製造作業標準は、生産上の主に人を対象として、作業方法に関連する事項を決めたもの。作業者や監督者がどう動くかを定めるため、人が対象になる。物を対象にして技術的な事項を決めるのは製造技術標準のほう。金(原価や設備投資など)や情報(記録・帳票類)を主対象とする標準もあるが、作業方法そのものを定めるのは人を対象とした製造作業標準。物なら製造技術標準、人なら製造作業標準と整理して覚える。","src":"補筆","conflict":""},{"id":"r35q10n64","round":35,"q":10,"no":64,"part":"実践","field":"標準化","fmt":"mc","stem":"作業標準を作るとき、机上の空論にならないよう、現場で実際に作業して確かめたうえで、実際に守ることができる内容にする必要がある。この性質を表す語はどれか。","options":["責任と権限","信頼性確認済み","作業項目","実行可能"],"answer":3,"explanation":"作業標準は、現場で実際に作業して検証し、決めたとおりに実行できる、つまり実行可能なものにしなければ守られない。責任と権限は、異常時の判断者や処置の範囲を示すために明確にするもので、実際に守れるかどうかを表す語ではない。信頼性確認済みという性質は、実行できるかどうかの点では意味がとおらない。現場で検証して実行可能にする、と覚える。","src":"解説書 p.214","conflict":""},{"id":"r35q10n65","round":35,"q":10,"no":65,"part":"実践","field":"標準化","fmt":"mc","stem":"作業標準に異常時の定義と処置を示すとき、異常と判断する状況と、異常が起きたときの対応の両方について、特に明確に示しておくべき事柄はどれか。","options":["原価","責任と権限","標準時間","使用材料"],"answer":1,"explanation":"異常時には、誰が責任を持って判断し、どこまで指示や実行をしてよいかが決まっていないと動けない。そのため異常時の定義と処置については、責任と権限を明確に示す。原価や標準時間、使用材料は、通常の作業条件や管理に関わる事項で、異常時の判断と指示の範囲を定めるものではない。異常時は、誰が判断してどこまで動けるか、と覚える。","src":"解説書 p.214","conflict":""},{"id":"r35q11n66","round":35,"q":11,"no":66,"part":"実践","field":"品質の概念","fmt":"tf","stem":"設計品質は製造の目標としたねらいにすぎないから、工程にその品質を作り込む実力がなければ、設計品質のほうを無視してもかまわない。","ok":false,"explanation":"誤り。設計品質はねらいの品質であっても、製品として品質目標を達成できなければ、市場や顧客に受け入れられない。製造の実力を確認したうえで、実力が足りなければ、設計品質を無視するのではなく、実力のほうを高めてから生産すべきである。ちなみに製造品質は、設計品質をねらって作った製品の実際の品質で、できばえの品質、適合の品質とも呼ばれる。ねらいだから無視してよい、にはならない。","src":"解説書 p.214・215","conflict":"","alt":{"stem":"設計品質は製造の目標としたねらいにすぎないが、工程にその品質を作り込む実力がなければ、実力のほうを高めてから生産すべきである。","explanation":"正しい。設計品質はねらいの品質であっても、製品として品質目標を達成できなければ、市場や顧客に受け入れられない。製造の実力が足りない場合は、設計品質を無視するのではなく、実力を高めてから生産に移る必要がある。ちなみに製造品質は、設計品質をねらって作った製品の実際の品質で、できばえの品質、適合の品質とも呼ばれる。決め手は、ねらいの品質と実際の品質の両方がそろって初めて顧客に受け入れられる、という点。"}},{"id":"r35q11n67","round":35,"q":11,"no":67,"part":"実践","field":"品質の概念","fmt":"mc","stem":"設計品質がねらいの品質であっても、工程にそれを作り込む能力があるかを確認しないまま生産に移してはいけない。その理由として最も適切なものはどれか。","options":["設計品質は製造部門が自由に変更してよい目標であり、確認してもしなくても結果が変わらないから。","設計品質は顧客の要望から展開して定めた品質であり、作り込む能力を確かめずに生産すると顧客の要望に応えられないから。","設計品質は顧客の要望とは無関係に決める内部の目標であり、工程の実力で決まる製造品質のほうが重要だから。","工程能力の確認は、品質保証責任者の承認を得るために法律で義務づけられているから。"],"answer":1,"explanation":"設計品質は、市場や顧客の要求品質を、設計と製造が可能な品質特性に変換して定めたもの。だから工程に作り込む能力があるかを確認しないまま生産へ移せば、顧客の要望を満たせない製品ができてしまう。設計品質は顧客要求から展開されるので、無関係の内部目標ではないし、法律で義務づけられているという理由も誤り。理由は顧客の要望を満たせなくなるから、と覚える。","src":"解説書 p.214・215","conflict":""},{"id":"r35q11n68","round":35,"q":11,"no":68,"part":"実践","field":"品質の概念","fmt":"tf","stem":"製品の品質には、ごみ公害、環境保全、資源のリサイクルなど、製品使用後に社会へ及ぼす影響を考えた品質も問われるようになってきている。","ok":true,"explanation":"正しい。環境保全などの製品使用後の品質が問われることは、昨今の社会の論調からも当然で、品質管理活動もSDGsと無縁ではない。製品の品質は、使っている間の性能だけでなく、使い終わったあとの社会への影響まで含めて考える時代になっている。","src":"解説書 p.215","conflict":""},{"id":"r35q11n69","round":35,"q":11,"no":69,"part":"実践","field":"品質の概念","fmt":"mc","stem":"製品使用後の環境への影響まで含めた品質が問われるようになったことの理由として、最も適切なものはどれか。","options":["設計品質を決める際に参照するのは目の前の顧客の声だけで十分であり、直接要望を伝えてこない地球や地域社会まで品質管理活動の対象に含める必要は本来ないという考え方が根底にあるから。","環境保全に関する法令が新たに定められたことによって、企業は品質管理活動の対象を地球環境にまで広げることを法律上義務づけられ、それに従わざるを得なくなっているから。","品質管理活動のねらいが品質だけでなく、利益、コスト、納期、安全、モラルにまで広がり、お客様が考える対象に地球や地域社会も含まれるようになってきているから。","製品使用後に生じる環境への影響は、販売という取引が完了したあとに発生する事柄であるため、製造部門を含む品質管理活動の責任の範囲には含まれないという考え方によるから。"],"answer":2,"explanation":"品質管理活動のねらいが、品質そのものだけでなく利益・コスト・納期・安全・モラルにまで広がったことで、お客様が気にかける対象そのものに地球や地域社会が含まれるようになった、という捉え方が理由になる。地球や地域社会は直接要望を言葉にしてこないが、それでもお客様が気にする対象という位置づけである。環境保全の法令は実際にあるが、テキストが挙げる直接の理由は法律による強制ではなく、品質管理活動のねらいと対象が広がったことにある。販売後だから対象外、という考えも社会的品質を考える流れに反する。","src":"解説書 p.215","conflict":""},{"id":"r35q11n70","round":35,"q":11,"no":70,"part":"実践","field":"品質の概念","fmt":"tf","stem":"品質管理や品質保証の活動は、直接製品を設計している部門と製造している部門に理解と意欲・熱意があれば十分で、調達や販売、サービスなどの部門は関与しなくてよい。","ok":false,"explanation":"誤り。優れた品質管理や品質保証の活動には、企業や組織の全部門が関係し、連携することが必要で、設計と製造だけで進められるものではない。全社全部門の理解と意欲・熱意を高めることが、全社的な品質管理活動のねらいである。品質保証は設計と製造だけの仕事ではなく、全部門の仕事。","src":"解説書 p.215","conflict":"","alt":{"stem":"品質管理や品質保証の活動は、設計や製造の部門だけでなく、調達や販売、サービスなど企業や組織の全部門が関係し、連携して進める必要がある。","explanation":"正しい。優れた品質管理や品質保証の活動には、企業や組織の全部門が関係し、連携することが必要で、設計と製造だけで進められるものではない。全社全部門の理解と意欲・熱意を高めることが、全社的な品質管理活動のねらいである。決め手は、品質保証は特定の部門の仕事ではなく全部門の仕事という点にある。"}},{"id":"r35q11n71","round":35,"q":11,"no":71,"part":"実践","field":"品質の概念","fmt":"mc","stem":"品質管理や品質保証の活動に、設計と製造の部門だけでなく、全社の全部門の参加が必要な理由として最も適切なものはどれか。","options":["設計部門がお客様本位で設計し、製造部門が自工程で良いものを作り込めば、品質保証は十分にできるから。","お客様が求めているのは品質だけでなく価格、納期、サービスなど製品にかかわるすべての側面であり、調達、梱包、運送、販売、サービスなどの部門の理解と意欲も必要だから。","品質保証は経営者だけの責任であり、各部門は経営者の指示を受けて動けばよいから。","品質に関する活動は、検査部門に任せるほうが効率がよいから。"],"answer":1,"explanation":"お客様が要望しているのは品質だけではなく、価格、納期、サービスなど製品にかかわるすべての側面である。したがって品質保証の活動は、設計と製造の部門に限らず、調達、梱包、運送、販売、サービスなどの全社全部門の理解と意欲・熱意が必要になる。設計と製造だけで足りる、あるいは検査部門に任せればよいという考えは、全部門の参加という趣旨に反する。","src":"解説書 p.215","conflict":""},{"id":"r35q12n72","round":35,"q":12,"no":72,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"消費者保護の観点から施行された、製造物の欠陥が原因で生命、身体または財産に損害を被った被害者が、製造業者らに損害賠償を求められることを定めた法律はどれか。","options":["労働安全衛生法","独占禁止法","特定商取引法","PL法"],"answer":3,"explanation":"製造物の欠陥による損害の賠償を定めたのは、製造物責任法、通称PL法で、1995年7月に施行された。労働安全衛生法は職場の労働者の安全と健康を守る法律で、消費者が製品の欠陥で被害を受けた場合の賠償を定めたものではない。独占禁止法や特定商取引法も、賠償責任の規定が目的ではない。製造物の欠陥と賠償の話ならPL法。","src":"解説書 p.215","conflict":""},{"id":"r35q12n73","round":35,"q":12,"no":73,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"PL法は無過失責任の原則を採用している。製造物の欠陥によって被害が生じたとき、過失の有無にかかわらず損害賠償の義務を負う者はだれか。","options":["被害者","製造業者ら","消費者団体","国"],"answer":1,"explanation":"PL法(製造物責任法)では、製品の欠陥によって被害が生じた場合、製造業者らは自分に過失があったかどうかにかかわらず、損害賠償の義務を負う。これが無過失責任の原則。被害者は賠償を受ける側で、義務を負う側ではない。消費者団体や国も賠償義務者にはあたらない。無過失責任は、過失がなくても製造業者らが責任を負う、と覚える。","src":"解説書 p.215","conflict":""},{"id":"r35q12n74","round":35,"q":12,"no":74,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品の開発設計の段階で、関係する職能の専門家が集まって、設計に要求事項が漏れなく織り込まれ品質目標を達成できるかを審議し、問題の未然防止を図る活動はどれか。","options":["デザインレビュー","初期流動管理","品質保証体系図","品質マネジメントシステム"],"answer":0,"explanation":"設計審査と訳されるデザインレビューは、ユーザーニーズや設計仕様などの要求事項が設計のアウトプットに漏れなく反映され、品質目標を達成できるかを、関係職能の専門家が審議する活動。初期流動管理は、設計ではなく量産立上げの段階で行う特別な活動。品質保証体系図は、各段階の業務と責任を整理して示すもので、設計内容を審議する場ではない。開発設計段階の審議がデザインレビュー、量産立上げが初期流動管理。","src":"解説書 p.216","conflict":""},{"id":"r35q12n75","round":35,"q":12,"no":75,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製品の量産の立上げ段階で、円滑に立ち上げるために、量産安定期とは異なる特別な体制をとり、品質などの情報を集めながら量産前の品質保証のステップを着実に進める活動はどれか。","options":["デザインレビュー","品質保証体系図","初期流動管理","品質マネジメントシステム"],"answer":2,"explanation":"量産の立上げ段階で、量産安定期とは異なる特別な体制をとり、品質などの情報を集めて確実に立ち上げる活動が初期流動管理。デザインレビューは開発設計の段階で設計内容を審議する活動で、量産立上げのものではない。品質保証体系図は業務と責任の整理図、品質マネジメントシステムは組織の品質管理の仕組み全体を指す語で、特別体制の活動ではない。立上げ期の特別体制なら初期流動管理。","src":"解説書 p.216","conflict":""},{"id":"r35q12n76","round":35,"q":12,"no":76,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製品の環境への影響を評価するとき、原材料の採取から製造、使用、処分に至るまでの一連の段階を通じて考慮する必要がある。この一連の段階を表す用語はどれか。","options":["品質保証体系図","SDGs","品質マネジメントシステム","製品ライフサイクル"],"answer":3,"explanation":"原材料の採取から製造、使用、処分までの製品の一生を通した段階が製品ライフサイクルで、環境側面や潜在的な影響は、このライフサイクル全体を通じて調査、評価する。SDGsは持続可能な開発のための国際目標であり、製品の段階を指す語ではない。品質保証体系図や品質マネジメントシステムは、品質保証の業務や仕組みを表すもので、環境影響を評価する対象の範囲を示す語ではない。製造だけでなく採取から処分まで、というのが製品ライフサイクル。","src":"解説書 p.216","conflict":""},{"id":"r35q13n77","round":35,"q":13,"no":77,"part":"実践","field":"方針管理","fmt":"mc","stem":"トップマネジメントが表明した自社の使命や経営理念、中長期経営計画への意図を、各部門の役割に落とし込み、全社で達成していくためのマネジメント活動の総称はどれか。","options":["方針管理","目標管理","総合的品質管理","課題達成"],"answer":0,"explanation":"トップの方針を達成するために、各部門が方針達成上の役割を果たしているかを把握し、管理のサイクルを回していく活動が方針管理。トップ方針が示されただけでは各部門が何をすべきか鮮明でないため、この仕組みが必要になる。目標管理は個人やチームが自分の目標を立てて進捗を自己管理する手法を指すことが多く、全社の方針を各部門へ展開して達成する話とは焦点が違う。総合的品質管理は組織全体で品質経営を進める活動全体を指す、より広い言葉。決め手は「方針を達成するためのマネジメント活動」かどうか。","src":"解説書 p.217","conflict":""},{"id":"r35q13n78","round":35,"q":13,"no":78,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針を設定するときの留意点として、取り組むべきことを具体的にし、優先順位をつけて絞り込むことを表す用語はどれか。","options":["重点化","細分化","管理項目","課題達成"],"answer":0,"explanation":"優先順位をつけて絞り込むことを言い換えたものが「重点化」。全社の力を集中させるために、やることを絞る発想である。細分化はものごとをより細かく分けることで、絞り込みや優先順位づけの意味はない。管理項目は目標の達成度を測るために設ける測定の対象で、方針の絞り込みとは別の話。決め手は「優先順位をつけて絞る」なら重点化。","src":"解説書 p.217","conflict":""},{"id":"r35q13n79","round":35,"q":13,"no":79,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針を整理するとき、事業別に分けるだけでなく、品質・コスト・納期・安全・環境といった、何のために取り組むのかという観点でも整理されていることが望ましい。この整理のしかたを表す用語はどれか。","options":["目的別","細分化","重点化","管理項目"],"answer":0,"explanation":"品質・コスト・納期・安全・環境などは方針を構成する重要な項目であり、方針の目的にあたる。これらの観点で整理することを「目的別」という。重点化は優先順位をつけて絞る留意点で、整理の切り口を示す言葉ではない。細分化は細かく分けるだけで、目的という観点を含まない。管理項目は達成度を測る対象。覚え方は、QCDに安全・環境を加えた目的を軸に並べる=目的別。","src":"解説書 p.217","conflict":""},{"id":"r35q13n80","round":35,"q":13,"no":80,"part":"実践","field":"方針管理","fmt":"mc","stem":"経営環境の分析や現状の反省をもとに全社の重点を決めるとき、設定しようとする目標と現実との間にある、対処を必要とするギャップを何というか。","options":["課題","要因","管理項目","要求事項"],"answer":0,"explanation":"目標と現実との間の、対処を必要とするギャップが「課題」。全社の重点課題は、中長期経営計画に加えて、この課題や現状の反省から出てきた問題点を考慮し、重要なものに絞って決める。要因は結果に影響を与える原因の側の話で、ギャップそのものではない。管理項目は測定の対象、要求事項は顧客などが求める事柄で、どれもギャップを指さない。決め手は「目標と現実の差=課題」。","src":"解説書 p.217","conflict":""},{"id":"r35q13n81","round":35,"q":13,"no":81,"part":"実践","field":"方針管理","fmt":"tf","stem":"重点課題の目標は、達成できたかどうかを客観的に評価するため、あえて数値化せず、定性的な表現にとどめておくのが望ましい。","ok":false,"explanation":"誤り。客観的に評価するには、目標を数値で設定して測れるようにしておくことが重要で、数値で測定できれば達成の度合いもわかる。定性的な表現だけでは評価する人によって判断が分かれてしまう。「測定可能」であることが、目標設定の条件と覚える。","src":"解説書 p.217・218","conflict":"","alt":{"stem":"重点課題の目標は、達成できたかどうかを客観的に評価するため、数値で設定して測定できるようにしておくのが望ましい。","explanation":"正しい。客観的に評価するには、目標を数値で設定して測れるようにしておく必要があり、数値で測定できれば達成の度合いもわかる。定性的な表現だけでは評価する人によって判断が分かれてしまう。決め手は、目標が測定可能であることが評価の前提になるという点である。"}},{"id":"r35q13n82","round":35,"q":13,"no":82,"part":"実践","field":"方針管理","fmt":"mc","stem":"重点課題の目標を設定するとき、上位の目標に合っているかを確認し、関係部門と調整して整合をとることを何というか。","options":["すり合わせ","重点化","数値化","水平展開"],"answer":0,"explanation":"上位の目標との整合や関係部門との調整を、すり合わせという。全社の方針が各部門に展開される以上、目標がそれぞれ独立して決まると部門間で食い違いが生じるため必要になる。重点化は数ある課題から取り組むべきものを絞り込むこと、数値化は目標を数値で表すこと、水平展開はある部門の成果や対策を他部門にも広げることで、いずれも上位目標との整合や部門間調整そのものを指す語ではない。決め手は「上位との整合+関係部門との調整」。","src":"解説書 p.218","conflict":""},{"id":"r35q14n83","round":35,"q":14,"no":83,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準の管理活動をPDCAで回すとき、計画(Plan)の段階で行うことはどれか。","options":["社内標準を作成する","社内標準どおり実施する","社内標準に問題がないかを検討する","社内標準を改訂し、良いレベルに移行する"],"answer":0,"explanation":"Planでは目的を決め、それを達成する方法として、品質標準や技術的な条件、作業標準を決める。これが「社内標準を作成する」にあたる。標準どおり実施するのはDo、問題がないか検討するのはCheck、改訂して良いレベルに移行するのは、一周したあとに次のPDCAへ移る場面。覚え方は、Plan=標準をつくる、Do=標準どおりやる、Check=標準に問題がないか調べる、Act=原因を追究して必要なら改訂。","src":"解説書 p.219","conflict":""},{"id":"r35q14n84","round":35,"q":14,"no":84,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準の管理活動をPDCAで回すとき、実施(Do)の段階で行うことはどれか。","options":["社内標準どおりに作業を実施する","実施の結果を標準と比較して評価する","原因を追究し、必要なら標準を改訂する","新たに社内標準を作成する"],"answer":0,"explanation":"Doは、標準について教育訓練を行ったうえで、標準どおりに作業を行う段階。標準と結果を比べて評価するのはCheck、原因を追究して必要なら改訂するのはAct、標準を作成するのはPlanなので、いずれもDoではない。この段階の肝は「標準どおり」にやること。標準から外れてしまうと、次のCheckで標準そのものの良し悪しを判断できなくなる。","src":"解説書 p.219","conflict":""},{"id":"r35q14n85","round":35,"q":14,"no":85,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準の管理活動で、作業が標準どおりに行われて品質が作り込まれているかを確認し、社内標準に問題がないかを検討する段階は、PDCAのどれにあたるか。","options":["点検(Check)","計画(Plan)","実施(Do)","処置(Act)"],"answer":0,"explanation":"実施の過程が標準どおりかを確認し、結果を標準と比較して評価する段階がCheck。社内標準に問題がないかを検討するのもここで行う。標準を作るのがPlan、標準どおりに実施するのがDo、不具合の原因を調べて対策や標準の改訂を行うのがActなので、この文とは合わない。覚え方は、Check=結果を標準と見比べて確かめる。","src":"解説書 p.219","conflict":""},{"id":"r35q14n86","round":35,"q":14,"no":86,"part":"実践","field":"標準化","fmt":"tf","stem":"社内標準の管理活動で、標準に問題があると分かったとき、その原因を追究して対策を検討し、必要であれば標準を改訂する活動は、点検(Check)にあたる。","ok":false,"explanation":"誤り。この活動は処置(Act)にあたる。Checkは、標準どおりに作業が行われているかを確認し、結果を標準と比べて評価する段階。Actでは、標準と差異があれば処置を行い、不具合が出たら是正処置だけでなく再発防止処置も実施し、処置の効果を確認して必要なら標準を改訂する。決め手は「原因追究・対策・改訂」ならAct、「確認・評価」ならCheck。","src":"解説書 p.219","conflict":"","alt":{"stem":"社内標準の管理活動で、標準に問題があると分かったとき、その原因を追究して対策を検討し、必要であれば標準を改訂する活動は、処置(Act)にあたる。","explanation":"正しい。原因追究・対策・標準の改訂は処置(Act)の活動である。点検(Check)は、標準どおりに作業が行われているかを確認し、結果を標準と比べて評価する段階で、紛らわしいが別の段階である。Actでは、不具合が出たら是正処置だけでなく再発防止処置も実施し、効果を確認して必要なら標準を改訂する。決め手は、確認・評価が目的ならCheck、差異への手当てが目的ならActという点である。"}},{"id":"r35q14n87","round":35,"q":14,"no":87,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準の管理活動で、PDCAを1周回したあと、管理の水準を一段上げて次のPDCAに移るときに行うことはどれか。","options":["社内標準を改訂し、良いレベルに移行する","社内標準どおりに実施して水準を維持する","社内標準を新たに作成する","社内標準に問題がないかを検討する"],"answer":0,"explanation":"管理活動では、管理のサイクルを確実に継続して回すとともに、継続的な改善によって管理水準を向上させ、次のPDCAを回す。そのつなぎ目に置かれるのが、標準を改訂して良いレベルに移行すること。標準どおりに実施して水準を維持するだけでは、次の水準に上がらない。問題がないかの検討はCheckの中身で、水準を上げる行為そのものではない。維持だけならSDCA、向上まで含めるなら改訂とレベルアップ、と整理する。","src":"解説書 p.218","conflict":""},{"id":"r35q14n88","round":35,"q":14,"no":88,"part":"実践","field":"標準化","fmt":"mc","stem":"次のうち、日本の国家標準にあたるものはどれか。","options":["JAS","ASTM","ISO","IEC"],"answer":0,"explanation":"JAS(日本農林規格)は、日本の国家標準の一つ。国家標準としてはほかに、日本産業規格(JIS)がある。ASTMはアメリカの団体標準として日本でもよく知られたもの、ISO(国際標準化機構)とIEC(国際電気標準会議)は国際標準を制定する組織や規格で、国家標準ではない。標準は、団体標準、国家標準、国際標準というように、作られる範囲で区別して覚える。","src":"補筆(解説書 p.218に解答のみ。詳しい解説は本ノートに無い)","conflict":""},{"id":"r35q14n89","round":35,"q":14,"no":89,"part":"実践","field":"標準化","fmt":"tf","stem":"国際電気標準会議(IEC)は、電気・電子技術の分野の国際標準を制定している組織である。","ok":true,"explanation":"正しい。IECは、電気・電子技術の分野を受け持つ国際標準の組織。国際標準を制定する組織としては、国際標準化機構(ISO)も並んで挙げられるが、ISOは電気・電子技術以外の幅広い分野を受け持つ。覚え方は、電気の国際標準はIEC、それ以外を広く受け持つのはISO。","src":"補筆","conflict":""},{"id":"r35q15n90","round":35,"q":15,"no":90,"part":"実践","field":"人材育成","fmt":"mc","stem":"教育の進め方として、全員一律ではなく、職階や職位ごとに必要な知識や技能を習得させる区分はどれか。","options":["階層別教育","分野別教育","自己啓発","全員参加"],"answer":0,"explanation":"新入社員から経営層までを職階・職位で区分し、それぞれに必要な内容を教える教育が階層別教育。分野別教育は、仕事の種類(部署の分野)に応じた教育の区分で、切り口が違う。自己啓発は、個人が自主的に取り組む学習。全員参加は品質経営の考え方であり、教育の区分の名前ではない。決め手は「職階・職位ごと」。","src":"補筆","conflict":""},{"id":"r35q15n91","round":35,"q":15,"no":91,"part":"実践","field":"人材育成","fmt":"mc","stem":"組織が行う教育内容の全体像をまとめ、個々の教育の位置づけや関係性を関係者全員が理解・共有できるようにしたものはどれか。","options":["教育体系","教育計画書","教育訓練記録","力量表"],"answer":0,"explanation":"教育の全体像を体系的にまとめたものが教育体系で、組織全体の教育の基礎になる。これにより、個々の教育内容の位置づけや関係性を関係者が共有できる。教育計画書は個々の教育を実施するための計画を示す文書、教育訓練記録は実施した教育の結果を記録したもの、力量表は個人ごとの力量の保有状況を一覧にしたもので、いずれも教育の全体像そのものを示すものではない。決め手は「教育の全体像+位置づけの共有」。","src":"補筆","conflict":""},{"id":"r35q15n92","round":35,"q":15,"no":92,"part":"実践","field":"人材育成","fmt":"tf","stem":"戦後の品質管理の普及に貢献した考え方に、「品質管理は検査に始まり検査に終わる」というものがある。","ok":false,"explanation":"誤り。正しくは「品質管理は教育に始まり教育に終わる」。品質管理は検査で不良を見つけるだけでは成り立たず、全員が学び、理解することが出発点にも到達点にもなるという考え方。ことわざの一語だけを入れ替えたひっかけに注意し、「教育に始まり教育に終わる」と丸ごと覚える。","src":"補筆","conflict":"","alt":{"stem":"戦後の品質管理の普及に貢献した考え方に、「品質管理は教育に始まり教育に終わる」というものがある。","explanation":"正しい。品質管理は検査で不良を見つけるだけでは成り立たず、全員が学び、理解することが出発点にも到達点にもなるという考え方である。「検査に始まり検査に終わる」と一語入れ替えた形は誤りで、区別が必要。決め手は、品質管理の土台が人を育てることに置かれている点にある。"}},{"id":"r35q15n93","round":35,"q":15,"no":93,"part":"実践","field":"人材育成","fmt":"tf","stem":"部署によって仕事が分かれ、必要な教育内容もそれぞれ異なるという事情に対応するのは、階層別教育である。","ok":false,"explanation":"誤り。仕事の分野によって必要な内容が違うことに対応するのは分野別教育。階層別教育は、職階・職位ごとに必要な知識を教える区分。教育体系の基本形は、階層別教育と分野別教育を組み合わせた形。決め手は、区分の軸が「職位の上下」か「仕事の種類」か。","src":"補筆","conflict":"","alt":{"stem":"部署によって仕事が分かれ、必要な教育内容もそれぞれ異なるという事情に対応するのは、分野別教育である。","explanation":"正しい。仕事の分野によって必要な内容が違うことに対応するのが分野別教育である。階層別教育は職階・職位ごとに必要な知識を教える区分で、教育体系の基本形は両者の組み合わせである。決め手は、区分の軸が仕事の種類か職位の上下かである。"}},{"id":"r35q15n94","round":35,"q":15,"no":94,"part":"実践","field":"人材育成","fmt":"mc","stem":"英語検定試験への挑戦のように、今すぐ業務で必須ではないが、個人が将来を見据えて自主的に取り組む側面をもつ教育を何というか。","options":["自己啓発","階層別教育","分野別教育","全員参加"],"answer":0,"explanation":"業務に直結しないが、個人が自主的に取り組む学習の側面は自己啓発。組織の教育体系に、どこまで自己啓発を盛り込むかは検討が必要になる。階層別教育は職位ごと、分野別教育は仕事の種類ごとに必要な内容を教えるもので、業務上の必要性を前提にしている。決め手は「個人の自主性」と「今すぐ必須ではない」の2点。","src":"補筆","conflict":""},{"id":"r35q15n95","round":35,"q":15,"no":95,"part":"実践","field":"人材育成","fmt":"mc","stem":"教育内容の候補として、品質管理の基本、実験計画法入門、組織経営とマネジメント、精密研磨設備の操作方法、組織人としての倫理と行動、新入社員のための基礎知識と心構え、金属加工の最先端技術の動向が挙がった。役員から新入社員まで、全員を対象にすべき教育内容の組み合わせはどれか。","options":["品質管理の基本、組織人としての倫理と行動","実験計画法入門、組織経営とマネジメント","組織経営とマネジメント、金属加工の最先端技術の動向","精密研磨設備の操作方法、新入社員のための基礎知識と心構え"],"answer":0,"explanation":"品質管理の基本と、組織人としての倫理と行動は、立場や職種にかかわらず全員が身につけるべき内容。ほかの候補は対象が限られる。実験計画法入門や最先端技術の動向は技術系の担当者向け、組織経営とマネジメントは管理職・幹部向け、設備の操作方法は製造の担当者向け、新入社員向けの基礎知識と心構えは新入社員向け。判断の軸は、その内容が「立場や職種によらず全員に必要か」。","src":"補筆","conflict":""},{"id":"r35q16n96","round":35,"q":16,"no":96,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"JIS Q 9000:2015の品質マネジメントの原則のうち、提供者など密接に関連する利害関係者との関係をマネジメントして、持続的な成功を目指す原則はどれか。","options":["関係性管理","供給者との互恵関係","マネジメントへのシステムアプローチ","客観的事実に基づく意思決定"],"answer":0,"explanation":"2015年版の七つの原則は、顧客重視、リーダーシップ、人々の積極的参加、プロセスアプローチ、改善、客観的事実に基づく意思決定、関係性管理。2015年版は、供給者に限らず、密接に関連する利害関係者との関係をマネジメントする原則を関係性管理と呼ぶ。「供給者との互恵関係」は2000年版にあった原則で、対象を供給者に限らず利害関係者一般に広げたのが関係性管理にあたる。「マネジメントへのシステムアプローチ」も以前の版の原則の名称で、2015年版の七つの原則には含まれない。客観的事実に基づく意思決定は、データや情報の分析結果にもとづく判断の原則で、関係のマネジメントとは別。JISは日本産業規格の略。","src":"補筆","conflict":""},{"id":"r35q16n97","round":35,"q":16,"no":97,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"JIS Q 9000:2015の七つの原則のうち、組織が現在のパフォーマンス水準を維持し、内外の状況の変化に対応するために継続して取り組む原則はどれか。","options":["改善","変革","客観的事実に基づく意思決定","顧客重視"],"answer":0,"explanation":"現在のパフォーマンスの水準を維持しつつ、内外の状況の変化に対応して新たな機会をつくるために取り組み続ける原則が「改善」。変革という語は七つの原則には含まれない。客観的事実に基づく意思決定は判断の根拠をデータにおく原則、顧客重視は顧客の要求を満たし期待を超える努力をする原則で、この文の内容ではない。決め手は「維持+変化への対応=改善」。JISは日本産業規格の略。","src":"補筆","conflict":""},{"id":"r35q16n98","round":35,"q":16,"no":98,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"JIS Q 9000:2015の「顧客重視」で、組織が持続的に成功するために、顧客や利害関係者の何を満たし、さらに期待を超える努力をすることが必要とされているか。","options":["要求事項","信頼度","方向性","戦略計画"],"answer":0,"explanation":"顧客重視では、顧客や利害関係者の要求事項を満たし、さらに期待を超える努力をすることが必要とされる。信頼度は、製品が故障せずに使える確からしさを示す言葉で、この場面のものではない。方向性や戦略計画は、リーダーシップや経営計画の話で、顧客重視の目的語にはならない。覚え方は、満たすのは要求事項、超えるのは期待。JISは日本産業規格の略。","src":"補筆","conflict":""},{"id":"r35q16n99","round":35,"q":16,"no":99,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"「顧客重視」を実践するには、顧客の現在と将来のニーズを組織全体に伝達し、さらに何を常に監視し、評価し、必要に応じて処置をとることが求められるか。","options":["顧客満足","信頼度","力量","貢献"],"answer":0,"explanation":"顧客重視の要旨は、顧客の現在と将来のニーズを理解して全組織に伝えることと、顧客満足を常に監視・評価し、必要に応じて処置をとること。力量と貢献は人々の積極的参加の原則で出てくる語で、顧客重視の話ではない。信頼度は製品の信頼性に関する語で、この場面と合わない。決め手は、顧客を主語にした「満足」を測って対応すること。","src":"補筆","conflict":""},{"id":"r35q16n100","round":35,"q":16,"no":100,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"JIS Q 9000:2015の「人々の積極的参加」で、組織内の各階層の人々が持つ必要があるとされているものはどれか。","options":["力量","方向性","戦略計画","変化"],"answer":0,"explanation":"組織の各階層の人々に、力量があり、権限が与えられていることが、組織の実現能力を強化するために必要。力量とは、知識と技能を活用して意図した結果を出す能力のこと。方向性や戦略計画はリーダーシップや経営計画側の話、変化は改善の原則にかかわる語で、人が持つべきものとしては合わない。覚え方は、人々の積極的参加=力量+権限+貢献の認知。JISは日本産業規格の略。","src":"解説書 p.223","conflict":""},{"id":"r35q16n101","round":35,"q":16,"no":101,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"「人々の積極的参加」で、各階層の人々に力量と権限があることに加え、その活動に対して何が認められることで、品質目標の達成に向けた積極的な参加が促進されるとされているか。","options":["貢献","顧客満足","要求事項","変化"],"answer":0,"explanation":"組織のすべての人々を尊重し参加を促したうえで、その活動の貢献を認めることで、積極的な参加が促進される。顧客満足や要求事項は顧客重視の語、変化は改善の原則にかかわる語で、人々の活動を認める文脈にはならない。覚え方は、力量+権限を与え、貢献を認める。","src":"解説書 p.223","conflict":""},{"id":"r35q17n102","round":35,"q":17,"no":102,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"コンプライアンス違反のように事業継続の脅威となる事案を、発生してからの対応ではなく、未然防止を基本として管理する活動はどれか。","options":["リスクマネジメント","変更管理","広報活動","訴訟"],"answer":0,"explanation":"コンプライアンスの管理は、事業継続を脅かす事案に対応する管理であるリスクマネジメントにつながり、その基本は未然防止。小さな芽のうちに問題を把握して解決する。変更管理は仕様や工程の変更を管理する活動で、違反の未然防止とは別。広報活動や訴訟は、問題が表に出た後の対応であり、未然防止を基本とする活動ではない。決め手は「発生前に防ぐ」。","src":"解説書 p.223","conflict":""},{"id":"r35q17n103","round":35,"q":17,"no":103,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"コンプライアンスの相談窓口で、ハラスメントのような個人情報を含むデリケートな問題を早期に相談してもらうために、相談者や相談内容が漏れないよう守られることを何というか。","options":["秘匿性","透明性","制度化","広報活動"],"answer":0,"explanation":"秘密がしっかり守られるかどうかを秘匿性という。誰が相談したかが加害側に知られると事態は深刻になるため、早期の相談には秘匿性が鍵になる。透明性は、相談後の対応状況が見えるようにすることで、守る対象が違う。制度化や広報活動は、窓口の設置や周知の話で、情報を守る性質そのものではない。覚え方は、隠す=秘匿性、見せる=透明性。","src":"解説書 p.223・224","conflict":""},{"id":"r35q17n104","round":35,"q":17,"no":104,"part":"実践","field":"倫理・社会的責任","fmt":"tf","stem":"コンプライアンスの相談窓口を信頼してもらうには、相談後の対応の状況がわかるようにすることが重要で、そのために必要なのは秘匿性である。","ok":false,"explanation":"誤り。相談後の対応状況がわかるようにすることは透明性。秘匿性は、相談内容や相談者を守ることを表す。相談後に対応が見えないと、どうせ言っても無駄だという不信が広がってしまうため、対応の透明性が求められる。秘匿性は「守る」、透明性は「見せる」と分けて覚える。","src":"解説書 p.224","conflict":"","alt":{"stem":"コンプライアンスの相談窓口を信頼してもらうには、相談後の対応の状況がわかるようにすることが重要で、そのために必要なのは透明性である。","explanation":"正しい。相談後の対応状況がわかるようにすることは透明性である。秘匿性は、相談内容や相談者を守ることを表す別の要件で、混同しやすい。相談後に対応が見えないと、言っても無駄だという不信が広がるため、対応の透明性が求められる。決め手は、秘匿性は相談者を守るため、透明性は対応を見せて信頼を得るためという目的の違いである。"}},{"id":"r35q17n105","round":35,"q":17,"no":105,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"コンプライアンスの欠如が社会に与える影響の大きさから、企業が社会的存在として果たすべき責任の重点実施項目の一つとして、コンプライアンスを位置づけることがある。この責任を表す用語はどれか。","options":["CSR","リスクマネジメント","広報活動","変更管理"],"answer":0,"explanation":"CSR(企業の社会的責任)の活動の一環としてコンプライアンスに取り組むと、適切な企業倫理の実現が近づく。リスクマネジメントは事業継続を脅かす事案の未然防止などの管理であって、社会的責任という枠組みそのものではない。広報活動と変更管理も責任を表す言葉ではない。決め手は「社会的存在としての責任」。","src":"解説書 p.224","conflict":""},{"id":"r36q7n48","round":36,"q":7,"no":48,"part":"手法","field":"抜取検査","fmt":"mc","stem":"外注先から購入する部品の受入検査で、外注先に品質向上への刺激を与えたい。検査方式のうち、この目的に最も有効とされるものはどれか。","options":["抜取検査","全数検査","無試験検査","間接検査"],"answer":0,"explanation":"抜取検査は、サンプルの結果でロット全体を合格か不合格かに判定する。不合格になればロットごと返品などの扱いを受けるので、供給者は工程の品質を上げなければならないという刺激を受ける。全数検査は不適合品を1個ずつ取り除いてしまうため、供給者側に品質向上の圧力がかかりにくい。無試験検査は検査そのものをしないので刺激はない。間接検査は、供給者の検査データや品質保証体制を確認したうえで受入側の検査を省略する方式で、ロットごとに直接合否を判定して返品などを行う抜取検査ほど直接的な刺激にはならない。覚え方は「ロットごと合否を決める抜取検査が、供給者への刺激になる」。","src":"補筆","conflict":""},{"id":"r36q7n49","round":36,"q":7,"no":49,"part":"手法","field":"抜取検査","fmt":"mc","stem":"合格にしたい良いロットの不適合品率と、不合格にしたい悪いロットの不適合品率を指定して、生産者と消費者の双方の立場を考えて検査方式を決める抜取検査を何というか。","options":["規準型抜取検査","選別型抜取検査","調整型抜取検査","逐次抜取検査"],"answer":0,"explanation":"規準型は、良いロットの不適合品率p0(合格させたい水準)と悪いロットの不適合品率p1(不合格にしたい水準)を指定し、生産者と消費者のリスクを両方おさえるように方式を決める。選別型は、不合格になったロットを全数選別する前提で、ロットの許容不適合品率(LTPD)や平均出検品質限界(AOQL)などを基準に設計する型で、p0・p1を指定する規準型とは基準の立て方が異なる。調整型は、検査の成績(過去のロットの品質)に応じて、なみ・きつい・ゆるいの検査を切り替える方式。逐次抜取検査は、サンプルを少数ずつ追加しながら合否を逐次判定していく方式で、p0・p1を指定する規準型とは手順が異なる。覚え方は「良いロットと悪いロットの2点を指定する=規準型」。","src":"補筆","conflict":""},{"id":"r36q7n50","round":36,"q":7,"no":50,"part":"手法","field":"抜取検査","fmt":"tf","stem":"寸法不良と外観不良のように、複数の特性をまとめて「不適合品かどうか」で判定する場合に、ひとつの抜取検査で済ませるには、計量値抜取検査を使うのが適切である。","ok":false,"explanation":"誤り。この場合は計数値抜取検査を使う。計数値抜取検査は、不適合品の個数のように数えて判定する検査で、寸法と外観を合わせて適合か不適合かだけを決めるときにそのまま使える。計量値抜取検査は、長さや重さなど測定した値そのものを使う検査で、原則として1つの特性を扱う。外観のように測定値にならないものは対象にできない。覚え方は「まとめて良否を数える=計数値、1つの特性を測る=計量値」。","src":"補筆","conflict":"","alt":{"stem":"寸法不良と外観不良のように、複数の特性をまとめて「不適合品かどうか」で判定する場合に、ひとつの抜取検査で済ませるには、計数値抜取検査を使うのが適切である。","explanation":"正しい。計数値抜取検査は、不適合品の個数のように数えて判定する検査で、寸法と外観を合わせて適合か不適合かだけを決めるときにそのまま使える。計量値抜取検査は、長さや重さなど測定した値そのものを使う検査で、原則として1つの特性を扱い、外観のように測定値にならないものは対象にできない。決め手は、判定に使うのが数えた個数か、測った値かという点にある。"}},{"id":"r36q7n53","round":36,"q":7,"no":53,"part":"手法","field":"抜取検査","fmt":"mc","stem":"サンプルの中の不適合品が2個以下ならロットを合格とする抜取検査を行う。ロットの母不適合品率が5%のとき、サンプルに不適合品が0個、1個、2個含まれる確率は、それぞれ1.6%、7.0%、14.5%である。この検査でロットが合格する確率は何%か。","options":["23.1","8.6","14.5","42.9"],"answer":0,"explanation":"合格になるのは、不適合品が2個以下、つまり0個・1個・2個のどれかのとき。これらは同時に起こらない別々の事象なので、確率を足して1.6+7.0+14.5=23.1%になる。8.6は0個と1個だけを足したもので合格判定個数を1として計算したときの値。14.5は2個ちょうどの確率だけを取り出した誤り。42.9は3個(19.8%)まで足したもので、判定個数を3にした場合の値。覚え方は「合格確率は、判定個数以下の確率の合計」。","src":"補筆","conflict":""},{"id":"r36q7n54","round":36,"q":7,"no":54,"part":"手法","field":"抜取検査","fmt":"mc","stem":"抜取検査で、横軸にロットの不適合品率、縦軸にロットが合格する確率をとって、検査方式の判定能力を表した曲線を何というか。","options":["OC曲線","バスタブ曲線","正規曲線","ソーンダイク曲線"],"answer":0,"explanation":"OC曲線(検査特性曲線)は、不適合品率ごとにロットがどれだけ合格するかを示したもので、抜取検査方式の良し悪しを見るのに使う。バスタブ曲線は故障率が時間とともに変わる様子(初期故障・偶発故障・摩耗故障)を表す曲線、正規曲線は正規分布の形を表す曲線、ソーンダイク曲線は学習の進み方を表す曲線で、抜取検査とは関係がない。覚え方は「OCは合格確率の曲線」。","src":"補筆","conflict":""},{"id":"r36q8n55","round":36,"q":8,"no":55,"part":"実践","field":"管理の方法","fmt":"mc","stem":"部品の誤組付けによるトラブルが起きた直後に、選別や手直しなどで不適合品を後工程へ流さないようにして、損害をできるだけ小さく抑える暫定的な処置を何というか。","options":["応急対策","未然防止","予測予防","類似原因の再発防止"],"answer":0,"explanation":"トラブル発生直後に、被害の拡大を止める暫定的な処置が応急対策で、不適合品と適合品を混ぜずに隔離し、未検査品や未手直し品を流出させないことが最優先になる。未然防止や予測予防は問題が起きる前の対応、類似原因の再発防止は原因を突き止めたあとの恒久的な対策で、時点が違う。決め手は時間軸で、「起きた直後の暫定処置」なら応急対策。","src":"解説書 p.263","conflict":""},{"id":"r36q8n56","round":36,"q":8,"no":56,"part":"実践","field":"管理の方法","fmt":"mc","stem":"部品Xの代わりに部品Yを誤って組み付けた不具合に対し、部品Xのビス穴位置を変えて部品Yを組み付けられなくした。この対策は、再発防止の取組みとして次のうちどれに当たるか。","options":["個別の再発防止","類似原因の再発防止","システムの再発防止","予測予防"],"answer":0,"explanation":"起きた不具合そのもの(部品XとYの取り違え)が二度と起きないようにする対策は、個別の再発防止。再発防止は、個別、類似原因、仕組み(システム・根本原因)の3段階で考える。他の製品や工程へ広げるのは類似原因、ミスを生んだ仕事の仕組みを見直すのはシステム(根本原因)の再発防止。予測予防は、まだ起きていない問題を予測して手を打つもので、すでに起きた不具合への対策ではない。決め手は対象の広さで、「その不具合そのもの」なら個別。","src":"補筆","conflict":""},{"id":"r36q8n57","round":36,"q":8,"no":57,"part":"実践","field":"管理の方法","fmt":"tf","stem":"類似原因の再発防止とは、不具合が起きた製品と同じ製品の同じ工程だけを対象に、その不具合が再び起きないようにする対策である。","ok":false,"explanation":"誤り。類似原因の再発防止は、同じ製品・同じ工程に限らず、原因が同じになりうる他の製品や工程まで調べて対策を広げること。同じ原因なら、現象や工程が違っても再発とみなし、他の部品への横展開までを行う。起きた不具合そのものだけを対象にするのは個別の再発防止。決め手は範囲で、「同じ不具合だけ」なら個別、「同じ原因が潜む他の場所まで」なら類似原因。","src":"解説書 p.263","conflict":"","alt":{"stem":"類似原因の再発防止とは、不具合が起きた製品や工程に限らず、同じ原因が潜みうる他の製品や工程まで対象を広げて、同じ原因による不具合が再び起きないようにする対策である。","explanation":"正しい。類似原因の再発防止は、原因が同じになりうる他の製品や工程まで調べて対策を横展開することである。起きた不具合そのものだけを対象にするのは個別の再発防止で、範囲が異なる。決め手は、同じ原因が潜む他の場所まで対策が及ぶかどうかである。"}},{"id":"r36q8n58","round":36,"q":8,"no":58,"part":"実践","field":"管理の方法","fmt":"mc","stem":"誤った部品を組み付けられない形状にしたり、組付けミスをセンサーで検知したりして、人為的なミスの発生を防ぐ、または見つける仕組みを何というか。","options":["エラープルーフ","フェイルセーフ","応急対策","予測予防"],"answer":0,"explanation":"エラープルーフは、人が間違えにくい、または間違えても先へ進めない仕組みにすることで、形状の工夫やセンサーによる検知が典型例。フェイルセーフは、装置が故障したり異常が起きたりしても、安全な側に働くように設計する考え方で、人の作業ミスを防ぐ話とは焦点が違う。応急対策はトラブル発生後の暫定処置、予測予防は起こりうる問題を事前に想定して手を打つ活動。決め手は目的で、「人のミスを防ぐ・見つける」ならエラープルーフ、「壊れても安全」ならフェイルセーフ。","src":"解説書 p.263(補筆を含む)","conflict":""},{"id":"r36q8n59","round":36,"q":8,"no":59,"part":"実践","field":"管理の方法","fmt":"tf","stem":"根本原因の再発防止では、ミスをした作業者を特定し、その個人への再教育を徹底することが対策の中心になる。","ok":false,"explanation":"誤り。根本原因の再発防止では、作業者個人の責任にするのではなく、なぜミスを防げなかったのか、仕事のやり方や仕組みのどこが悪かったのかに着目する。個人の再教育や、標準の該当箇所の修正だけで終わらせず、標準の作り方・要点の決め方・教育訓練の仕組みそのものまで見直すことが恒久対策になる。決め手は「人でなく仕組みを直す」こと。","src":"解説書 p.263","conflict":"","alt":{"stem":"根本原因の再発防止では、ミスをした個人の責任にせず、仕事のやり方や仕組みのどこが悪かったかに着目して対策を行うことが中心になる。","explanation":"正しい。根本原因の再発防止では、作業者個人の責任にせず、なぜミスを防げなかったのか、仕事のやり方や仕組みのどこが悪かったのかに着目する。個人の再教育や作業標準の見直しだけを対策にすると、十分な恒久対策とはいえない。工程分析のやり方、作業標準の要点の決め方、教育・訓練の仕組みなどが見直しの対象になる。決め手は、再発を防ぐ目的なら人でなく仕組みを直すという点である。"}},{"id":"r36q8n60","round":36,"q":8,"no":60,"part":"実践","field":"管理の方法","fmt":"mc","stem":"これまでに経験し、情報として蓄積してきた問題を、新しい製品・サービス・プロセスにも汎用的に適用することで、同様の問題が起きないようにする活動を何というか。","options":["未然防止","応急対策","予測予防","個別の再発防止"],"answer":0,"explanation":"過去に発生した問題の情報をデータベースなどで蓄積し、他の製品やプロセスにも適用して同様の問題を起こさないようにするのが未然防止。まったく経験のない問題にはあらかじめ対策を講じるのが難しいので、過去の問題の活用が効果的な進め方になる。予測予防は、まだ経験していない問題も含め、起こりうるトラブルを事前に想定する活動。過去の問題の知見を活かす未然防止を着実に進めることで、この予測の精度が高まる。応急対策は起きたあとの暫定処置、個別の再発防止は起きた不具合そのものへの対策。決め手は「過去の問題の知見を広く活かす」こと。","src":"補筆","conflict":""},{"id":"r36q8n61","round":36,"q":8,"no":61,"part":"実践","field":"管理の方法","fmt":"mc","stem":"問題が起こる前に、どのようなトラブルが発生しうるかを想定し、あらかじめ手を打つ活動を何というか。","options":["予測予防","応急対策","類似原因の再発防止","フェイルセーフ"],"answer":0,"explanation":"起こりうるトラブルを事前に想定して備える活動が予測予防。過去の問題の知見を活かす未然防止を着実に進めるほど、問題の兆候を事前にとらえられるようになり、予測の精度が高まる。応急対策は起きたあとの暫定処置、類似原因の再発防止は原因が判明したあとに他へ広げる対策で、どちらも問題が起きたあとの対応。フェイルセーフは故障時に安全側へ動く設計の考え方で、活動の名前ではない。決め手は時点で、「起こる前に想定する」なら予測予防。","src":"補筆","conflict":""},{"id":"r36q8n62","round":36,"q":8,"no":62,"part":"実践","field":"管理の方法","fmt":"tf","stem":"まだ表面化していない潜在トラブルを顕在化させて調べると、すでに起きたトラブルと同様の原因で発生している場合が少なくない。","ok":true,"explanation":"正しい。起きたトラブルは氷山の一角で、その下には表面化していない潜在トラブルが隠れている。潜在トラブルを見つけ出して調べると、すでに起きたものと同じ原因が潜んでいることが多いので、再発防止・未然防止・予測予防を効果的に進めるには、潜在トラブルの顕在化が大切になる。覚え方は「氷山の一角=潜在トラブル」。","src":"補筆","conflict":""},{"id":"r36q9n63","round":36,"q":9,"no":63,"part":"実践","field":"管理の方法","fmt":"mc","stem":"課題達成型QCストーリーの方策の立案で、方策案をできるだけ多く出すため、商品開発研究所のメンバーにも加わってもらってアイデア会議を行いたいと申し出た。この提案に対する課長の反応として最も適切なものはどれか。","options":["実施はいいことだ。提案どおりのメンバーで活発な議論を期待している。","実施はいいことだ。ただ、立場の異なる部署なので、参考になるアイデアは望めないと思う。","実施はいいことだ。ただ、まったく関係のない経理部や総務部にだけ頼むべきで、関係のある部署では似たアイデアしか出ないと思う。","アイデア会議は結論がまとまりにくいので、担当者が一人で方策案を考えたほうがよい。"],"answer":0,"explanation":"方策案を多く出すには、専門知識や情報をもつ関係部署のメンバーを加えて、さまざまな視点からアイデアを出し合うのが有効なので、提案どおりのメンバーで進めるのが適切。関係のある部署でも知識や視点は自部署と異なるので、参考になるアイデアが望めないとは言えない。関係のない部署にだけ頼む必要もなく、専門知識をもつ関係部署を外す理由もない。一人で考える方法は、アイデアの幅が狭くなる。決め手は「多様な視点で数を出す」こと。","src":"補筆","conflict":""},{"id":"r36q9n64","round":36,"q":9,"no":64,"part":"実践","field":"管理の方法","fmt":"mc","stem":"アイデア会議でブレーン・ストーミング法のほかに知られているアイデア発想法の組合せとして、適切なものはどれか。","options":["チェックリスト法、希望点列挙法、NM法","チェックシート法、希望点列挙法、NN法","チェックリスト法、目標点列挙法、NN法","チェックシート法、目標点列挙法、NM法"],"answer":0,"explanation":"アイデア発想法には、あらかじめ用意した項目のリストに沿って考えるチェックリスト法、こうなってほしいという希望を並べる希望点列挙法、類比(たとえ)を使って発想するNM法(考案者・中山正和の頭文字に由来)などがある。チェックシート法は、データを記録・集計するために使う用紙(QC七つ道具の一つ)で、発想法ではない。目標点列挙法やNN法という名前の発想法は一般的ではない。覚え方は「リスト、希望、NM」の3つ。","src":"補筆","conflict":""},{"id":"r36q9n65","round":36,"q":9,"no":65,"part":"実践","field":"管理の方法","fmt":"mc","stem":"方策案の期待効果を数値で評価する項目に、その方策の実現性まで含めている担当者に対して、課長が助言をするときの内容として最も適切なものはどれか。","options":["まず実現性を除いて期待効果で評価して選び、選んだ方策を実現性で評価して、実現性の低いものを外して決定する。","目標の達成が目的なので、実現性を期待効果の評価項目に入れるのは当然で、このままでよい。","実現性を評価に入れると実行できる方法だけが残るので、実現性は評価にまったく用いない。","実現性は評価の最初に確認し、実現性の低い方策案は方策の立案の段階で除外する。"],"answer":0,"explanation":"期待効果の評価に実現性を混ぜると、いま実行が難しくても効果の大きい方策が、最初の段階で落とされてしまう。そこでまず実現性を除いて期待効果で評価・選定し、選ばれた方策について実現性を評価して、実現性の低いものを外して決定する、という2段階にするのが適切。実現性を評価に入れて済ませると、効果の高い案を見逃す。実現性を最後まで使わないのも、実行できない方策を選ぶ危険がある。立案の段階で除外すると、アイデアの幅を狭める。決め手は「効果で選び、そのあと実現性で絞る」順序。","src":"補筆","conflict":""},{"id":"r36q10n66","round":36,"q":10,"no":66,"part":"実践","field":"品質の概念","fmt":"mc","stem":"サービスは、提供する人の経験やスキルによって内容が大きく変わってしまうことがある。サービスがもつこの特性を何というか。","options":["異質性","無形性","同時性","消滅性"],"answer":0,"explanation":"サービスの特性は、無形性・同時性・異質性・消滅性の4つ。提供する人の経験やスキルで内容が変わるのが異質性。無形性は接客のように形がないこと、同時性は提供と消費が同時に行われること、消滅性は貯めておけず在庫をもてないこと。ばらつきが問題になる話なら異質性。","src":"解説書 p.252","conflict":""},{"id":"r36q10n67","round":36,"q":10,"no":67,"part":"実践","field":"品質の概念","fmt":"tf","stem":"サービスには、貯めておけず在庫をもてないという消滅性があるため、提供するたびにサービスの品質を均等に保つことが難しい。","ok":false,"explanation":"誤り。提供するたびに品質を均等に保つのが難しいのは、提供する人の経験やスキルで内容が変わってしまう異質性による。消滅性は、サービスを貯めておけず在庫をもてない性質を表すもので、品質のばらつきとは別の話。ばらつきなら異質性、在庫がもてないなら消滅性と、見分ける。","src":"解説書 p.252","conflict":"","alt":{"stem":"サービスには、提供する人の経験やスキルで内容が変わってしまうという異質性があるため、提供するたびにサービスの品質を均等に保つことが難しい。","explanation":"正しい。提供するたびに品質を均等に保つのが難しいのは、提供する人の経験やスキルで内容が変わってしまう異質性による。消滅性は、サービスを貯めておけず在庫をもてない性質を表すもので、品質のばらつきとは別の話である。決め手は、品質のばらつきの原因が提供のたびに内容が変わる性質にある点である。"}},{"id":"r36q10n68","round":36,"q":10,"no":68,"part":"実践","field":"標準化","fmt":"mc","stem":"サービスを提供する人によるスキルのばらつきを、対応のマニュアルを整え、教育訓練を行うことで小さくしていく。このようにマニュアル化などでばらつきを小さくすることを何というか。","options":["標準化","拡大化","同質性","冗長性"],"answer":0,"explanation":"マニュアルなどで対応をそろえ、教育訓練で定着させてばらつきを小さくすることを標準化という。サービスの異質性(提供者ごとにばらつく性質)への対応として有効。同質性は「ばらつきがない性質」で、活動の名前ではなく結果の状態。拡大化や冗長性は、ばらつきを小さくする活動ではない。覚え方は「マニュアルでそろえる=標準化」。","src":"解説書 p.252","conflict":""},{"id":"r36q10n69","round":36,"q":10,"no":69,"part":"実践","field":"QC的ものの見方・考え方","fmt":"mc","stem":"サービス産業では顧客との接点が多いため、顧客を重視する考え方が根付いていることが多い。この考え方で、品質管理の原則の一つにもなっているものはどれか。","options":["顧客志向","顧客満足","顧客ロイヤリティ","苦情"],"answer":0,"explanation":"顧客を重視する考え方が顧客志向で、品質管理の原則の一つ。顧客満足は、サービスに対する期待と実績の差で測る、満足の度合いを表す概念。顧客ロイヤリティは、継続して購入したいという顧客の意思。苦情は顧客からの不満の表明にすぎない。決め手は「考え方・姿勢」を聞かれているかどうかで、姿勢なら顧客志向、満足の度合いなら顧客満足。","src":"解説書 p.252","conflict":""},{"id":"r36q10n70","round":36,"q":10,"no":70,"part":"実践","field":"品質の概念","fmt":"mc","stem":"サービスに対して顧客が持っている期待と、実際に提供されたサービスの実績との差で測る概念を何というか。","options":["顧客満足","顧客ロイヤリティ","顧客志向","価格"],"answer":0,"explanation":"サービスの品質の水準を評価するには、顧客がサービスにどれくらい満足しているかをとらえる。期待と実績の差で測るのが顧客満足で、顧客満足度調査で把握される。顧客ロイヤリティは、顧客満足の積み重ねの結果として現れる継続購入の意思。顧客志向は顧客を重視する姿勢で、測定の対象ではない。価格は評価の指標として期待と実績の差を測るものではない。決め手は「期待と実績の差」。","src":"解説書 p.252","conflict":""},{"id":"r36q10n71","round":36,"q":10,"no":71,"part":"実践","field":"品質の概念","fmt":"tf","stem":"顧客満足とは、顧客が継続的に製品やサービスを購入したいと望む、顧客の意思のことである。","ok":false,"explanation":"誤り。継続的に購入したいと望む顧客の意思は顧客ロイヤリティ。顧客満足は、サービスに対する期待と実績の差で測る満足の度合いで、両者は別の概念。特定の顧客における顧客満足が長期的に積み重なると顧客ロイヤリティに影響し、最終的には経営成果につながる。覚え方は「満足が積み重なってロイヤリティになる」。","src":"補筆","conflict":"","alt":{"stem":"顧客ロイヤリティとは、顧客が継続的に製品やサービスを購入したいと望む、顧客の意思のことである。","explanation":"正しい。継続的に購入したいと望む顧客の意思は顧客ロイヤリティである。顧客満足は期待と実績の差で測る満足の度合いで、別の概念。顧客満足が長期的に積み重なると顧客ロイヤリティに影響し、経営成果につながる。決め手は、満足の度合いか継続購入の意思かという定義の違いである。"}},{"id":"r36q11n72","round":36,"q":11,"no":72,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"消費者として想定していなかった幼児がゼリー製品をのどにつまらせる事故があった。想定する消費者の範囲を見直し、リスク評価などを踏まえて事故を防ぐ予防策を講じることは、何に対する取組みとして不可欠か。","options":["製品安全","信頼性","保全性","製造物責任防御"],"answer":0,"explanation":"使う人に危害を及ぼさないようにするための取組みが製品安全。事前に想定した消費者より実際の消費者層が広かったことが事故の原因なので、消費者の想定とリスク評価が要になる。信頼性は、決められた期間、機能を果たし続ける性質で、故障の話。保全性は、故障を修復しやすい、点検しやすいという性質。製造物責任防御は、事故が起きて訴訟になったときに備える活動で、事故を未然に防ぐ本問の取組みとは時点が異なる。決め手は「人への危害を防ぐ」こと。","src":"補筆","conflict":""},{"id":"r36q11n73","round":36,"q":11,"no":73,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"誤使用が起きたことをセンサーなどで検知したときには、安全に機能を停止させる設計にしておく。このような対応が必要になるのは、消費者によるどのような使用に備えるためか。","options":["意図しない使用","意図した使用","定期点検時の使用","長期間の使用"],"answer":0,"explanation":"誤使用は、設計者が意図していない使い方をされることで、意図しない使用の代表例。その使用を検知したら安全に機能を停止する設計にする。意図しない使用で事故が起こることが明白なら、製品の回収なども必要になる。意図した使用は、想定どおりの使い方で、これに安全に対応するのは当然のこと。長期間の使用は経年変化の話で、使い方の意図とは別。決め手は「想定外の使い方に備える」こと。","src":"補筆","conflict":""},{"id":"r36q11n74","round":36,"q":11,"no":74,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製品を長く使っている間に、使用環境やストレスの作用で、亀裂や破損などが生じる現象を何というか。","options":["経年変化","初期故障","偶発故障","意図しない使用"],"answer":0,"explanation":"長期間の使用で徐々に進む劣化や変化が経年変化で、亀裂・破損などが連鎖して事故につながることがある。初期故障は、使い始めの時期に設計や製造の不具合が原因で起こる故障で、長期使用による劣化ではない。偶発故障は、使用期間中に偶然の要因で不規則に起こる故障で、長期使用にともなう劣化とは性質が違う。意図しない使用は使い方の問題。決め手は「時間とともに進む劣化かどうか」。","src":"補筆","conflict":""},{"id":"r36q11n75","round":36,"q":11,"no":75,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"長期使用による劣化や故障を防ぐため、製品の目標寿命や使用環境の限界に対して適切な余裕を確保することが重要になる設計はどれか。","options":["信頼性設計","保全性設計","製品安全設計","冗長設計"],"answer":0,"explanation":"信頼性設計は、決められた条件で目標の期間、機能を果たし続けられるように設計するもので、長期使用による劣化や故障を防ぐため、目標寿命や使用環境の限界に対して余裕をもたせることが要点になる。保全性設計は、点検や修理のしやすさを高める設計。製品安全設計は、危害を防ぐことを目的にした設計。冗長設計は、一部が故障しても予備の系統で機能を保つように、あらかじめ余分な構成を組み込む設計で、寿命や使用条件の限界に余裕をもたせる話とは狙いが違う。決め手は「寿命と使用条件に余裕をもたせる」こと。","src":"補筆","conflict":""},{"id":"r36q11n76","round":36,"q":11,"no":76,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製造物責任に関する活動のうち、製品事故を未然に防止して消費者に安全な製品を提供するための活動を何というか。","options":["製造物責任予防","製造物責任防御","製造物責任","リコール"],"answer":0,"explanation":"製品事故が起こらないよう、事前に手を打って安全な製品を提供する活動が製造物責任予防(PLP)。これに対し、事故で訴訟が起こされたときに損害を最小限にとどめるための活動が製造物責任防御(PLD)。製造物責任は、欠陥による被害に対する損害賠償の責任のこと。リコールは、欠陥のある製品を回収・改修する措置そのものを指す言葉で、活動を予防か防御かに分類する言葉ではない。決め手は「事前に防ぐ=予防、訴訟に備える=防御」。","src":"補筆","conflict":""},{"id":"r36q11n77","round":36,"q":11,"no":77,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"製造物の欠陥により人の生命・身体または財産に被害が生じたとき、製造業者などの損害賠償の責任を定めている法律はどれか。","options":["製造物責任法","消費生活用製品安全法","消費者契約法","景品表示法"],"answer":0,"explanation":"製造物責任法(PL法)は、製造物の欠陥が原因で被害が生じたときに、製造業者などの賠償責任を定め、被害者を保護する法律。責任の要件は製造業者などの過失ではなく、製造物に欠陥があること。消費生活用製品安全法は製品事故の防止や情報の報告を定める法律で、賠償責任を定めたものではない。消費者契約法は契約上のトラブルから消費者を守る法律、景品表示法は不当な表示や過大な景品を規制する法律。決め手は「欠陥による被害の賠償責任」。","src":"解説書 p.255(末尾のみ。補筆を含む)","conflict":""},{"id":"r36q11n78","round":36,"q":11,"no":78,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"消費者の環境保全へのニーズや社会的責任の観点から取り組まれ、資源採取から製造、使用、廃棄までの環境への影響を、ライフサイクルアセスメントで定量的に評価して進める設計を何というか。","options":["環境配慮設計","信頼性設計","製品安全設計","保全性設計"],"answer":0,"explanation":"環境への影響を減らすことを目的に、製品のライフサイクル全体を通して環境負荷を評価しながら行う設計が環境配慮設計。ライフサイクルアセスメント(LCA)は、その影響を定量的に評価する手法。信頼性設計は故障しにくくする設計、製品安全設計は危害を防ぐ設計、保全性設計は保守・修理をしやすくする設計で、環境負荷を減らすことが目的ではない。決め手は、目的が環境保全かどうか。","src":"解説書 p.255","conflict":""},{"id":"r36q11n79","round":36,"q":11,"no":79,"part":"実践","field":"倫理・社会的責任","fmt":"mc","stem":"環境保全活動の基本となる3Rは、削減を表すリデュースと、再生・再資源化を表すリサイクルに、もう一つを加えたものである。もう一つの、再使用を表す語はどれか。","options":["リユース","リソース","リコール","リペア"],"answer":0,"explanation":"3Rは、リデュース(削減)、リユース(再使用)、リサイクル(再生・再資源化)の頭文字がRの3語。リユースは、使い終わったものを、そのまま繰り返し使うこと。リソースは資源、リコールは問題のある製品の回収、リペアは修理という意味で、いずれも3Rには含まれない。覚え方は「減らす、使い回す、再資源化する」。","src":"解説書 p.255","conflict":""},{"id":"r36q12n80","round":36,"q":12,"no":80,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理の年度末の反省で、ある施策について、計画どおりにプロセスを実行し、目標も達成できていた。この場合にとるべきアクションとして最も適切なものはどれか。","options":["改善事項の標準化を整備し、日常管理に移行するかどうかを検討する。","目標も達成したので、特にアクションはとらなくてよい。","目標を達成し得る手段だったかを調査・分析し、次年度の方針展開の見直しを検討する。","期の途中で方針の変更が行われなかったことを反省する。"],"answer":0,"explanation":"計画どおりに実行して目標も達成できたのは、施策とプロセスがうまく機能した状態なので、そのやり方を標準として残し、日常管理に移して定着させることを検討する。「特にアクション不要」とするのは、うまくいった理由を活かさず、次年度に再現できなくなるので不適切。手段の見直しや途中の方針変更の反省は、目標を達成できなかった場合のアクション。決め手は、結果とプロセスの組合せで、両方うまくいったなら標準化と日常管理への移行を考える。","src":"解説書 p.255(正解の対応のみ。理由は補筆)","conflict":""},{"id":"r36q12n81","round":36,"q":12,"no":81,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理の年度末の反省で、販売目標は達成できたが、計画で重点施策としていた販売強化活動が実行されていなかったことが分かった。この場合にとるべきアクションとして最も適切なものはどれか。","options":["目標が低すぎたのか、周囲の状況が変わったせいなのかを調べ、重点施策が未実施だった理由も明らかにする。","改善事項を標準化し、日常管理に移行するかどうかを検討する。","目標を達成し得る手段だったかを調査し、次年度の方針展開の見直しを検討する。","目標を達成したので、特にアクションはとらなくてよい。"],"answer":0,"explanation":"施策を実行していないのに目標を達成したのは、目標の設定が低すぎたか、環境の変化が味方したかのどちらかが疑われる。そこで、その原因と施策が未実施だった理由を明らかにしておく。標準化して日常管理へ移す対応は、実行したプロセス自体が効果的だった場合の話で、実行していない施策には当てはまらない。「達成したから何もしない」も、偶然の結果を見逃してしまう。決め手は、達成でもプロセスが計画と違うなら、なぜそうなったかを調べることだと覚える。","src":"解説書 p.255(正解の対応のみ。理由は補筆)","conflict":""},{"id":"r36q12n82","round":36,"q":12,"no":82,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理の年度末の反省で、月次の推進計画どおりに販売強化活動を進めたのに、販売目標を達成できなかった。この場合にとるべきアクションとして最も適切なものはどれか。","options":["目標を達成し得る手段(施策)だったか、期初の計画とのずれが生じていなかったかを調査・分析し、次年度の方針展開の見直しを検討する。","目標が低すぎなかったかを調査するとともに、重点施策が未実施だった理由を明らかにする。","なぜ計画どおりに実行できなかったのかを調査・分析し、期の途中で方針を変更しなかったことを反省する。","改善事項を標準化し、日常管理へ移行するかどうかを検討する。"],"answer":0,"explanation":"計画どおりにやったのに未達成なら、実行の問題ではなく、施策そのものが目標達成に結びつく手段でなかった可能性や、期初の計画から状況がずれていた可能性が高い。そのため、手段の適切さを分析し、次年度の方針展開を見直す。「なぜ実行できなかったか」を調べるのは、そもそも計画どおりに実行できなかった場合の話。決め手は、プロセスが計画どおりなら見直す対象は「計画・施策のほう」になること。","src":"解説書 p.255(正解の対応のみ。理由は補筆)","conflict":""},{"id":"r36q12n83","round":36,"q":12,"no":83,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理の年度末の反省で、販売強化活動を月次の推進計画どおりに進められず、その結果、販売目標も達成できなかった。この場合にとるべきアクションとして最も適切なものはどれか。","options":["なぜ計画どおりに実行できなかったのかを調査・分析し、期の途中で方針の変更が行われなかったことも反省する。","目標を達成し得る手段だったかを調査・分析し、次年度の方針展開の見直しを検討する。","改善事項を標準化し、日常管理に移行するかどうかを検討する。","目標が低すぎたのか、周囲の状況が変わったせいなのかを調査する。"],"answer":0,"explanation":"実行できていないことが未達成の直接の原因と考えられるので、まず実行できなかった理由を調べる。あわせて、途中で実行が遅れていると分かった時点で方針や計画を変更しなかった、というマネジメント側の対応も反省する。施策の手段を疑う見直しは、計画どおりにやっても達成できなかった場合の対応。決め手は、未実施なら「なぜ実行できなかったか」を最初に調べることだと覚える。","src":"補筆","conflict":""},{"id":"r36q13n84","round":36,"q":13,"no":84,"part":"実践","field":"機能別管理","fmt":"tf","stem":"各部門が日常管理を確実に行っていれば、それだけで、企画から出荷までの品質保証は確実なものになる。","ok":false,"explanation":"誤り。日常管理は、各部門が与えられた仕事を標準どおりに実施するための管理で、仕事の中身が顧客の求めているものと合っているかどうかまでは保証しない。企画の段階で製品コンセプトが顧客ニーズとずれていれば、各部門が日常管理を確実に行っていても、顧客に満足される製品にはならない。日常管理だけでなく、部門横断で全社的に評価する機能別管理が別に必要になる。日常管理は「決めたとおりにやる」、コンセプトの適否は「そもそも何を作るか」の問題と分けて考える。","src":"補筆","conflict":"","alt":{"stem":"各部門が日常管理を確実に行っていても、それだけでは、企画から出荷までの品質保証が確実になるとは限らない。","explanation":"正しい。日常管理は、各部門が与えられた仕事を標準どおりに実施するための管理で、仕事の中身が顧客の求めているものと合っているかどうかまでは保証しない。企画の段階で製品コンセプトが顧客ニーズとずれていれば、各部門が日常管理を確実に行っていても、顧客に満足される製品にはならない。日常管理だけでなく、部門横断で全社的に評価する機能別管理が別に必要になる。日常管理は「決めたとおりにやる」、コンセプトの適否は「そもそも何を作るか」の問題と分けて考える。"}},{"id":"r36q13n85","round":36,"q":13,"no":85,"part":"実践","field":"機能別管理","fmt":"mc","stem":"各部門が自分の仕事の日常管理をしているだけでは足りず、部門の枠を超えた管理が必要になる。その理由として最も適切なものはどれか。","options":["組織のすべての部門の活動が、製品・サービスの品質に影響しているから。","教育の取り組みが弱く、従業員のスキルが不足しているから。","全従業員が全社方針に基づいて一丸となって取り組む必要があるから。","品質に関わるのは、設計部門と製造部門の活動に限られるから。"],"answer":0,"explanation":"企画・設計が適切でも、購買が仕様どおりの材料・部品を調達できなかったり、製造が安定して作れなかったりすれば、良い製品は顧客に届かない。品質は特定の部門だけでなく、すべての部門の活動がつながって決まるため、部門を横断した管理が必要になる。設計と製造だけに限られるという見方は、購買・営業・品質保証などの影響を落としていて誤り。スキル不足は個別の課題で、部門横断管理が必要になる理由そのものではない。「全従業員が全社方針に基づいて一丸となって取り組む」は方針管理の説明であり、部門をまたぐ管理が必要になる理由(品質はすべての部門の活動で決まること)とは別の話。","src":"補筆","conflict":""},{"id":"r36q13n86","round":36,"q":13,"no":86,"part":"実践","field":"機能別管理","fmt":"mc","stem":"部門に与えられた仕事を実施するための日常管理だけでなく、品質・コスト・量など経営の基本要素ごとに、部門の枠を超えて評価し、必要なアクションをとることで品質保証を確実にするために確立する仕組みとして最も適切なものはどれか。","options":["部門間の横断的な管理プロセスである機能別管理","全社方針に基づいて全従業員が取り組む方針管理","各部門の内部だけで完結する目標管理","供給者に対する受入検査の強化"],"answer":0,"explanation":"品質・コスト・量・納期など経営の基本要素ごとに、部門をまたいで評価し、必要なアクションをとる仕組みが機能別管理。方針管理は、トップの方針を各階層へ展開して達成を図る管理で、要素ごとに部門横断で評価する点が特徴の機能別管理とは目的が異なる。部門内で完結する管理は、日常管理と同様に部門の枠を超えられない。決め手は「部門をまたぐ」ことと、「全社的な立場で評価」する点。","src":"補筆","conflict":""},{"id":"r36q13n87","round":36,"q":13,"no":87,"part":"実践","field":"機能別管理","fmt":"mc","stem":"品質保証の機能別管理で、営業部門が「調査・企画」の機能として担う取組みとして最も適切なものはどれか。","options":["顧客ニーズや市場動向を調査し、顧客が満足する製品を企画する。","量産品について製品検査を行い、できばえ品質を管理して品質を保証する。","設計した新製品についてデザインレビューを行い、製造への引継ぎを行う。","仕様書に基づいて材料・部品を調達し、受入検査で品質を確保する。"],"answer":0,"explanation":"顧客と接する営業部門は、顧客のニーズや市場の動きを把握できる立場にあるので、調査と企画の機能を担う。量産品の製品検査によるできばえの確認は品質保証部門、設計した新製品のデザインレビューは設計・開発部門、仕様書に基づく調達と受入検査は購買部門の取組み。部門ごとに得意な機能があるので、営業なら顧客に近い調査・企画と結びつけて覚える。","src":"補筆","conflict":""},{"id":"r36q13n88","round":36,"q":13,"no":88,"part":"実践","field":"機能別管理","fmt":"mc","stem":"機能別管理で、設計・開発部門が「設計の検証」の機能として行う取組みとして最も適切なものはどれか。","options":["設計した新製品についてデザインレビューを行い、設計の完成度を高めて製造へ引き継ぐ。","顧客ニーズや市場動向を調査し、顧客が満足する製品を企画する。","仕様書に基づいて量産を行い、条件管理を実施して安定的に生産する。","量産品について製品検査を行い、できばえ品質を管理して品質を保証する。"],"answer":0,"explanation":"設計の検証は、設計した内容が要求を満たしているかを関係者で確認し、完成度を高めて製造へ引き継ぐ取組みで、その具体的な場の一つがデザインレビュー(DR)である。ほかの選択肢は、営業の調査・企画、製造の量産、品質保証の製品検査の取組みで、設計の検証とは別の機能。決め手は「要求を満たすかを確認し、完成度を高めて引き継ぐ」という活動の中身であり、DRという語だけで判断しない。","src":"補筆","conflict":""},{"id":"r36q13n89","round":36,"q":13,"no":89,"part":"実践","field":"機能別管理","fmt":"mc","stem":"機能別管理で、製造部門が「製造・出荷」の機能として行う取組みとして最も適切なものはどれか。","options":["仕様書に基づいて量産を行い、条件管理を実施して安定的に生産する。","量産品について製品検査を行い、できばえ品質を管理して品質を保証する。","仕様書に基づいて材料・部品を調達し、受入検査で品質を確保する。","設計した新製品についてデザインレビューを行い、製造へ引き継ぐ。"],"answer":0,"explanation":"製造部門は、決められた仕様書や標準どおりに、設備や作業条件を管理しながら安定して作り込むのが役割。製品検査によるできばえの確認は品質保証部門、調達と受入検査は購買部門、デザインレビューは設計・開発部門の取組み。同じ製造・出荷の機能でも、部門ごとに分担が違い、製造は「作り込む」、品質保証は「確かめる」と区別する。","src":"補筆","conflict":""},{"id":"r36q13n90","round":36,"q":13,"no":90,"part":"実践","field":"機能別管理","fmt":"mc","stem":"機能別管理で、品質保証部門が「製造・出荷」の機能として行う取組みとして最も適切なものはどれか。","options":["量産品について製品検査を行い、できばえ品質を管理・改善して品質を保証する。","仕様書に基づいて量産を行い、条件管理を実施して安定的に生産する。","仕様書に基づいて材料・部品を調達し、受入検査で品質を確保する。","顧客ニーズや市場動向を調査し、顧客が満足する製品を企画する。"],"answer":0,"explanation":"品質保証部門は、製造部門が工程を管理して作った製品について、出荷の前にできばえを確認する製品検査を行い、適合の状況をつかんで品質を保証する。工程で条件を管理して安定生産するのは製造部門、材料の受入検査は購買部門、顧客ニーズの調査は営業部門の取組み。製造は「作り込む」、品質保証は「確かめて保証する」と覚える。","src":"解説書 p.259","conflict":""},{"id":"r36q13n91","round":36,"q":13,"no":91,"part":"実践","field":"機能別管理","fmt":"mc","stem":"機能別管理で、購買部門が「製造・出荷」の機能として、品質に関して行う取組みとして最も適切なものはどれか。","options":["仕様書に基づいて材料・部品を調達し、受入検査によって品質を確保する。","仕様書に基づいて量産を行い、条件管理を実施して安定的に生産する。","量産品について製品検査を行い、できばえ品質を管理して品質を保証する。","設計した新製品についてデザインレビューを行い、設計の完成度を高める。"],"answer":0,"explanation":"購買部門は、仕様どおりの材料・部品を購入し、生産で問題を起こさない要求どおりのものかを受入検査で確認することが、品質保証の重要な取組みになる。二社購買によるコストダウンも購買の機能の一つだが、品質に関する取組みとしては調達と受入検査が適切。生産条件の管理は製造、製品検査は品質保証、DRは設計・開発の取組み。購買なら「仕様どおりの調達と受入検査」と覚える。","src":"解説書 p.259","conflict":""},{"id":"r36q14n92","round":36,"q":14,"no":92,"part":"実践","field":"標準化","fmt":"mc","stem":"調達する部材を標準化して共通化を進めると、発注量が増えて調達先の在庫も確保しやすくなり、安価で早く手に入れられるようになる。このとき、標準化によって高まっている特性はどれか。","options":["互換性","信頼性","携帯性","重要度"],"answer":0,"explanation":"部品や材料を共通化すると、同じ規格のものなら取り替えてもそのまま使える。この取り替えのきく性質が互換性で、互換性が高いと発注量がまとまってコストダウンの可能性が上がり、調達先の在庫も十分に確保されて早く調達できる。信頼性は、使用中に必要な機能を果たし続ける性質のことで、部材の調達のしやすさとは別の観点。共通化して「取り替えがきく」なら互換性と覚える。","src":"解説書 p.259","conflict":""},{"id":"r36q14n93","round":36,"q":14,"no":93,"part":"実践","field":"標準化","fmt":"tf","stem":"作業標準書は、標準的な作業を目で見て分かる形に可視化しており、そのおかげで作業内容の伝達や、新人教育のテキストとして役立てることができる。","ok":true,"explanation":"正しい。作業標準書には、正しい手順や管理すべき重要ポイントが、誰が見てもすぐ分かるように示されている必要がある。可視化されていることで、作業内容を徹底させるための伝達手段にも、新人に教えるためのテキストにもなる。ここでの「可視化」は、標準的な作業を見える形にするという意味で、作業の良し悪しを判断するものではない。作業標準書といえば「見える形にして伝える」。","src":"解説書 p.259","conflict":""},{"id":"r36q14n94","round":36,"q":14,"no":94,"part":"実践","field":"標準化","fmt":"mc","stem":"新商品の設計で標準品を採用すると、標準品は市場での使用実績が高いので、どのような特性の高い設計ができるか。","options":["信頼性","互換性","携帯性","要求品質"],"answer":0,"explanation":"使用実績が豊富な標準品は、実際の使われ方の中で問題なく機能してきたことが分かっているので、それを使う設計は信頼性が高くなる。設計者は従来と異なる部分に注意を向ければよく、FMEAなどの検討時間も短くできる。互換性は、部品を取り替えても使える性質で、調達のしやすさに結びつく効果であり、使い続けて機能を果たしてきた実績とは別の性質。決め手は、実績が示すのは機能を果たし続ける信頼性であって、取り替えのきく互換性ではないこと。","src":"解説書 p.259(正解の対応のみ。理由は補筆)","conflict":""},{"id":"r36q14n95","round":36,"q":14,"no":95,"part":"実践","field":"標準化","fmt":"mc","stem":"異常が検出されて標準に不備があれば標準を改訂し、再教育して周知し、次のPDCAへ進む。改善結果が標準に蓄積され、より良い作業が行われるようになる。このような標準化の位置づけとして最も適切なものはどれか。","options":["管理を行うための基本的な手段","問題が起きた個所を担当者へ知らせるための連絡手段","生産コストを下げるための対策","工程解析の一手法"],"answer":0,"explanation":"標準を定め、守り、見直しながらPDCAを回していくので、標準化は管理を行うための基本的な手段といえる。問題箇所を担当者へ知らせる連絡手段は、異常発生時の情報伝達の話であり、標準化そのものの位置づけとは別。コスト低減は標準化の効果の一つだが、目的をそれに限るのは狭すぎる。工程解析は標準を定める前に工程の条件と品質特性の関係を調べる活動で、標準化そのものとは別。標準化は管理の土台となる手段、と覚える。","src":"解説書 p.259(正解の対応のみ。理由は補筆)","conflict":""},{"id":"r36q14n96","round":36,"q":14,"no":96,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"適切な作業標準を定めるために、工程の条件と製品の品質特性との関係を把握する活動として、十分に行うことが大切なものはどれか。","options":["工程解析","なぜなぜ分析","コスト低減","最終製品の検査の強化"],"answer":0,"explanation":"工程解析は、工程の条件が品質特性にどう影響するかを調べる活動で、その結果をもとに、どの条件をどの範囲で管理するかという作業標準が定まる。なぜなぜ分析は、起きた不具合の原因をなぜを重ねて掘り下げる方法で、条件と特性の関係を調べる活動とは目的が異なる。最終製品の検査を強めても、工程の条件は分からない。標準を作る前の調べものは工程解析、と覚える。","src":"解説書 p.259(正解の対応のみ。理由は補筆)","conflict":""},{"id":"r36q14n97","round":36,"q":14,"no":97,"part":"実践","field":"標準化","fmt":"tf","stem":"標準は、改善の出発点として必要である一方で、改善結果を反映して維持する役割は持たない。","ok":false,"explanation":"誤り。標準の役割は二つあり、一つは改善の出発点になること、もう一つは改善の結果を反映させて維持することである。改善の成果は標準に取り込んで初めて定着するので、維持の役割を持たないとはいえない。改善を進めるときは標準を基盤とし、「出発点」と「維持」の二つの役割をセットで覚える。","src":"解説書 p.259(正解の対応のみ。理由は補筆)","conflict":"","alt":{"stem":"標準は、改善の出発点として必要であるとともに、改善結果を反映して維持する役割も持つものである。","explanation":"正しい。標準の役割は二つあり、一つは改善の出発点になること、もう一つは改善の結果を反映させて維持することである。改善の成果は標準に取り込んで初めて定着する。改善を進めるときは標準を基盤とする。決め手は、改善を定着させるという目的から、出発点と維持の両方の役割を持つという点である。"}},{"id":"r36q15n98","round":36,"q":15,"no":98,"part":"実践","field":"小集団活動","fmt":"tf","stem":"QCサークル活動は1962年に日本で誕生したが、当初の目的は、現場の第一線に原価管理を定着させることにあった。","ok":false,"explanation":"誤り。誕生当初の目的は、現場の第一線に品質管理を定着させることだった。その後、QCサークル活動が人を育て職場の活力を高めることが認められて、TQMの一角として、また能力向上や職場の活性化の活動としても展開されるようになった。QCサークルのQCは品質管理(Quality Control)だと覚える。","src":"補筆","conflict":"","alt":{"stem":"QCサークル活動は1962年に日本で誕生したが、当初の目的は、現場の第一線に品質管理を定着させることにあった。","explanation":"正しい。誕生当初の目的は、現場の第一線に品質管理を定着させることだった。その後、QCサークル活動が人を育て職場の活力を高めることが認められて、TQMの一角として、また能力向上や職場の活性化の活動としても展開されるようになった。原価管理ではなく、QCは品質管理(Quality Control)を指す点が決め手である。"}},{"id":"r36q15n99","round":36,"q":15,"no":99,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークルは、第一線の職場で働く人々が、製品・サービス・仕事などの質の管理・改善を、どのように行う小グループと定義されているか。","options":["継続的に","一時的に","経営者の命令で強制的に","専門部署に代わって"],"answer":0,"explanation":"QCサークルは、第一線の職場で働く人々が継続的に製品・サービス・仕事などの質の管理・改善を行う小グループと定義される。一時的に集まるのは、特定の課題のために編成するプロジェクトチームのような組織。QCサークルは自主的な活動で、命令による強制や専門部署の代行ではない。QCサークルは職場で自主的に、続けて行うと覚える。","src":"補筆","conflict":""},{"id":"r36q15n100","round":36,"q":15,"no":100,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークル活動の基本理念のひとつに、人間の能力を発揮し、無限の何を引き出す、というものがある。何を引き出すのか。","options":["可能性","安全性","感受性","生産量"],"answer":0,"explanation":"基本理念は、人間の能力を発揮して無限の可能性を引き出すこと、人間性を尊重して生きがいのある明るい職場をつくること、企業の体質改善・発展に寄与すること、の三つ。人間の能力に対して、引き出されるものは可能性である。安全性や生産量は活動の成果の指標になりうるが、基本理念の文言ではない。能力と可能性はセットで覚える。","src":"補筆","conflict":""},{"id":"r36q15n101","round":36,"q":15,"no":101,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークル活動の基本理念のひとつに、生きがいのある明るい職場をつくるために、何を尊重する、というものがある。何を尊重するのか。","options":["人間性","生産量","原価","安全性"],"answer":0,"explanation":"従業員の自主性、すなわち人間性を尊重することで明るい職場ができ、さらに企業の体質改善や発展につながる、という流れになる。生産量や原価は職場の成果に関わる指標で、生きがいのある職場をつくるために尊重する対象ではない。安全性は職場を守る大事な観点だが、この理念の文言は人間性。「人間性尊重」と「生きがい」を結びつけて覚える。","src":"解説書 p.262","conflict":""},{"id":"r36q15n102","round":36,"q":15,"no":102,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークル活動の導入期の推進では、トップが導入宣言をして目的を周知し、推進の組織体制を整える。この時期に大きく影響するものはどれか。","options":["組織トップのリーダーシップ","組織トップの強制力","管理者による統制力","従業員の柔軟性"],"answer":0,"explanation":"導入期は、経営者のQCサークルへの強い関心と支援が不可欠で、会社方針の明確化、推進組織の設置、経営トップ自らによる基本的な考え方の教育などを通じて、組織トップのリーダーシップが大きく影響する。QCサークルは自主性が本質なので、導入教育でも強制しないように配慮する。よって強制力や統制力で進めるのは不適切。導入期はトップのリーダーシップ、と覚える。","src":"解説書 p.262","conflict":""},{"id":"r36q15n103","round":36,"q":15,"no":103,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークル活動の展開期に、より難しい問題や課題へ挑戦してレベルアップを図るために、教育・研修の充実や成果の経営指標への貢献度の把握とあわせて向上させることが大切な能力はどれか。","options":["問題発見能力","現場力","問題解決能力","協調性"],"answer":0,"explanation":"展開期は、活動がマンネリ化しないよう常に問題意識をもち、やさしいテーマでは得られない達成感を求めて、より困難な問題に挑戦する時期。そのためには、問題を見つける力である問題発見能力の向上が大切で、企業の業績に貢献できる課題をテーマにすれば、達成感と成長も得られる。現場力の向上や問題解決能力・協調性の高まりは、活動を続けた結果として現れる無形効果であり、展開期に重点的に向上させる能力そのものとは区別する。展開期は問題発見能力、と覚える。","src":"解説書 p.262","conflict":""},{"id":"r36q15n104","round":36,"q":15,"no":104,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークル活動の定着期には、部門を超えた横断的な問題・課題にも取り組む。その手段のひとつとして、方針の達成や成果を出すことがすべてに優先される、部門を横断して編成された組織と、問題・課題を共有して連携する活動がある。この組織はどれか。","options":["プロジェクトチーム","恒常的な推進事務局","品質保証部門","改善提案委員会"],"answer":0,"explanation":"定着期には、自職場の問題から一歩踏み込んで、慢性的な問題や専門的な知識を要する問題にも取り組む。そのために、専門知識をもつ他部門から人が集まり、集中して課題を解決するプロジェクトチームと情報を共有して連携すると効率がよい。恒常的な推進事務局は、QCサークル活動を支える常設の組織で、方針の達成や成果を最優先に編成される組織ではない。品質保証部門は特定の機能を担う一部門であり、部門を横断して編成された組織ではない。改善提案委員会は個人の改善提案を審査する仕組みで、専門知識を集めて課題解決にあたる組織とは性格が違う。定着期は「部門を超えて」なら、プロジェクトチームと連携、と覚える。","src":"解説書 p.262","conflict":""},{"id":"r37q7n38","round":37,"q":7,"no":38,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"親和図法で、「部門の重要な業務を任せてもらえる」「ワンランク上の仕事が与えられる」「重要なプロジェクトのメンバーの一人に選ばれる」という3枚のカードをまとめることにした。3枚に共通するのは仕事の重要性である。これらの上位カードの見出しとして最も適切なものはどれか。","options":["責任のある仕事を任せてもらえる","仕事に必要な情報がすぐに得られる","不条理な仕事をしなくてもよい","会社のブランドイメージがよい"],"answer":0,"explanation":"3枚のカードは、どれも「重要な役割や仕事を任される」という共通点でまとまり、それを一段抽象化した見出しが「責任のある仕事を任せてもらえる」になる。情報の得やすさや仕事の効率、会社の評判はカードの中身に出てこない観点なので合わない。親和図法では、カードを並べたうえで共通点(キーワード)を見つけ、その共通点を言葉にして上位カードを作る。決め手は、カード群の共通のキーワードに合っているかどうか。","src":"解説書 p.281","conflict":""},{"id":"r37q7n39","round":37,"q":7,"no":39,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"親和図法で、「関連部門との仕事の連携がとりやすい」「仕事に必要な情報のデータベースができている」「上司から必要な情報がすぐに得られる」という3枚のカードをまとめることにした。3枚に共通するのは仕事の情報である。これらの上位カードの見出しとして最も適切なものはどれか。","options":["仕事に必要な情報がすぐに得られる","責任のある仕事を任せてもらえる","不条理な仕事をしなくてもよい","市場における自社製品の評判がよい"],"answer":0,"explanation":"連携がとりやすい、データベースがある、上司から情報が得られる、という3枚は、いずれも必要な情報が手に入りやすい状態を表しているので、共通点を言葉にした「仕事に必要な情報がすぐに得られる」が上位カードになる。責任の重さや無駄な仕事の有無、市場での評判は3枚のどれとも結びつかない。カードをまとめるときは、個々の表現ではなく「何についての話か」を共通のキーワードでとらえる。","src":"解説書 p.281","conflict":""},{"id":"r37q7n40","round":37,"q":7,"no":40,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"親和図法で、「能力の向上につながる仕事ができる」「新しい仕事にチャレンジできる」「自分の持っている能力をフルに発揮して仕事ができる」「仕事の成果を正しく評価してくれる」という4枚のカードをまとめることにした。4枚に共通するのは仕事の能力に関することである。これらの上位カードの見出しとして最も適切なものはどれか。","options":["成長していることが実感できる","会社の経営方針の一部を担っていることが自覚できる","社会に対して責任を持ち貢献している","国際競争力が強い製品を作っている"],"answer":0,"explanation":"能力を伸ばす、挑戦する、能力を発揮する、成果を評価される、という4枚はどれも自分の成長を実感できる場面なので、「成長していることが実感できる」が上位カードになる。経営方針や社会貢献、製品の競争力は、会社や社会の側の話であり、社員が仕事の中で感じる能力の観点とは焦点が違う。カードを束ねるときは、共通のキーワードが「能力」なのか「情報」なのか「効率」なのかを見極める。","src":"解説書 p.281","conflict":""},{"id":"r37q7n41","round":37,"q":7,"no":41,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"親和図法で、「雑用が少ない」「成果に直結する仕事ができる」「自分の主張や意見が遠慮なく言える」「無意味な仕事をしなくてもよい」という4枚のカードをまとめることにした。4枚に共通するのは仕事の効率に関することである。これらの上位カードの見出しとして最も適切なものはどれか。","options":["不条理な仕事をしなくてもよい","仕事に必要な情報がすぐに得られる","市場における自社製品の評判がよい","地域や環境に対して配慮している"],"answer":0,"explanation":"雑用が少ない、無意味な仕事をしなくてよい、成果に直結する仕事ができる、という4枚のうち3枚は、無駄な仕事から解放されているという点で共通する。残りの1枚「自分の主張や意見が遠慮なく言える」も、言いたいことを我慢せずに仕事を進められるという意味で、同じ仕事の進めやすさのグループに入る。共通点を言葉にすると「不条理な仕事をしなくてもよい」になる。情報の得やすさや自社製品の評判、環境への配慮は、これらのカードとは別の観点。","src":"解説書 p.281","conflict":""},{"id":"r37q7n42","round":37,"q":7,"no":42,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"親和図法で、「職場に活気がある」「責任のある仕事を任せてもらえる」「成長していることが実感できる」の3枚のカードをさらに上位のカードにまとめることにした。3枚に共通するのは仕事に対する積極性である。上位カードの見出しとして最も適切なものはどれか。","options":["働きがいが感じられる","社員に対する処遇がよい","社会や地域から高い評価を得ている","ムダ・ムリなく仕事ができる"],"answer":0,"explanation":"活気、任される責任、成長の実感は、いずれも仕事に前向きに取り組めることを示しているので、まとめると「働きがいが感じられる」になる。処遇や社会的評価は、この3枚が語っていない内容。「ムダ・ムリなく仕事ができる」は、仕事の進め方が効率的かどうかを表す言葉で、仕事にやりがいを感じるかどうかとは焦点が違うので選ばない。積極性・やりがいの話は働きがい、仕事の進め方の効率の話はムダ・ムリなし、と使い分ける。","src":"補筆","conflict":""},{"id":"r37q7n43","round":37,"q":7,"no":43,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"親和図法で、「仕事に必要な情報がすぐに得られる」「不条理な仕事をしなくてもよい」の2枚のカードは、どちらも効率的に仕事を進めることに関係している。この2枚をさらに上位のカードにまとめるとき、見出しとして最も適切なものはどれか。","options":["ムダ・ムリなく仕事ができる","働きがいが感じられる","社員に対する処遇がよい","単なる歯車でなく経営の一端を担っていることが感じられる"],"answer":0,"explanation":"必要な情報がすぐ手に入ることも、不条理な仕事をしなくてよいことも、仕事の進め方が効率的であることを表すので、上位は「ムダ・ムリなく仕事ができる」になる。「働きがいが感じられる」は仕事にやりがいを感じる状態を表す言葉で、仕事の進め方の効率とは意味が違うので選ばない。経営の一端を担う感覚や処遇の話も、この2枚には出てこない内容。上位カードは、下位カードの共通点をそのまま一段上の言葉にしたものを選ぶ。","src":"補筆","conflict":""},{"id":"r37q8n44","round":37,"q":8,"no":44,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"同じ製品3個について寿命試験を行い、新品の状態から使い始めて、それぞれ6000時間、15000時間、21000時間で故障した。信頼度を「ある時点まで故障せずに機能を果たしている割合」として評価するとき、使い始めから5000時間の時点での信頼度は何%か。","options":["100","66.7","33.3","0"],"answer":0,"explanation":"5000時間の時点で故障していた個体は1個もなく、3個とも機能を果たしている。したがって信頼度は3個中3個で100%になる。66.7%や33.3%は、すでに1個または2個が故障した後の値で、この時点にはあてはまらない。信頼度は「その時点で生き残っている割合」と覚える。","src":"補筆","conflict":""},{"id":"r37q8n45","round":37,"q":8,"no":45,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"同じ3個の製品(故障時間はそれぞれ6000時間、15000時間、21000時間)について、使い始めから24000時間の時点での信頼度は33.3%である。","ok":false,"explanation":"誤り。24000時間までに、3個とも故障している(最後の1個が21000時間で故障)ので、生き残っている個体は0個で信頼度は0%になる。33.3%は、3個中1個だけが生き残っている状態(15000時間を過ぎ21000時間までの間)の値。信頼度は時間とともに下がる一方なので、全数が故障した時点以降は0%になる。","src":"補筆","conflict":"","alt":{"stem":"同じ3個の製品(故障時間はそれぞれ6000時間、15000時間、21000時間)について、使い始めから24000時間の時点での信頼度は0%である。","explanation":"正しい。24000時間までに3個とも故障しており、生き残っている個体は0個なので信頼度は0%になる。33.3%は3個中1個だけが生き残っている状態の値である。信頼度は時間とともに下がる一方で、全数が故障した時点以降は0%になる。"}},{"id":"r37q8n46","round":37,"q":8,"no":46,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"故障した製品12個を修理して、それぞれの修復に要した時間(分)を測ったところ、15、18、21、22、23、23、25、26、28、29、30、31分だった。保全度を「規定の時間内に保全作業が終了する割合」として評価するとき、24分における保全度は何%か。","options":["25.0","50.0","58.3","75.0"],"answer":1,"explanation":"24分以内に修復が終わったのは、15、18、21、22、23、23分の6個。12個中6個なので保全度は50.0%。58.3%は、25分の1個を加えて7個で数えた値で、24分を超えるものを含めているため誤り。保全度は「決められた時間内に修理が終わる確率」で、修復に時間がかかるほど低くなる。","src":"補筆","conflict":""},{"id":"r37q8n47","round":37,"q":8,"no":47,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"あるアイテムの運用と保全の実績から、1日あたりの平均運用時間(アップ時間)が18時間、平均保全時間(ダウン時間)が6時間だった。運用アベイラビリティは何%か。","options":["75.0","25.0","33.3","66.7"],"answer":0,"explanation":"運用アベイラビリティは、アップ時間を、アップ時間とダウン時間の合計で割った値。18を18+6=24で割ると0.75で75.0%になる。25.0%は、ダウン時間を合計で割った値(使えない時間の割合)。33.3%は、ダウン時間をアップ時間で割った値で、割る数が違う。「使える時間の全体に占める割合」と覚える。","src":"補筆","conflict":""},{"id":"r37q8n48","round":37,"q":8,"no":48,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"修理をせずに使い捨てるアイテムについて、故障するまでの動作時間の平均値を表す略号はどれか。","options":["MTTF","MTBF","MTTR","β10ライフ"],"answer":0,"explanation":"修理しないアイテムが使い始めから故障するまでの平均時間を、平均故障寿命といい、MTTFと表す。MTBFは、修理して使い続けるアイテムの故障から次の故障までの平均(平均故障間隔)。MTTRは修復にかかる平均時間で、故障までの話ではない。β10ライフは、全体の10%が故障するまでの時間を示す指標で、平均値ではない。修理しない=MTTF、修理する=MTBFと対にして覚える。","src":"補筆","conflict":""},{"id":"r37q8n49","round":37,"q":8,"no":49,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"MTBFは、修理をせずに使い捨てるアイテムが、使い始めから故障するまでの動作時間の平均値である。","ok":false,"explanation":"誤り。この説明はMTTF(平均故障寿命)のもの。MTBF(平均故障間隔)は、修理しながら使い続けるアイテムについて、故障から次の故障までの間隔の平均を表す。MTBFはBetween(間)の頭文字、MTTFはTo(まで)の頭文字と押さえると、使い方の違いがわかる。","src":"補筆","conflict":"","alt":{"stem":"MTTFは、修理をせずに使い捨てるアイテムが、使い始めから故障するまでの動作時間の平均値である。","explanation":"正しい。この説明はMTTF(平均故障寿命)のものである。MTBF(平均故障間隔)は、修理しながら使い続けるアイテムについて、故障から次の故障までの間隔の平均を表す。決め手は、修理しない使い捨てのアイテムの寿命を表すか、修理して使い続けるアイテムの故障間隔を表すかという対象の違いである。"}},{"id":"r37q8n50","round":37,"q":8,"no":50,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"故障したアイテムを修復するのに要する時間の平均を表す略号で、保全性の特性値として使われるものはどれか。","options":["MTTR","MTBF","MTTF","MTBR"],"answer":0,"explanation":"MTTRは平均修復時間(修理にかかる時間の平均)で、Rは修復(Repair/Restoration)を表す。保全性の特性値で、値が小さいほど早く直る。MTBFは故障から次の故障までの間隔の平均、MTTFは動作を始めてから故障するまでの時間の平均で、どちらも信頼性の特性値であり、修復にかかる時間ではない。MTBRは保全性の特性値としてJISが定める語ではない。決め手は、修復にかかる時間の平均か、故障までや故障間の時間かという違い。","src":"補筆","conflict":""},{"id":"r37q9n51","round":37,"q":9,"no":51,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"検査とは、製品の何に対して測定・試験・ゲージ合わせなどを行い、規定の要求事項を満たしているかを判断することか。","options":["特性値","基準","作業者","後工程"],"answer":0,"explanation":"検査は、製品の品質特性の値(特性値)を測定・試験し、要求事項を満たすかどうかを判断する。基準は、判断に用いるものさしであって、測定の対象ではない。作業者は検査を行う人であり、測定・試験の対象そのものではない。後工程は検査の結果の受け手であり、測る対象ではない。測る対象は特性値、比べる相手は基準、と分けて覚える。","src":"補筆","conflict":""},{"id":"r37q9n52","round":37,"q":9,"no":52,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"検査の役割のひとつとして、不適合品が後工程や顧客に渡らないよう品質を保証することのほかに、検査で得られたある情報を速やかに製造部門へ戻すことがある。この情報として最も適切なものはどれか。","options":["品質情報","生産計画","在庫情報","原価情報"],"answer":0,"explanation":"検査の結果からわかった不適合の傾向などの品質情報を製造部門へ速やかにフィードバックすると、製造側が原因を突き止めて再発を防げる。生産計画・在庫情報・原価情報は、検査そのものから得られる情報ではなく、生産管理や経理など別の業務から生まれる情報。検査は選別するだけでなく、品質に関する情報を製造に返すことまでが役割と覚える。","src":"補筆","conflict":""},{"id":"r37q9n53","round":37,"q":9,"no":53,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"計測検査では、製品の特性値を、あらかじめ決められた何と比較して、数値や記号などで表すか。","options":["基準","品質情報","標準化","生産準備"],"answer":0,"explanation":"計測検査は、測定した特性値を、決められた基準と比較して、合格か不合格かを判断する。品質情報は検査の結果として得られるもので、比べる相手ではない。標準化や生産準備は、検査の判断に使うものさしを指す語ではない。抜取検査の合否判定でも、結果を合否判定の基準と比べる。測るものは特性値、比べるものは基準。","src":"補筆","conflict":""},{"id":"r37q9n54","round":37,"q":9,"no":54,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"人間の視覚・聴覚・味覚・嗅覚などの感覚を、測定器のセンサーの代わりに用いて、製品の品質を判定する検査はどれか。","options":["官能検査","計測検査","全数検査","間接検査"],"answer":0,"explanation":"人間の感覚をセンサーとして使い、品質を判定する検査を官能検査という。計測検査は、測定器を用いて特性値を数値などで表し、基準と比べる検査。全数検査は検査の対象の範囲(全部を検査する)、間接検査は供給者の検査結果を利用する方法で、判定の手段を表すものではない。「官能=感覚(五感)」と覚える。","src":"補筆","conflict":""},{"id":"r37q9n55","round":37,"q":9,"no":55,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"全数検査を行うのが適切なのは、不適合品率が要求される品質水準より大きく、少数の不適合品でも見逃すと重大な結果を招くおそれがある場合などである。この前提となる、不十分な状態にあるものはどれか。","options":["工程能力","標準化","生産準備","時間的余裕"],"answer":0,"explanation":"工程が要求どおりの品質を作れていない(工程能力が不十分)ので、不適合品率が高くなり、全数検査で不適合品を取り除く必要が出てくる。標準化や生産準備、時間的余裕は、検査の方法を選ぶ判断の軸ではない。検査の方法は、前工程の品質を確保する能力(工程能力)に応じて選ぶ、と覚える。","src":"補筆","conflict":""},{"id":"r37q9n56","round":37,"q":9,"no":56,"part":"実践","field":"品質保証:プロセス保証","fmt":"tf","stem":"抜取検査は、たとえ1個でも不適合品が混ざると重大な結果を招くような場合に適した検査方法である。","ok":false,"explanation":"誤り。抜取検査は、一部のサンプルから判定するので、同じ品質水準のロットでも合格・不合格が変わる不確実性がある。このため、ある程度の不適合品の混入を許容できる場合に使う。1個でも見逃せない場合は全数検査を選ぶ。抜取検査=不適合品混入の許容が前提、と覚える。","src":"補筆","conflict":"","alt":{"stem":"抜取検査は、ある程度の不適合品が混ざっても許容できるような場合に適した検査方法である。","explanation":"正しい。抜取検査は、一部のサンプルから判定するので、同じ品質水準のロットでも合格・不合格が変わる不確実性がある。このため、ある程度の不適合品の混入を許容できる場合に使う。1個でも見逃せない場合は全数検査を選ぶ。決め手は、抜取検査は不適合品の混入をある程度許容することが前提という点にある。"}},{"id":"r37q10n57","round":37,"q":10,"no":57,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品の開発で、事前にアンケートで要望を聞いたが、使う場面で必要になる要望は回答に出てこなかった。顧客自身も気づいておらず、アンケートでは表に出てこないこうしたニーズを何というか。","options":["潜在ニーズ","顕在ニーズ","品質特性","設計品質"],"answer":0,"explanation":"顧客自身が意識していない、または言葉にできないニーズが潜在ニーズ。使う場面を観察するなどして掘り起こす。顕在ニーズは、顧客が自覚していて、アンケートなどで表に出てくるニーズで、その反対。品質特性や設計品質は、ニーズを製品に置き換えたあとの話。アンケートに出る=顕在、出ない=潜在。","src":"補筆","conflict":""},{"id":"r37q10n58","round":37,"q":10,"no":58,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品開発の設計審査に、市場のニーズを肌で感じ、最もよく知っている者が参画して、開発の最初か早い段階でニーズを関係者に伝えることが大切である。この役割を担う部門はどれか。","options":["営業","検査","購買","経理"],"answer":0,"explanation":"市場や顧客と直接接する営業は、新製品開発の入口として、ニーズを関係者に伝える役割を持つ。検査、購買、経理は、市場のニーズを肌で感じる立場ではない。設計審査には、多くの部門から関係者が参加するのがよく、営業の参画も欠かせない。市場の声の窓口は営業と覚える。","src":"補筆","conflict":""},{"id":"r37q10n59","round":37,"q":10,"no":59,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品開発で、関係する部署が直列に順番に進めるのではなく、同時並行で参画して開発を進めることで、情報の共有や開発期間の短縮を図る進め方はどれか。","options":["コンカレントエンジニアリング","フロントローディング","リバースエンジニアリング","デザインレビュー"],"answer":0,"explanation":"同時並行で進める開発の進め方がコンカレントエンジニアリング。前後の工程を重ねて進めるため、情報が共有され、開発期間も短くなる。フロントローディングは、後工程で出る問題を前倒しで上流の段階で解決するという考え方で、同時並行の進め方そのものを指す名前ではない。リバースエンジニアリングは完成品を分解して仕組みを調べること、デザインレビューは設計審査で、進め方の名前ではない。同時=コンカレントと覚える。","src":"補筆","conflict":""},{"id":"r37q10n60","round":37,"q":10,"no":60,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製造物責任(PL)は、製品の何が原因で人的・物的な損害が生じたときに、製造業者等が負う責任か。","options":["欠陥","不良","不適合","故障"],"answer":0,"explanation":"製造物責任は、製品の欠陥が原因で生じた損害について、製造業者等が負う責任。欠陥は、通常備えているべき安全性を欠くことで、製品の安全性が問題になる。不良は日常的な言い方で、規格や要求を満たしていないことを広く指す言葉であり、製造物責任で問われるのは、そのうち通常備えるべき安全性を欠く欠陥にあたる場合。不適合は、要求事項を満たしていないことで、安全性とは必ずしも結びつかない。故障は、機能を失うことで、原因となる性質とは違う。PLでは欠陥が判断の軸と覚える。","src":"補筆","conflict":""},{"id":"r37q10n61","round":37,"q":10,"no":61,"part":"実践","field":"品質保証:新製品開発","fmt":"tf","stem":"製造物責任とは、製品の欠陥が原因で生じた人的・物的損害に対して、製造業者等が負う刑事責任のことである。","ok":false,"explanation":"誤り。製造物責任は、被害者に対する損害賠償責任。刑罰を科す責任ではなく、損害を補償する責任である。製造物責任=損害賠償責任と覚える。","src":"補筆","conflict":"","alt":{"stem":"製造物責任とは、製品の欠陥が原因で生じた人的・物的損害に対して、製造業者等が負う損害賠償責任のことである。","explanation":"正しい。製造物責任は、製品の欠陥によって生じた損害について被害者に負う損害賠償責任である。刑罰を科す責任ではなく、損害を補償する責任である。決め手は、目的が被害者の損害の補償にあるという点である。"}},{"id":"r37q10n62","round":37,"q":10,"no":62,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"製品の欠陥は、一般に設計上の欠陥、製造上の欠陥と、もうひとつ別の種類に分けて考えられる。そのもうひとつはどれか。","options":["警告表示上の欠陥","梱包上の欠陥","検査上の欠陥","販売上の欠陥"],"answer":0,"explanation":"欠陥は、設計上、製造上、警告表示上の3種類に分けるのが一般的。警告表示上の欠陥は、取扱説明・警告・注意表示が不十分で、危険が使用者に伝わらないことをいう。梱包、検査、販売は一般的な区分に含まれない。設計・製造・警告表示の3つで覚える。","src":"補筆","conflict":""},{"id":"r37q10n63","round":37,"q":10,"no":63,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"FMEAでは、予想される個々の故障や失敗モードについて、影響の重大性、検知の難易度と、もうひとつの観点をもとに製品に及ぼす影響の大きさを評価する。そのもうひとつの観点はどれか。","options":["発生頻度","賠償額","修復の難易度","梱包の状態"],"answer":0,"explanation":"FMEA(故障モード影響解析)では、影響の重大性、発生頻度、検知の難易度の3つを評価する。賠償額、修復の難易度、梱包の状態は、一般的な評価の観点に含まれない。重大性=起きたら困る度合い、発生頻度=起きやすさ、検知=見つけやすさ、と整理する。","src":"補筆","conflict":""},{"id":"r37q10n64","round":37,"q":10,"no":64,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"FMEAで評価される「検知の難易度」は、何の難しさを表すか。","options":["故障が顧客に届く前に発見できるかどうか","修理に要する時間がどれくらい長いか","故障原因の部品がどれくらい高価か","故障がどれくらいの頻度で起きるか"],"answer":0,"explanation":"検知の難易度は、故障や失敗が起きたときに、それを顧客に届く前に見つけにくいかどうかを表す。見つけにくいほど評価点が大きくなる。修理にかかる時間や部品の値段は評価の観点ではなく、起きる回数の多さは発生頻度の話。検知の難易度は「見つけにくさ」であり、見つけにくいほど評点が大きくなる点に注意する。FMEAは故障モード影響解析の略。","src":"補筆","conflict":""},{"id":"r37q11n65","round":37,"q":11,"no":65,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理は、全部門・全階層の参画でベクトルを合わせ、効果的かつ効率的に目標を達成する活動である。この達成のしかたの基本的な考え方はどれか。","options":["重点指向","ボトムアップ","部門最適化","標準化"],"answer":0,"explanation":"限られた資源を、効果の大きい課題に絞って集中する考え方が重点指向で、効果的かつ効率的な達成につながる。ボトムアップは下から上への提案で、方針管理は上からの方針の展開が軸。部門最適化は部門ごとの都合を優先することで、ベクトルを合わせることと矛盾する。決め手は、絞り込んで集中するという目的。","src":"補筆","conflict":""},{"id":"r37q11n66","round":37,"q":11,"no":66,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理では、上位の方針を受けて、各部門別に具体的な実施計画へ落とし込む。この、方針を各階層・各部門の実施レベルまで展開していくことを何というか。","options":["ブレークダウン","ボトムアップ","部門最適化","品質監査"],"answer":0,"explanation":"上位の方針を、各部門の具体的な目標や方策へ順に落とし込むことをブレークダウン(方針展開)という。ボトムアップは下から積み上げる方向で、逆向き。部門最適化は全体より部門の都合を優先することで、方針の展開とは違う。品質監査は、活動の適合性を確かめる仕組み。上から下へ落とすのがブレークダウン。","src":"補筆","conflict":""},{"id":"r37q11n67","round":37,"q":11,"no":67,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理の仕組みの最上段に置かれる、組織の存続意義、事業の根本的な考え方、長期的に実現したい姿などを定めたものはどれか。","options":["使命・理念・ビジョン","組織方針","管理項目","業務分掌"],"answer":0,"explanation":"組織の存続意義や根本的な考え方、長期的に実現したい姿を示すのが、使命・理念・ビジョン。方針管理の出発点になる。組織方針は、それを受けて中長期経営計画を経て決める重点課題・目標・方策。管理項目は実施状況を確認するための指標、業務分掌は各部門の仕事の分担を決めたもの。最上段は使命・理念・ビジョンと覚える。","src":"補筆","conflict":""},{"id":"r37q11n68","r
