ound":37,"q":11,"no":68,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理で、使命・理念・ビジョンと中長期経営計画を受けて、その年度に取り組む重点課題・目標・方策を定めたものはどれか。","options":["組織方針","使命・理念・ビジョン","管理項目","業務機能展開"],"answer":0,"explanation":"重点課題・目標・方策を定めたものが組織方針で、これを各部門へ展開して部門方針を作る。使命・理念・ビジョンは、それより上位で、長期にわたる考え方や姿を示す。管理項目は実施状況を確かめるための指標。業務機能展開は、業務を機能ごとに展開する手法で、方針そのものではない。","src":"補筆","conflict":""},{"id":"r37q11n69","round":37,"q":11,"no":69,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理で、一貫した方針展開を行うために、上下の職位間や関係部門間で、目標や方策を互いに確認して調整する作業を何というか。","options":["すり合わせ","期末のレビュー","トップ診断","標準化"],"answer":0,"explanation":"上位の方針と各部門の計画がずれないよう、上下の職位間と関係部門間で目標・方策を調整するのがすり合わせ。期末のレビューは期の終わりに全体を評価すること、トップ診断は経営トップが行う診断で、いずれも展開時の調整ではない。標準化は、ルールとして定めること。一方通行にせず、上下・横で合わせるのがすり合わせ。","src":"補筆","conflict":""},{"id":"r37q11n70","round":37,"q":11,"no":70,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理で、実施計画を策定するときに、実施状況を確認するために設定し、あとで結果を評価するときにも用いる指標として最も適切なものはどれか。","options":["管理項目","QC工程図","応急処置","標準化"],"answer":0,"explanation":"実施の状況や結果を確認・評価するための指標が管理項目。実施計画の段階で設定しておくことで、あとから評価ができる。QC工程図は工程の管理の方法を示す図表、応急処置は問題が起きたときの一時的な手当て、標準化は決めたことをルールにすること。確認の物差しは管理項目。","src":"補筆","conflict":""},{"id":"r37q11n71","round":37,"q":11,"no":71,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理の状況を総合的に評価し、次期の取組み課題を明確にするために行うものはどれか。","options":["期末のレビュー","トップ診断","すり合わせ","応急処置"],"answer":0,"explanation":"期の終わりに、方針管理全体の状況を総合的に評価し、次期の課題を明らかにするのが期末のレビュー。トップ診断は、経営トップ自らが各部門の状況を把握するために行うもので、総括のレビューとは別。すり合わせは方針を展開するときの調整、応急処置は問題が起きたときの手当て。締めくくり=期末のレビュー。","src":"補筆","conflict":""},{"id":"r37q11n72","round":37,"q":11,"no":72,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理で、各部門の課題・問題、方針達成のためのプロセス、方針の達成状況などを把握するために、経営トップ自らが行うものはどれか。","options":["トップ診断","期末のレビュー","すり合わせ","QC工程図"],"answer":0,"explanation":"経営トップが、各部門の課題やプロセス、達成状況を自分で把握するために行うのがトップ診断。期末のレビューは、総括して次期の課題を明確にするためのもので、トップ自らが現場を診断する目的とは違う。すり合わせは方針展開時の調整、QC工程図は工程の管理を示す図表。トップ自身が診る=トップ診断。","src":"補筆","conflict":""},{"id":"r37q12n73","round":37,"q":12,"no":73,"part":"実践","field":"品質の概念","fmt":"mc","stem":"品質の定義では、顧客や社会が注文書や仕様書などで具体的に言葉にして示しているニーズと、言葉にはされていないが当然期待されているニーズの両方を満たす程度をいう。このうち、言葉にして示されているほうのニーズを何というか。","options":["明示されたニーズ","暗黙のニーズ","公知のニーズ","公開されたニーズ"],"answer":0,"explanation":"品質とは、対象が「明示された」または「暗黙の」ニーズを満たす程度をいう、というのが定義の骨格。契約や仕様として言葉になっているものが明示されたニーズで、逆に、言われなくても当然そうあるべきと期待されるものが暗黙のニーズになる。公知・公開といった語は、この定義には出てこない。決め手は「言葉にされているか」で、されていれば明示、されていなければ暗黙。","src":"補筆","conflict":""},{"id":"r37q12n74","round":37,"q":12,"no":74,"part":"実践","field":"品質の概念","fmt":"mc","stem":"食品なら安全であること、家電なら通常の使い方で壊れないことのように、顧客がわざわざ要求として口にしなくても、当然そうであると期待されているニーズを、品質の定義では何というか。","options":["暗黙のニーズ","明示されたニーズ","基本のニーズ","目標のニーズ"],"answer":0,"explanation":"要求として言葉にされていなくても、その対象の性質から当然期待されるニーズが「暗黙のニーズ」で、品質はこれも含めて満たす程度をいう。契約や仕様に書かれているものは明示されたニーズで、こちらとは区別する。基本や目標という語は、品質の定義の用語ではない。ポイントは、要求書に書かれていなくても品質の判断対象になること。","src":"補筆","conflict":""},{"id":"r37q12n75","round":37,"q":12,"no":75,"part":"実践","field":"品質の概念","fmt":"mc","stem":"顧客や市場のニーズをふまえ、自社の規模や技術力も考えて、設計の段階で「こういう製品・サービスにする」と決めた品質を何というか。","options":["ねらいの品質","できばえの品質","一元的品質","無関心品質"],"answer":0,"explanation":"設計の段階で目標として決める品質が「ねらいの品質」で、設計品質とも呼ばれる。これに対し、実際に生産された製品・サービスの品質が「できばえの品質」で、適合品質とも呼ばれる。一元的品質や無関心品質は狩野モデルの分類で、設計で決める品質かどうかという話とは別の軸。決め手は「決めた目標」か「実際にできた結果」かで、目標がねらい、結果ができばえ。","src":"補筆","conflict":""},{"id":"r37q12n76","round":37,"q":12,"no":76,"part":"実践","field":"品質の概念","fmt":"tf","stem":"ねらいの品質とは、生産された製品やサービスの実際の品質のことで、適合品質とも呼ばれる。","ok":false,"explanation":"誤り。実際に生産された製品・サービスの品質は「できばえの品質」で、適合品質とも呼ばれる。「ねらいの品質」は、設計の段階で決めた目標にあたる品質で、設計品質とも呼ばれる。ねらいと実際のできばえが近いほど、狙いどおりに作れていることになる。目標=ねらい=設計、結果=できばえ=適合、と対にして覚える。","src":"補筆","conflict":"","alt":{"stem":"ねらいの品質とは、設計の段階で決めた目標にあたる品質のことで、設計品質とも呼ばれる。","explanation":"正しい。ねらいの品質は、設計の段階で決めた目標にあたる品質で、設計品質とも呼ばれる。実際に生産された製品・サービスの品質は「できばえの品質」で、適合品質とも呼ばれ、紛らわしいが別の概念である。ねらいと実際のできばえが近いほど、狙いどおりに作れていることになる。決め手は、目標として定めたものがねらい、実際の結果ができばえという点である。"}},{"id":"r37q12n77","round":37,"q":12,"no":77,"part":"実践","field":"品質の概念","fmt":"mc","stem":"自動車のブレーキが正常に効くことは、効いても特にうれしいとは感じられないが、効かなければ強い不満になる。この性質を持つ品質要素は狩野モデルでどれに分類されるか。","options":["当たり前品質","一元的品質","魅力的品質","無関心品質"],"answer":0,"explanation":"充足されても当然として受け止められ、不充足だと不満を引き起こす要素が「当たり前品質」。一元的品質は、充足すれば満足、不充足なら不満というように、充足度と満足度が比例する要素で、充足しても「当然」とは扱われない点が違う。魅力的品質は、なくても仕方ないが、あれば満足を与える要素。無関心品質は、充足されても不充足でも、満足も不満も生じない要素で、不充足のときに不満が生じる当たり前品質とはこの点で区別できる。決め手は、不充足のときに不満が生じるかどうか。","src":"解説書 p.291","conflict":""},{"id":"r37q12n78","round":37,"q":12,"no":78,"part":"実践","field":"品質の概念","fmt":"mc","stem":"自動車の燃費は、良ければ良いほど満足度が高まり、悪ければ悪いほど不満が大きくなる。このように、充足の程度と満足の程度がほぼ比例する品質要素を、狩野モデルで何というか。","options":["一元的品質","当たり前品質","魅力的品質","逆品質"],"answer":0,"explanation":"充足されれば満足、不充足であれば不満をもたらし、充足度と満足度が比例する要素が「一元的品質」。当たり前品質は、充足しても当然と受け取られて満足にはつながらず、不充足のときだけ不満が出る。魅力的品質は、なくても不満にはならないが、あれば満足を与える。逆品質は、充足されているのに不満になる、あるいは不充足なのに満足になるという反転した関係の要素。比例する関係なら一元的品質、と覚える。","src":"解説書 p.291","conflict":""},{"id":"r37q12n79","round":37,"q":12,"no":79,"part":"実践","field":"品質の概念","fmt":"tf","stem":"物理的に充足されているのに不満を引き起こしたり、不充足であるのに満足を与えたりする品質要素を、無関心品質という。","ok":false,"explanation":"誤り。充足されているのに不満を引き起こしたり、不充足なのに満足を与えたりするのは「逆品質」。「無関心品質」は、充足されていても不充足でも、満足も不満も引き起こさない要素のこと。無関心=どちらでも反応なし、逆=期待と反対の反応が出る、と区別する。","src":"解説書 p.291","conflict":"","alt":{"stem":"物理的に充足されているのに不満を引き起こしたり、不充足であるのに満足を与えたりする品質要素を、逆品質という。","explanation":"正しい。充足されているのに不満を引き起こしたり、不充足なのに満足を与えたりするのは逆品質である。無関心品質は、充足されていても不充足でも、満足も不満も引き起こさない要素のことで、これとは区別する。決め手は、逆品質は期待と反対の反応が出る点にある。"}},{"id":"r37q13n80","round":37,"q":13,"no":80,"part":"実践","field":"日常管理","fmt":"mc","stem":"日常管理を始めるにあたり、まず各職場が実施すべき業務を明らかにしたい。どの職場がどの業務を担当するのかを取り決めたものはどれか。","options":["業務分掌","管理項目","標準作業","処理作業"],"answer":0,"explanation":"各職場の役割と担当する業務の範囲を決めているものが「業務分掌」で、日常管理はこれを確認して業務内容を整理するところから始まる。管理項目は、業務の達成度を確認するために注意を向けるポイントのことで、担当の割り振りとは別。標準作業は、実際に行う作業(処理作業)のやり方をあらかじめ決めたもので、処理作業はその実際に行う作業そのものを指す。どちらも、誰がどの業務を担うかという話とは違う。決め手は「どの職場が担当か」で、職場と業務の対応を決めるものが業務分掌。","src":"解説書 p.292","conflict":""},{"id":"r37q13n81","round":37,"q":13,"no":81,"part":"実践","field":"日常管理","fmt":"mc","stem":"業務の目的が達成されているかを確認するための物差しにあたり、維持したい水準とあわせて明らかにしておく、注意を向けるべき対象を何というか。","options":["管理項目","管理グラフ","業務分掌","特性要因図"],"answer":0,"explanation":"水準を満たしているかを確認する対象、つまり業務を進めるうえで注意を向けるポイントが「管理項目」。管理グラフは、管理項目の推移などを目で見てわかるように記録する用紙のことで、物差しそのものではなく、それを可視化する手段にあたる。特性要因図は原因を整理する図で、達成度を測る対象ではない。管理項目=測る対象、管理グラフ=その記録の見せ方、と分けて覚える。","src":"解説書 p.292","conflict":""},{"id":"r37q13n82","round":37,"q":13,"no":82,"part":"実践","field":"日常管理","fmt":"mc","stem":"業務の進め方に不備が見つかったため、進め方を見直した。見直した結果を、誰が行っても同じようにできるように決め、教育・訓練を通じて職場に浸透させていく活動を何というか。","options":["標準化","層別","評価","管理グラフの作成"],"answer":0,"explanation":"見直した進め方を決まりとして定め、教育訓練で浸透させていくのが「標準化」。完璧な進め方はありえず問題や課題は必ず出るので、見直した結果は標準に反映して定着させる。層別はデータを特徴ごとにグループ分けすることで、進め方を決める活動とは別。評価は結果の良し悪しを判断することで、定着させる活動ではない。標準化は、見直した結果を全員が同じ形で実行できる状態にすることが決め手。","src":"解説書 p.292","conflict":""},{"id":"r37q13n83","round":37,"q":13,"no":83,"part":"実践","field":"日常管理","fmt":"tf","stem":"日常管理で、業務の達成レベルを目で見てわかるようにするには、記録用紙として特性要因図を用意するのが有効である。","ok":false,"explanation":"誤り。達成レベルを目で見て理解しやすくするために用いるのは「管理グラフ」。特性要因図は、特性に影響する原因を洗い出して整理する図で、業務の達成度を時間の流れで記録していく目的のものではない。管理グラフのように日々の結果を書き込んで推移が見えるものが、日常管理の記録用紙に向く。判断の決め手は、その図が何をするためのものかという目的で、達成度の見える化なら管理グラフ、原因の整理なら特性要因図。","src":"解説書 p.292","conflict":"","alt":{"stem":"日常管理で、業務の達成レベルを目で見てわかるようにするには、記録用紙として管理グラフを用意するのが有効である。","explanation":"正しい。管理グラフは日々の結果を書き込んで推移が見えるので、達成レベルの見える化に向く。特性要因図は特性に影響する原因を洗い出して整理する図で、達成度を記録する目的のものではない。決め手は、その図が達成度の見える化のためか原因の整理のためかという目的である。"}},{"id":"r37q13n84","round":37,"q":13,"no":84,"part":"実践","field":"日常管理","fmt":"mc","stem":"日常管理で、業務の結果を記録用紙に記入していくことで把握できるものはどれか。","options":["管理状況","改善計画","応急処置","試験方法"],"answer":0,"explanation":"業務の結果を記録用紙に記入すれば、目標や水準に対して業務がどうなっているかという「管理状況」がわかる。改善計画は、把握した状況を検討したうえで必要に応じて立てるもので、記入して直接把握できるものではない。応急処置は異常と判断したあとにとる措置で、把握の対象ではない。記録して把握するのは状況、そこから先に計画や処置が続く、という順序で覚える。","src":"解説書 p.292","conflict":""},{"id":"r37q13n85","round":37,"q":13,"no":85,"part":"実践","field":"日常管理","fmt":"mc","stem":"日常管理で、業務の結果が目標から外れて異常と判断された。原因を追究するより前に、速やかにとるべき措置はどれか。","options":["応急処置","再発防止","標準化","改善計画"],"answer":0,"explanation":"異常が出たら、まず異常を受け入れられる状態まで戻すために、速やかに「応急処置」をとる。原因を追究して同じ異常を起こさないようにする再発防止は、その後に行う処置。標準化や改善計画は、原因を取り除いたあとの仕組みづくりにあたり、いま起きている異常を止める措置ではない。順序は、まず応急、そのあと原因を追究して再発防止。","src":"解説書 p.292(続きは次ページ。補筆を含む)","conflict":""},{"id":"r37q13n86","round":37,"q":13,"no":86,"part":"実践","field":"日常管理","fmt":"tf","stem":"日常管理で異常が発生したとき、正常な状態に戻したうえで原因を追究し、その結果としてとる処置は、応急処置である。","ok":false,"explanation":"誤り。原因を追究したうえでとる処置は「再発防止」の処置。応急処置は、原因の追究より前に異常を受け入れられる状態に戻す、その場しのぎの措置にあたる。応急処置だけでは原因が残るので同じ異常がまた起きる。応急は今の異常を止める、再発防止は原因を取り除く、と区別する。","src":"補筆","conflict":"","alt":{"stem":"日常管理で異常が発生したとき、正常な状態に戻したうえで原因を追究し、その結果としてとる処置は、再発防止である。","explanation":"正しい。原因を追究したうえでとる処置は再発防止の処置である。応急処置は、原因の追究より前に異常を受け入れられる状態に戻す、その場しのぎの措置で別のものである。応急処置だけでは原因が残るので同じ異常がまた起きる。決め手は、今の異常を止めるのが応急処置、原因を取り除いて繰り返さないのが再発防止という目的の違いである。"}},{"id":"r37q13n87","round":37,"q":13,"no":87,"part":"実践","field":"日常管理","fmt":"mc","stem":"日常管理で、重要な管理項目についてはあらかじめ決めた頻度で報告書を整理して検討する。その結果、必要になれば立案して実施するものはどれか。","options":["改善計画","応急処置","業務分掌","試験方法"],"answer":0,"explanation":"定期的に管理項目の結果を検討し、水準が不足している、もっと良くできるといった課題が見つかれば「改善計画」を立てて実施する。応急処置は異常が起きた時点で速やかにとる措置で、定期検討から立案するものではない。業務分掌は職場の役割分担の取り決めで、業務結果の検討から生まれるものではない。日々の運用は維持、定期的な検討から改善へつなぐ、という流れで覚える。","src":"補筆","conflict":""},{"id":"r37q14n88","round":37,"q":14,"no":88,"part":"実践","field":"人材育成","fmt":"mc","stem":"品質管理は経営の手段であり、その基礎になるのは組織づくりと人づくりである。このうち、仕事に必要な教育・訓練を行って人を育てる取組みで、品質管理の中でもとくに重要とされるものはどれか。","options":["人材育成","内部監査","トップ診断","品質保証体系図"],"answer":0,"explanation":"人づくりの中心となるのが「人材育成」で、品質管理は教育に始まり教育に終わるとまで言われる。内部監査やトップ診断は、活動の適合性や有効性を確認する仕組みで、人を育てること自体が目的ではない。品質保証体系図は、業務の流れと各部門の責任を示す図で、これも人づくりの取組みではない。決め手は、目的が人の能力を高めることかどうか。","src":"補筆","conflict":""},{"id":"r37q14n89","round":37,"q":14,"no":89,"part":"実践","field":"人材育成","fmt":"mc","stem":"職場のリーダーがOJTで作業者を指導するとき、個々の作業の手順と急所を具体的に示し、それに従わせる文書はどれか。","options":["作業手順書","QC工程図","品質保証体系図","活動計画書"],"answer":0,"explanation":"個々の作業をどの順序でどう行うか、急所は何かを具体的に記したものが「作業手順書」で、OJT(職場内訓練)の教材として現場で使う。QC工程図は、原材料から製品になるまでの工程の流れに沿って、管理項目や管理方法を整理した表で、作業者一人ひとりの動作を教えるものではない。品質保証体系図は、業務の流れと各部門の責任を示すもの。作業の一つ一つのやり方なら作業手順書、工程全体の管理の仕組みならQC工程図、と使い分ける。","src":"補筆","conflict":""},{"id":"r37q14n90","round":37,"q":14,"no":90,"part":"実践","field":"日常管理","fmt":"tf","stem":"職場のリーダーが朝・夕に実施し、始業点検の結果や生産の進捗などを確認して共有する場は、内部監査である。","ok":false,"explanation":"誤り。職場で朝・夕に品質、安全、生産の進捗を確認して共有する場は「ミーティング」。内部監査は、品質マネジメントシステムが規格などの要求事項や自社の決めたことに従って運用されているかを、監査員が体系的に確認する活動で、職場の日々の進捗共有とは別物。共有と確認の場ならミーティング、要求事項への適合を確認する活動なら監査、と分ける。","src":"補筆","conflict":"","alt":{"stem":"職場のリーダーが朝・夕に実施し、始業点検の結果や生産の進捗などを確認して共有する場は、ミーティングである。","explanation":"正しい。職場で朝・夕に品質、安全、生産の進捗を確認して共有する場はミーティングである。内部監査は、品質マネジメントシステムが規格などの要求事項や自社の決めたことに従って運用されているかを、監査員が体系的に確認する活動で、職場の日々の進捗共有とは別物である。決め手は、目的が日々の共有と確認か、要求事項への適合の確認かという点にある。"}},{"id":"r37q14n91","round":37,"q":14,"no":91,"part":"実践","field":"人材育成","fmt":"mc","stem":"現場で仕事をしながら教えるOJTを補うため、職場を離れて品質管理の専門知識や製品知識を学べるよう、社内で教育計画を立ててセミナーや講習会を開いている。この教育の形態を何というか。","options":["OFF-JT","自己啓発","トップ診断","コンサルタント"],"answer":0,"explanation":"仕事を離れて、セミナーや講習会などで専門的な知識を学ぶ教育が「OFF-JT(職場外訓練)」。OJT(職場内訓練)が現場で仕事をしながら教わる形であるのに対し、こちらは集合教育などで体系的に学ぶのでOJTを補える。自己啓発は、個人が自主的に学ぶもので、会社が教育計画を立てて実施するものではない。トップ診断やコンサルタントは、教育の形態ではない。仕事の中で学ぶならOJT、職場を離れて学ぶならOFF-JT。","src":"補筆","conflict":""},{"id":"r37q14n92","round":37,"q":14,"no":92,"part":"実践","field":"人材育成","fmt":"mc","stem":"5S活動の推進のため、全部門から選ばれたリーダーが考え方や進め方を教わった。そのうえで、各職場が自分たちで作成して実践し、職場環境の向上につなげるものはどれか。","options":["活動計画書","品質保証体系図","QC工程図","内部監査"],"answer":0,"explanation":"何をいつまでにどう実施するかを職場ごとに定めた「活動計画書」を作り、それに沿って実践する。品質保証体系図やQC工程図は、製品の品質を保証する仕組みや工程管理を示すもので、5S活動の実践を進める職場の計画とは違う。内部監査は活動を確認する仕組みで、職場が自ら作って実践するものではない。5Sは全員が実践する活動なので、各職場が自分たちの計画を持つことが要になる。","src":"補筆","conflict":""},{"id":"r37q14n93","round":37,"q":14,"no":93,"part":"実践","field":"小集団活動","fmt":"mc","stem":"QCサークル活動を全員参加で進めるため、メンバーがQC手法を身につけ、自主性を育てることを目的に、毎月職場内で行う取組みはどれか。","options":["勉強会","内部監査","トップ診断","活動計画書"],"answer":0,"explanation":"メンバーがQC手法を学び合いながら自主性を育てる場は「勉強会」。内部監査は監査員が要求事項への適合を確認する仕組み、トップ診断は経営トップ自らが活動の状況を把握する仕組みで、どちらもメンバーがQC手法を学び合う場ではない。活動計画書は、活動の予定を文書にしたもの。職場内で全員が学ぶ小集団の取組みだから勉強会になる。","src":"補筆","conflict":""},{"id":"r37q14n94","round":37,"q":14,"no":94,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"品質マネジメントシステムに影響を与える業務を行う人について、組織は、適切な教育や訓練を受けさせ、その評価結果を記録として管理し、備えていることを確実にしなければならない。この、知識や技能を適用して意図した結果を出す能力を何というか。","options":["力量","活動計画書","作業手順書","内部監査"],"answer":0,"explanation":"知識や技能を適用して意図した結果を達成する能力が「力量」。ISO 9001では、業務を行う人が必要な力量を備えていることを確実にし、その証拠として文書化した情報を保持することが求められる。活動計画書や作業手順書は文書の種類で、人が備える能力のことではない。内部監査は、システムが要求事項に適合しているかを確認する活動。決め手は、人が備えているものを指しているかどうか。","src":"解説書 p.295","conflict":""},{"id":"r37q15n95","round":37,"q":15,"no":95,"part":"実践","field":"診断・監査","fmt":"tf","stem":"JISやISOなどの規格に対する認証は、登録された認証機関が公平に審査する、第二者認証制度に基づいて行われる。","ok":false,"explanation":"誤り。規格の認証は、組織と利害関係がなく、正式に登録された認証機関が審査する「第三者認証制度」に基づく。第二者監査は、顧客など利害関係者が行う外部監査で、認証機関による審査とは別。第三者は、監査される側と同じ組織にも属さず、利害関係もない独立した機関のこと。同じ組織は第一者、利害関係者は第二者、独立した機関は第三者と整理する。JISは日本産業規格、ISOは国際標準化機構の略。","src":"解説書 p.295","conflict":"","alt":{"stem":"JISやISOなどの規格に対する認証は、登録された認証機関が公平に審査する、第三者認証制度に基づいて行われる。","explanation":"正しい。規格の認証は、審査される組織と利害関係がなく、正式に登録された認証機関が審査する第三者認証制度に基づく。第二者は顧客など利害関係者で、認証機関による審査とは別である。決め手は、審査する側が組織と利害関係のない独立した機関かどうかである。JISは日本産業規格、ISOは国際標準化機構の略。"}},{"id":"r37q15n96","round":37,"q":15,"no":96,"part":"実践","field":"診断・監査","fmt":"mc","stem":"第三者審査で、審査員が規格の要求事項に対して公正に判定するのは、どの観点か。","options":["要求事項に適合しているか否か","要求事項の内容が適正か否か","是正が終わっているか否か","組織の規模が大きいか否か"],"answer":0,"explanation":"審査員は、被審査者が規格の要求事項に「適合」しているかどうかを、客観的なエビデンスにもとづいて判定する。規格の内容の適正さを判断するのは審査の役割ではない。是正が終わっているかどうかは、指摘後の対応の話であって、判定そのものの基準ではない。組織の規模は、適合しているかどうかとは関係がない。審査の物差しは、規格の要求事項に適合しているかどうか。","src":"解説書 p.296","conflict":""},{"id":"r37q15n97","round":37,"q":15,"no":97,"part":"実践","field":"診断・監査","fmt":"mc","stem":"認証のための第三者審査で不適合が見つかったとき、審査員に禁じられている行為はどれか。","options":["是正の中身を具体的に提案するコンサルティング","不適合であることの指摘","被審査者への是正処置の要求","客観的なエビデンスにもとづく判定"],"answer":0,"explanation":"不適合を見つけた場合、審査員は指摘や是正処置を求めることはできるが、是正の内容を提案する「コンサルティング」は禁止されている。審査員が対策まで提案すると、審査の公平性や独立性が損なわれるためで、判定する立場と助言する立場は分ける。指摘、要求、エビデンスにもとづく判定は、審査員の通常の役割。求めるのは是正、提案するのはコンサルティングで、後者が禁止と覚える。","src":"解説書 p.296","conflict":""},{"id":"r37q15n98","round":37,"q":15,"no":98,"part":"実践","field":"診断・監査","fmt":"mc","stem":"ISO 9001が要求する内部監査は、監査者と被監査者の関係で分けるとどれに当たるか。","options":["第一者監査","第二者監査","第三者監査","外部監査"],"answer":0,"explanation":"監査者も被監査者も同じ組織に属する監査は「第一者監査」で、一般に内部監査と呼ばれるものはすべてこれにあたる。第二者監査は、顧客など利害関係者による外部監査。第三者監査は、独立した機関による外部監査で、認証審査がこれにあたる。外部監査は第二者と第三者の総称的な位置づけで、内部監査とは別。ただし、公平性を保つため、自分自身の業務は監査しないなどの配慮が必要になる。ISOは国際標準化機構の略。","src":"解説書 p.295・296","conflict":""},{"id":"r37q15n99","round":37,"q":15,"no":99,"part":"実践","field":"診断・監査","fmt":"mc","stem":"内部監査員には、高圧的な態度を取らない、誘導尋問をしない、はいかいいえで答えるだけの質問を避けるなど、相手から有効な情報を引き出す力が求められる。この力はどれか。","options":["コミュニケーション能力","タイムマネジメント能力","文書化の能力","コンサルティング能力"],"answer":0,"explanation":"監査員と被監査者が敵対せず、友好的で前向きに問題を洗い出せるようにするには、立ち振る舞いや質問の仕方といった「コミュニケーション」の力が欠かせない。タイムマネジメントは時間配分の力で、情報を引き出す姿勢とは別。文書化は記録を残す力。コンサルティングは、適合性の判定とは別に助言するもので、有効な情報を引き出す力ではない。決め手は、相手との対話から情報を得ようとしていること。","src":"解説書 p.296","conflict":""},{"id":"r38q6n37","round":38,"q":6,"no":37,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"未来や将来の問題、未知・未経験の問題のように、これまでに経験したことのない問題を扱うときに使う手法の目的として、最も適切なものはどれか。","options":["はっきりしない混沌とした問題について、事実を把握するために使う","要因どうしの関係を的確につかみ、問題の構造を明らかにする","解決したい問題に対して、方策を順に展開していく","行と列の交点から、問題のある箇所や集中する場所を見つけ、着想を得る"],"answer":0,"explanation":"この状況で使うのは親和図法で、混沌としてはっきりしない問題について、言語データを集めて親和性(近さ)でまとめ、事実や問題の全体像を把握する。要因どうしの関係を整理する目的は連関図法、方策を展開する目的は系統図法、行と列の交点に着目する目的はマトリックス図法のもので、いずれも「もやもやを整理する」という場面には当たらない。決め手は手法の目的で、状況が「混沌としていて何が問題かも見えない」なら、まず言葉を集めてまとめる親和図法。","src":"解説書 p.311(前後の続きは次ページ)","conflict":""},{"id":"r38q6n38","round":38,"q":6,"no":38,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"達成したい目的に対して、その目的を実現する手段や方策を、段階を追って枝分かれさせながら具体的な実行策まで展開していく手法はどれか。","options":["系統図法","親和図法","連関図法","アローダイアグラム法"],"answer":0,"explanation":"目的を達成するための手段を、目的から手段へと段階的に展開して具体策まで落とし込むのは系統図法で、「方策展開」が目的にあたる。親和図法は言語データをまとめて問題を把握する手法、連関図法は原因と結果が絡み合う要因の関係を明らかにする手法、アローダイアグラム法は日程を管理する手法で、方策を展開する手法ではない。目的が「方策を具体的に展開する」なら系統図法。","src":"補筆","conflict":""},{"id":"r38q6n39","round":38,"q":6,"no":39,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"二つの要素群を行と列に並べ、その交点に対応関係を記入して、問題のある箇所や対応が集中している場所を見つけ、問題解決の着想を得るために使う手法はどれか。","options":["マトリックス図法","マトリックス・データ解析法","連関図法","親和図法"],"answer":0,"explanation":"行と列の交点に注目して着想を得るのはマトリックス図法。名前が似ているマトリックス・データ解析法は、交点に数値データが並んだデータから主成分分析などで総合特性値を求める手法で、新QC七つ道具のなかで唯一の数値データ解析法。交点の有無や強弱を見て着想を得るのがマトリックス図法、数値データを解析して整理するのがマトリックス・データ解析法、と区別する。","src":"補筆","conflict":"","resolved":"ノート側のOCR番号ずれ。過去問データの正解を採用(2026-09-22確認): ノートの解答一覧はOCRが崩れて39をオと復元しているが、復元は推定で本文に根拠なし。データの正解(行と列の交点の説明)に従って作成"},{"id":"r38q6n40","round":38,"q":6,"no":40,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"計画を実行していく途中で、事態の進展によってさまざまな結果が起こりうる問題について、予期せぬトラブルを防ぐために事前に考えられる結果を予測し、望ましい結果へ至るプロセスを決めていく手法はどれか。","options":["PDPC法","アローダイアグラム法","系統図法","連関図法"],"answer":0,"explanation":"計画の進行中に起こりうる事態を先に想定し、望ましい方向へ導くプロセスを決めるのはPDPC法(過程決定計画図)。アローダイアグラム法は作業の順序と日程を矢線で表して最短工期などを検討する手法、系統図法は目的から手段を展開する手法、連関図法は要因の関係を整理する手法で、事態の進展に応じた分岐を想定する手法ではない。決め手は「予期せぬ事態をあらかじめ想定して、望ましい結果へ導く」という目的。","src":"解説書 p.313","conflict":"","resolved":"ノート側のOCR番号ずれ。過去問データの正解を採用(2026-09-22確認): ノートではPDPC法の段落の番号ラベルが43と読める(判読不能と注記あり)が、内容はデータの正解(PDPC法)と一致。番号ラベルの読み違いと判断"},{"id":"r38q6n41","round":38,"q":6,"no":41,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"連関図法の目的と最も関連の深い記述はどれか。","options":["要因間の関係を把握して原因を探索すること","配置の型としてL型やT型があること","遅れが全体の日程に直ちに影響する経路を明らかにすること","数値データを主成分分析で解析すること"],"answer":0,"explanation":"連関図法は、原因と結果、原因どうしの因果関係を矢印でつなぎ、要因間の関係を把握して原因を探索する手法。配置の型としてL型やT型があることはマトリックス図法、遅れが全体の日程に直ちに影響する経路を明らかにすることはアローダイアグラム法(クリティカルパス)、数値データを主成分分析で解析することはマトリックス・データ解析法の説明で、それぞれ別の手法の関連用語。決め手は、連関図法が「要因の因果関係をたどって原因を探る」目的をもつこと。","src":"補筆","conflict":""},{"id":"r38q6n42","round":38,"q":6,"no":42,"part":"手法","field":"新QC七つ道具","fmt":"tf","stem":"L型やT型といった配置の型があるのは、アローダイアグラム法である。","ok":false,"explanation":"誤り。L型やT型など複数の型があるのはマトリックス図法で、二つの要素群をどのように組み合わせて行と列に配置するかによって型が分かれる。アローダイアグラム法は作業の順序関係を矢線で表して日程を管理する手法で、配置の型という考え方はなく、関連する用語は遅れが全体日程に直結する経路であるクリティカルパス。マトリックス図法は二つの要素群の組合せ方で配置の型が分かれる手法、アローダイアグラム法は作業の順序関係を管理する手法、と目的の違いで区別する。","src":"補筆","conflict":"","resolved":"ノート側のOCR番号ずれ。過去問データの正解を採用(2026-09-22確認): ノートの解答一覧はOCRが崩れて42をウと復元しているが推定で本文に根拠なし。データの正解(L型,T型)に従って作成","alt":{"stem":"L型やT型といった配置の型があるのは、マトリックス図法である。","explanation":"正しい。L型やT型など複数の型があるのはマトリックス図法で、二つの要素群をどのように組み合わせて行と列に配置するかによって型が分かれる。アローダイアグラム法は、作業の順序関係を矢線で表して日程を管理する手法で、遅れが全体日程に直結する経路であるクリティカルパスを扱う。決め手は、要素の対応関係を整理するのがマトリックス図法、日程を管理するのがアローダイアグラム法という目的の違いである。"}},{"id":"r38q6n43","round":38,"q":6,"no":43,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"日程計画で、作業の遅れが直ちに全体の日程の遅れにつながる作業をつないだ経路を何というか。","options":["クリティカルパス","最早結合点時刻","最遅結合点時刻","ダミー作業"],"answer":0,"explanation":"遅れが全体の日程に直ちに影響する作業をつないだ経路がクリティカルパスで、アローダイアグラム法の関連用語。最早結合点時刻はその結合点に最も早く到達できる時刻、最遅結合点時刻は全体の日程に影響を与えない範囲で最も遅く到達してよい時刻、ダミー作業は作業の順序関係だけを表す時間ゼロの矢線で、経路そのものを指す語ではない。「全体日程に直結する経路」ならクリティカルパス。","src":"解説書 p.313","conflict":"","resolved":"ノート側のOCR番号ずれ。過去問データの正解を採用(2026-09-22確認): ノートではクリティカルパスの段落の番号ラベルが40と読める(判読不能と注記あり)が、内容はデータの正解(クリティカルパス)と一致。番号ラベルの読み違いと判断"},{"id":"r38q6n44","round":38,"q":6,"no":44,"part":"手法","field":"新QC七つ道具","fmt":"tf","stem":"マトリックス・データ解析法は、変数間の相関関係を手がかりに総合特性値を求める、回帰分析の一手法である。","ok":false,"explanation":"誤り。この手法は、サンプル×変数の数値データから変数間の相関を手がかりに総合特性値を求めてサンプル間の関係を整理するもので、多変量解析のうち主成分分析にあたる。回帰分析は、ある特性を説明変数で予測する関係式を求める別の手法。新QC七つ道具のなかで、マトリックス・データ解析法だけが数値データを解析する手法なので、手法の名前とあわせて「主成分分析」を結びつけておく。","src":"解説書 p.313","conflict":"","alt":{"stem":"マトリックス・データ解析法は、変数間の相関関係を手がかりに総合特性値を求める、多変量解析の主成分分析にあたる手法である。","explanation":"正しい。この手法は、サンプル×変数の数値データから変数間の相関を手がかりに総合特性値を求めてサンプル間の関係を整理するもので、多変量解析のうち主成分分析にあたる。回帰分析は、ある特性を説明変数で予測する関係式を求める別の手法である。決め手は、目的が予測式づくりではなく、総合特性値による整理にある点である。"}},{"id":"r38q7n45","round":38,"q":7,"no":45,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"故障率が時間の経過とともに、減少、一定、増加の順に推移する様子を表した曲線はどれか。","options":["バスタブ曲線","OC曲線","ゴンペルツ曲線","検出力曲線"],"answer":0,"explanation":"故障率が減少する初期故障期、ほぼ一定の偶発故障期、増加する摩耗故障期を順につないだ形が浴槽に似ているため、バスタブ曲線と呼ぶ。OC曲線(検査特性曲線)は抜取検査でロットの不適合品率に対する合格確率を表す曲線、ゴンペルツ曲線は成長のようすを表す曲線の一種、検出力曲線は検定で正しく帰無仮説を棄却できる確率を表す曲線で、いずれも故障率の推移を表すものではない。減少・一定・増加の三つ組みならバスタブと覚える。","src":"補筆","conflict":""},{"id":"r38q7n46","round":38,"q":7,"no":46,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"観測データから、ある時間間隔での平均故障率を求めるとき、割り算の分子にあたる量はどれか。","options":["総故障数","総動作時間","総動作個数","総故障時間"],"answer":0,"explanation":"平均故障率は「単位時間あたりにどれだけ故障したか」を表す量なので、同じ時間間隔での総故障数を総動作時間で割って求める。分子は故障した数であって、動作した時間や個数ではない。総動作時間は分母になり、総動作個数はアイテムの数であって時間ではないため故障率の分母にならない。「故障数÷動作時間」で単位時間あたりの故障頻度になる。","src":"補筆","conflict":""},{"id":"r38q7n47","round":38,"q":7,"no":47,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"観測データから平均故障率を評価するには、ある時間間隔での総故障数を、同じ時間間隔での総故障時間で割って求める。","ok":false,"explanation":"誤り。平均故障率の分母は、アイテムが実際に動作していた時間を合計した総動作時間で、総故障時間ではない。故障率は「動作した時間あたり何回故障したか」という頻度を表す量であり、分母が動作時間でなければ単位時間あたりの故障の出やすさにならない。故障数÷動作時間、と分子と分母の対を覚えておく。","src":"補筆","conflict":"","alt":{"stem":"観測データから平均故障率を評価するには、ある時間間隔での総故障数を、同じ時間間隔での総動作時間で割って求める。","explanation":"正しい。平均故障率の分母は、アイテムが実際に動作していた時間を合計した総動作時間である。故障率は動作した時間あたりの故障の出やすさを表す量で、分母が動作時間でなければその意味にならない。総故障時間で割るのは誤りである。"}},{"id":"r38q7n48","round":38,"q":7,"no":48,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"故障率のとりうる値の範囲として、最も適切なものはどれか。","options":["0以上で上限がない","0以上1以下","0を超える範囲","0以上1未満"],"answer":0,"explanation":"故障率は単位時間あたりの故障頻度で、負にはならず0以上の値をとる。確率ではないので上限は1に限られず、時間の単位によって1を超えることもある。故障がなければ0になるので、0を超える範囲とするのは誤り。1以下や1未満という上限が付くのは確率の性質で、故障率とは異なる。「頻度は0以上で上限なし、確率は0以上1以下」と対で覚える。","src":"解説書 p.315","conflict":""},{"id":"r38q7n49","round":38,"q":7,"no":49,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"故障確率は0以上の値をとり、上限はないので1を超えることもある。","ok":false,"explanation":"誤り。故障確率は確率なので0以上1以下の範囲にある。上限がなく1を超えうるのは、単位時間あたりの故障頻度である故障率のほう。故障率と故障確率は名前が似ているが別の量なので、範囲の違いで区別する。確率は必ず0から1までに収まる。","src":"解説書 p.315","conflict":"","alt":{"stem":"故障確率は0以上1以下の値をとり、1を超えることはない。","explanation":"正しい。故障確率は確率なので0以上1以下の範囲にある。上限がなく1を超えうるのは、単位時間あたりの故障頻度である故障率のほうで、名前が似ているが別の量である。決め手は、確率の定義から必ず0から1までに収まるという点である。"}},{"id":"r38q7n50","round":38,"q":7,"no":50,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"与えられた条件のもとで、ある時間区間にわたって要求どおりに機能を遂行できる確率である信頼度が評価できているとき、その区間における故障確率はどのように得られるか。","options":["1から信頼度を引いて得る","信頼度そのものを用いる","信頼度を動作時間で割って得る","信頼度に平均故障率を掛けて得る"],"answer":0,"explanation":"信頼度は「機能を遂行できる(故障しない)確率」で、故障確率(不信頼度)はその余事象にあたるため、1から信頼度を引いた値になる。信頼度そのものは故障しない確率であり、故障確率とは逆の意味。動作時間で割ったり故障率を掛けたりする関係はない。「故障する確率=1-故障しない確率」と押さえる。","src":"解説書 p.315","conflict":""},{"id":"r38q8n51","round":38,"q":8,"no":51,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"顧客に安心感・満足感をもってもらうための品質保証を体系的に進める際、開発・設計・製造・販売・サービスの各段階の活動より先に、まず着手すべきこととして最も適切なものはどれか。","options":["顧客のニーズや期待を明確にするための調査・研究","初期流動管理の実施","全社の品質保証体系図の作成","徹底した検査による、不適合品の後工程への流出防止"],"answer":0,"explanation":"品質保証は顧客の要求を満たすことを保証する活動なので、まず顧客の要求事項を明らかにする必要があり、そのために営業活動やアンケートなどでニーズや期待を調べ、実現するための研究を行う。初期流動管理は量産の立ち上がり期の管理、体系図は各部門の役割分担を示す資料、検査による流出防止は生産段階の対策で、いずれも出発点ではない。順序は「顧客を知る→作り込む→確認する」で、着手は顧客のニーズ調査から。","src":"解説書 p.315","conflict":""},{"id":"r38q8n52","round":38,"q":8,"no":52,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"製造部門だけでなく、販売部門やサービス部門などすべての部門が品質保証の役割をもっていることを認識したうえで、それぞれの担当業務に関する品質保証を行い、顧客の信頼を得るには、どのように進めるのが適切か。","options":["各部門が自部門の使命・役割に応じて分担して実行する","品質保証部門だけが実行し、他部門は協力するだけにとどめる","徹底した検査により、不適合品の後工程への流出を防止する","初期流動管理を実施する"],"answer":0,"explanation":"販売・サービス部門はニーズの調査、企画設計部門は機能や形態の設計、製造部門は作り込みというように、各部門が自分の使命・役割に応じて品質保証を分担して実行することで、顧客の信頼につながる。品質保証部門だけが担う形は「すべての部門が役割をもつ」という前提に反する。検査による流出防止や初期流動管理は、いずれも生産段階の一部の活動にすぎず、全部門で分担するという話ではない。「全部門が、自分の役割で」が決め手。","src":"解説書 p.315","conflict":""},{"id":"r38q8n53","round":38,"q":8,"no":53,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"品質保証部門が、各部門の品質保証にかかわる分担を明確にするために作成する、部門と製品・サービスの提供の流れを組み合わせた表形式の資料はどれか。","options":["品質保証体系図","QC工程図","作業標準書","管理図"],"answer":0,"explanation":"品質保証体系図は、横軸に部門、縦軸に製品・サービス提供の業務の流れをとり、やるべきこと・責任分担・関係部署・情報の流れを明確にする。QC工程図は製造工程で管理すべき項目や点検項目を洗い出したもの、作業標準書は良い作業を標準化して周知するもの、管理図は工程の異常を見つける道具で、いずれも全社の役割分担を示すものではない。全社の分担を示すなら品質保証体系図。","src":"解説書 p.316","conflict":""},{"id":"r38q8n54","round":38,"q":8,"no":54,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"製造部門が工程間検査で得たデータを使って、設計品質を製品に作り込み、安定的な生産を続けるために行うこととして、最も適切なものはどれか。","options":["異常を検出する力を高め、工程能力を把握する","顧客のニーズや期待を明確にする調査・研究を行う","全社の品質保証体系図を作成する","初期流動管理を実施する"],"answer":0,"explanation":"品質は工程で作り込むものなので、工程間検査のデータから異常を見つけて原因を究明・是正し、工程が規格を満たしているか(工程能力)を把握して安定生産につなげる。ばらつきには偶然原因のものが必ず存在するが、いつもと違う異常原因によるばらつきは管理図などで検出する。顧客ニーズの調査は企画段階の活動、体系図の作成は品質保証部門の役割、初期流動管理は量産立ち上がり期の管理で、いずれも工程間検査のデータの活用とは別。","src":"解説書 p.316","conflict":""},{"id":"r38q8n55","round":38,"q":8,"no":55,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"検査基準を確定するにあたり、検査項目に抜けがないこと、合否の判定基準が適正であること、不適合品の混入が防止できることとあわせて明確にしておくべきこととして、最も適切なものはどれか。","options":["正しい測定機器や測定方法を選定すること","検査員の教育記録を保持すること","製品の取扱い注意や落下防止をすること","小集団改善活動を活用すること"],"answer":0,"explanation":"検査基準とは「何を、どんな基準で、どうやって測って合否を決めるか」を定めたもので、測定の精度を確保するために正しい測定機器や測定方法を選ぶことも含まれる。検査結果の確からしさは測定機器や測定方法に左右されるため、検査基準を決める段階でこれらを選定しておく必要がある。検査員の教育記録の保持は検査員の力量管理であって検査基準そのものではなく、取扱い注意や落下防止は製品の保管・運搬の管理、小集団改善活動は改善活動の手段であり、いずれも検査基準に含まれる項目ではない。","src":"補筆","conflict":""},{"id":"r38q8n56","round":38,"q":8,"no":56,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"検査で発見した不適合品の後工程への流出防止に加え、設計品質を良くする仕組み面の再発防止策として、最も適切なものはどれか。","options":["蓄積した不適合の履歴を、新製品の開発段階へフィードバックする","検査員の教育記録を保持する","従業員満足度の向上によって、やりがいのある職場を実現する","製品の取扱い注意や落下防止をする"],"answer":0,"explanation":"検査で見つかった不適合の履歴を蓄積して新製品の開発・設計段階に返すと、同じ原因で不適合が出ない設計にでき、仕組みとして再発を防げる。検査員の教育記録の保持や取扱い注意は、設計品質を良くする話ではない。従業員満足度の向上は大事だが、検査結果の活用による再発防止策とは直接つながらない。「検査結果を設計へ返す」が決め手。","src":"補筆","conflict":""},{"id":"r38q8n57","round":38,"q":8,"no":57,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"顧客に安心感・満足感をもってもらうための品質保証を重視する組織が、不適合に対する改善を徹底し、設計および製造における品質の向上を図る。その目的として最も適切なものはどれか。","options":["顧客満足を考えた品質保証を確実にする","従業員満足度の向上により、やりがいのある職場を実現する","小集団改善活動を活用する","製品の取扱い注意や落下防止をする"],"answer":0,"explanation":"この組織は顧客に安心感・満足感をもってもらうための品質保証を重視しており、不適合の改善もその品質保証を確実にすることが目的になる。従業員満足度の向上は組織として大切だが、この文脈の目的ではない。小集団改善活動は手段であって目的ではなく、取扱い注意や落下防止は製品の扱いに関する話。目的は顧客満足、手段は改善活動、と区別する。","src":"補筆","conflict":""},{"id":"r38q9n58","round":38,"q":9,"no":58,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"経営方針として掲げた顧客満足第一の考えを全社に浸透させるため、業務をインプットからアウトプットへ変える、相互に関連する一連の活動としてとらえて整えていく。品質マネジメントシステムの考え方で、この整えていくものを何というか。","options":["プロセス","検査制度","価格検討","設計審査"],"answer":0,"explanation":"プロセスは、インプットを使って意図した結果を生み出す、相互に関連する一連の活動のことで、品質マネジメントシステムでは業務をプロセスとしてとらえて構築・運用し、方針を全社に浸透させる。検査制度は検査の仕組み、価格検討は価格の決め方、設計審査は設計段階での評価活動で、いずれも一部の業務にとどまり、全社の仕事の流れを整えるものではない。「仕事の流れ全体をプロセスとして整える」。","src":"補筆","conflict":""},{"id":"r38q9n59","round":38,"q":9,"no":59,"part":"実践","field":"品質マネジメントシステム","fmt":"tf","stem":"ISO 9001は顧客満足について、顧客満足度の測定(監視)だけを求めており、その結果の分析や評価までは求めていない。","ok":false,"explanation":"誤り。ISO 9001は顧客満足の程度を監視する(測定する)だけでなく、得られた情報を分析し、評価することも求めている。測定結果が毎回同じレベルで顧客離れの兆候がなかったとしても、測定方法が適切か、結果をどう読み取るかまで評価しなければ、実態を見誤るおそれがある。「測るだけで終わらず、分析して評価する」。ISOは国際標準化機構の略。","src":"補筆","conflict":"","alt":{"stem":"ISO 9001は顧客満足について、顧客満足度を監視(測定)するだけでなく、得られた情報の分析や評価も求めている。","explanation":"正しい。ISO 9001は顧客満足の程度を監視する(測定する)だけでなく、得られた情報を分析し、評価することも求めている。測定結果が毎回同じレベルで顧客離れの兆候がなかったとしても、測定方法が適切か、結果をどう読み取るかまで評価しなければ、実態を見誤るおそれがある。決め手は、測るだけで終わらず、分析して評価するところまで求められる点である。ISOは国際標準化機構の略。"}},{"id":"r38q9n60","round":38,"q":9,"no":60,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"品質方針や品質目標を決めるうえで、顧客満足の状況を、トップマネジメントがあらかじめ定めた間隔で品質マネジメントシステムの有効性などを評価する場へのインプットにしなければならない。この評価の場はどれか。","options":["マネジメントレビュー","設計審査","内部監査","価格検討"],"answer":0,"explanation":"マネジメントレビューは、トップマネジメントが品質マネジメントシステムが適切で有効かを評価する場で、顧客満足の状況や苦情などがインプットになる。設計審査は設計段階で設計が要求を満たすかをレビューするもの。内部監査は組織が自ら要求事項への適合などを確認する活動で、トップが方針や目標の妥当性を評価する場ではない。「トップが評価」ならマネジメントレビュー。","src":"補筆","conflict":""},{"id":"r38q9n61","round":38,"q":9,"no":61,"part":"実践","field":"管理の方法","fmt":"mc","stem":"再発防止のため、不適合の根本原因に至るまで「なぜ」を繰り返して原因を掘り下げていく手法はどれか。","options":["なぜなぜ分析","マトリックス分析","パレート分析","ヒストグラム分析"],"answer":0,"explanation":"現象からその原因、さらにその原因へと「なぜ」を繰り返して根本原因まで掘り下げる手法がなぜなぜ分析で、根本原因を決めて再発防止策につなげるために使う。パレート分析は件数や損失額の大きい項目を見つけて重点を絞る分析、ヒストグラム分析はデータの分布から規格に対する状態を見る分析で、原因の掘り下げ自体が目的ではない。「なぜを繰り返して根本原因へ」。","src":"補筆","conflict":""},{"id":"r38q9n62","round":38,"q":9,"no":62,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"検査項目が足りているのに不適合の見逃しが起きたとき、検査員の力量とあわせて、検査の精度に関わる要素として再確認すべきものはどれか。","options":["測定器","材料","設計者","ステークホルダー"],"answer":0,"explanation":"検査結果の確からしさは、検査を行う検査員の力量と、測定に使う測定器(の精度や校正状態)や測定方法に左右されるため、見逃しの原因としてこれらを確認する。材料や設計者は不適合を作り込む側の要素であって、検査で見逃す原因を調べる対象ではない。ステークホルダーは利害関係者のことで、検査の精度とは関係がない。「見逃し=検査員と測定器を見直す」。","src":"補筆","conflict":""},{"id":"r38q9n63","round":38,"q":9,"no":63,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"受注から出荷までの全プロセスを見直し、人・設備・資金・情報など事業を進めるために投入するものを適切に割り当てることで、正しいものづくりが効率的にできる組織になる。これら人・設備・資金・情報などをまとめて表す用語はどれか。","options":["リソース","ステークホルダー","プロセス","インプット"],"answer":0,"explanation":"人・設備・資金・情報など、事業活動に投入する資源をまとめてリソースと呼び、プロセスを見直すときは、その配分の適切さも含めて考える。ステークホルダーは顧客や従業員など利害関係者のことでリソースとは異なる。プロセスは投入したリソースを使って結果を生み出す一連の活動そのものを指す語で、投入する資源の総称ではない。インプットはプロセスに入力される情報や材料などを指す語で、資金や設備までを含む総称ではない。「人・もの・金・情報の総称」がリソース。","src":"補筆","conflict":""},{"id":"r38q9n64","round":38,"q":9,"no":64,"part":"実践","field":"品質の概念","fmt":"mc","stem":"顧客満足と同じくらい重要な満足度であり、現場で働く人たちが、言うべきことを言える風土のなかでやりがいをもって働けているかにかかわる満足度は、誰の満足度か。","options":["従業員","供給者","株主","顧客"],"answer":0,"explanation":"現場で働く人たちの満足度は従業員満足(ES)で、顧客満足を支える土台として重視される。供給者や株主の満足も利害関係者として大切だが、現場で働く人たちの心境や職場の風土を問う場面には当たらない。顧客満足は文の前半に出てくる別の満足度。「働く人の満足なら従業員、ESは顧客満足と並ぶ土台」。","src":"補筆","conflict":""},{"id":"r38q10n65","round":38,"q":10,"no":65,"part":"実践","field":"品質の概念","fmt":"mc","stem":"ねらいの品質(設計品質)は顧客の要求をふまえて設計で狙う品質で、できばえの品質(製造品質)は製造してできあがった製品が設計の狙いをどれだけ実現しているかを表す品質である。次の活動のうち、主にねらいの品質を向上させるために実施するものはどれか。","options":["設計FMEA","計測機器の校正","組立作業要領の明確化","塗料保管プロセスの見直し"],"answer":0,"explanation":"設計FMEA(故障モード影響解析)は設計段階で起こりうる故障モードを洗い出して対策する活動で、設計の狙いそのものを良くするのでねらいの品質にあたる。計測機器の校正、組立作業要領、塗料保管の見直しはいずれも製造の現場で設計の狙いどおりに作り込むための活動で、できばえの品質にあたる。判断の決め手は「設計」という語の有無ではなく、何を狙うかを決める活動(ねらい)か、狙いをどれだけ実現できたかを確かめる活動(できばえ)か、という活動の中身である。","src":"補筆","conflict":""},{"id":"r38q10n66","round":38,"q":10,"no":66,"part":"実践","field":"品質の概念","fmt":"mc","stem":"ねらいの品質(設計品質)は設計で狙う品質、できばえの品質(製造品質)は製造してできあがった製品が設計の狙いをどれだけ実現しているかを表す品質である。次の活動のうち、主にできばえの品質を向上させるために実施するものはどれか。","options":["計測機器の校正","顧客要求仕様の確認","材料選定基準の明確化","設計の妥当性確認"],"answer":0,"explanation":"計測機器の校正は、製造や検査で測る値を正しく保って設計の狙いどおりの製品を作るための活動で、できばえの品質にあたる。顧客要求仕様の確認、材料選定基準の明確化、設計の妥当性確認は、設計の段階で何を狙うかを決めたり確かめたりする活動なので、ねらいの品質にあたる。製造現場で作り込むなら「できばえ」、設計で狙いを決めるなら「ねらい」。","src":"補筆","conflict":""},{"id":"r38q11n67","round":38,"q":11,"no":67,"part":"実践","field":"管理図","fmt":"mc","stem":"部品のかん合面に生じるキズの数を管理する。すべて検査するのは不可能なので、毎回同じ大きさの試料をランダムに抜き取り、キズの数そのものを記録して工程を管理したい。この場合に最も適した管理図はどれか。","options":["c管理図","p管理図","np管理図","平均値と範囲の管理図"],"answer":0,"explanation":"キズの数のような欠点数を、毎回同じ大きさの試料(欠点が現れる範囲が一定)で数えるときはc管理図を使う。p管理図とnp管理図は、不適合品かどうかを数えるときの不適合品率と不適合品数の管理図で、欠点の数を数える場合ではない。平均値と範囲の管理図は、長さなどの計量値を管理するときの管理図。数えるものが欠点数、試料の大きさが一定ならc管理図。","src":"解説書 p.322","conflict":""},{"id":"r38q11n68","round":38,"q":11,"no":68,"part":"実践","field":"管理図","fmt":"tf","stem":"管理図上で打点が管理限界線の外に出た状態を、規格外れという。","ok":false,"explanation":"誤り。打点が管理限界線を外れることは管理外れといい、工程に異常が起きた疑いがあることを示す。管理限界線は規格値とは別のもので、その工程がもつ変動から計算した値。規格外れは製品の特性値が規格値の範囲から出ることを指す。管理外れは工程の状態、規格外れは製品の適否、と対象で分ける。","src":"解説書 p.322","conflict":"","alt":{"stem":"管理図上で打点が管理限界線の外に出た状態を、管理外れという。","explanation":"正しい。打点が管理限界線を外れることは管理外れといい、工程に異常が起きた疑いを示す。管理限界線は工程の変動から計算した値で、規格値とは別物。規格外れは製品の特性値が規格値の範囲から出ることである。決め手は、見ている対象が工程の状態か製品の適否かである。"}},{"id":"r38q11n69","round":38,"q":11,"no":69,"part":"実践","field":"管理の方法","fmt":"tf","stem":"管理図で異常が認められた期間に加工された危険ロットを後工程に流すときは、通常どおり抜取検査を行って適合を確認すればよい。","ok":false,"explanation":"誤り。異常が起きた間の加工品は、いつもと違う状態で作られた可能性が高く、通常の抜取検査では不適合品の混入を見逃すおそれがあるため、全数検査を行って適合品だけを後工程へ流す。異常時に作られたロットは、後工程への流動をいったん止めて別管理にするのが基本。異常があったなら「抜き取りでなく全部見る」。","src":"解説書 p.322","conflict":"","alt":{"stem":"管理図で異常が認められた期間に加工された危険ロットを後工程に流すときは、全数検査を行って適合品だけを流す。","explanation":"正しい。異常が起きた間の加工品は、いつもと違う状態で作られた可能性が高く、通常の抜取検査では不適合品の混入を見逃すおそれがある。そのため全数検査を行って適合品だけを後工程へ流す。異常時に作られたロットは、後工程への流動をいったん止めて別管理にするのが基本である。決め手は、不適合品を後工程へ流さないという目的から、異常があったなら抜き取りでなく全部見るという点である。"}},{"id":"r38q11n70","round":38,"q":11,"no":70,"part":"実践","field":"管理の方法","fmt":"mc","stem":"異常への応急的な対応で状況が収まり、後工程に迷惑がかからなくなった。この次に、原因を追究してその原因に確実に手を打つことで、同じ不適合を二度と起こさないようにする活動を何というか。","options":["再発防止","暫定対策","不適合事項","全数検査"],"answer":0,"explanation":"応急対策で現象が収まったあとは、原因を追究して、その原因に手を打つ再発防止(是正対策)に進む。暫定対策は応急的な手当てで、根本の原因を取り除くものではない。不適合事項は起きた不具合の内容のことで、活動ではない。全数検査は流出を防ぐための対応であり、再発を防ぐものではない。「応急=止める、再発防止=原因を断つ」。","src":"解説書 p.322","conflict":""},{"id":"r38q11n71","round":38,"q":11,"no":71,"part":"実践","field":"管理の方法","fmt":"mc","stem":"不適合の再発を防ぐには、結果と原因の関係を把握したうえで、現れた現象ではなく何に手を打つ必要があるか。","options":["真の原因","発生した不適合品","暫定対策","管理限界"],"answer":0,"explanation":"再発防止では、結果と原因の関係を把握して、根本にある真の原因に手を打つ。発生した不適合品そのものに手を打っても、原因が残っていれば再発する。暫定対策は応急的な手当てで、これを繰り返しても根本は解決しない。管理限界は管理図で異常を判断する線であり、手を打つ対象ではない。「現象ではなく真の原因に手を打つ」。","src":"解説書 p.322","conflict":""},{"id":"r38q11n72","round":38,"q":11,"no":72,"part":"実践","field":"その他手法(QC七つ道具・工程能力指数)","fmt":"mc","stem":"特性(結果)に対する原因を、大骨・中骨・小骨のように枝分かれさせて階層的に整理する、QC七つ道具の手法はどれか。","options":["特性要因図","連関図","親和図","パレート図"],"answer":0,"explanation":"特性要因図は、特性に影響する要因を、大骨から中骨・小骨へと枝分かれさせて整理する。魚の骨に似た形をとるが、原因どうしが互いに影響しあう複雑な関係は表しにくい。連関図と親和図は新QC七つ道具で、連関図は要因の因果関係を矢印でつなぐ手法、親和図は言語データをまとめる手法。パレート図は項目別に大きさを比べて重点を探す手法で、原因の整理ではない。特性に影響する要因を大骨・中骨・小骨と分類して整理する目的なら特性要因図、要因どうしの関係が絡み合っているなら連関図と、目的で区別する。","src":"解説書 p.322","conflict":""},{"id":"r38q11n73","round":38,"q":11,"no":73,"part":"実践","field":"新QC七つ道具","fmt":"mc","stem":"結果に対する原因が複数あり、しかも要因どうしが互いに影響しあって複雑に絡み合っている問題について、原因と結果、原因どうしの因果関係を矢印でつないで、原因を探るのに向く手法はどれか。","options":["連関図","特性要因図","親和図","系統図"],"answer":0,"explanation":"要因どうしが絡み合って因果関係が複雑な問題には、矢印で因果関係を自由につなげる連関図が向いている。特性要因図は要因を枝分かれで階層的に整理するもので、要因どうしの相互の関係を表しにくい。親和図は言語データをまとめて全体像をつかむ手法、系統図は目的から手段を展開する手法で、原因の因果関係をたどる手法ではない。要因の関係が複雑なら連関図。","src":"解説書 p.322","conflict":""},{"id":"r38q12n74","round":38,"q":12,"no":74,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品を開発するとき、顧客が普段は意識しておらず、実際の製品を目の前にして初めて「これが欲しかった」と認識するようなニーズを把握し、独創的なアイデアを付け加えることが求められる。このニーズを表す用語はどれか。","options":["潜在ニーズ","顕在ニーズ","暗黙のニーズ","機能展開"],"answer":0,"explanation":"顧客自身がまだ認識しておらず、製品を見て初めて気づくニーズは、表に現れていない「潜在ニーズ」。これを捉えることが独創的なアイデアにつながる。顕在ニーズはすでに顧客が認識して言葉にできるニーズなので反対の性格。暗黙のニーズは、あまりに当たり前なので顧客が口に出さないが、満たされていて当然と思っているもので、「初めて認識される」わけではない。機能展開はニーズを機能や品質特性に落とし込む手順の名前で、ニーズの種類ではない。決め手は「認識されていない」かどうかで、認識されていない=潜在、認識されている=顕在。","src":"解説書 p.323","conflict":""},{"id":"r38q12n75","round":38,"q":12,"no":75,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"現有技術の延長線上では実現が難しい品質・コスト・信頼性の課題があり、その解決が新製品の成否を握る決め手になる。開発プロセスの早い段階でこうした技術を明らかにし、ブレークスルーしておくことが重要とされる。この技術を何というか。","options":["ボトルネック技術","保証の網","機能展開","ディペンダビリティ"],"answer":0,"explanation":"解決が難しいが、それを乗り越えないと次に進めない技術を「ボトルネック技術」(ネック技術)という。顧客・社会のニーズを満たすために必要な技術のうち、制約になっている技術という位置づけで、早い段階で洗い出して突破しておく。保証の網は、工程ごとの品質保証の項目を一覧にして保証の抜け漏れを確認する表で、技術課題の名前ではない。機能展開はニーズを機能や特性へ展開する手順。ディペンダビリティは信頼性・保全性・保全支援性などを含む総合的な概念。決め手は「乗り越えないと先へ進めない技術」。","src":"解説書 p.323","conflict":""},{"id":"r38q12n76","round":38,"q":12,"no":76,"part":"実践","field":"品質保証:新製品開発","fmt":"mc","stem":"新製品開発の未然防止活動で、構成要素ごとに起こりうる故障モードを洗い出し、その影響を下位から上位へ向かって解析して、重要度の高いものに対策を立てる手法はどれか。","options":["FMEA","FTA","機能展開","保証の網"],"answer":0,"explanation":"部品や工程の故障モードを見つけ、それが上位のシステムに及ぼす影響を評価する、ボトムアップの手法がFMEA(故障モード影響解析)。重要度の高い故障モードに絞って対策を立てられる。FTA(故障の木解析)は、起こってほしくない事象を頂点に置き、その原因を下へ向かって洗い出すトップダウンの手法なので向きが逆。機能展開や保証の網は、故障モードを洗い出す手法ではない。向きで覚え、下から積み上げるのがFMEA、上から掘り下げるのがFTA。","src":"解説書 p.323","conflict":""},{"id":"r38q12n77","round":38,"q":12,"no":77,"part":"実践","field":"品質保証:新製品開発","fmt":"tf","stem":"FMEAは、発見された故障モードの原因を追究するために、頂上事象からその原因となる事象を順に洗い出していくトップダウンの解析手法である。","ok":false,"explanation":"誤り。頂上事象から原因事象を順に洗い出して原因を追究するトップダウンの手法は「FTA(故障の木解析)」で、FMEAではない。FMEA(故障モード影響解析)は、潜在的な故障モードを見つけ、その影響を積み上げていくボトムアップの手法。2つを併用し、FTAで見つけた原因から導いた対策をFMEAの対策欄に書き込むと、未然防止の完成度が上がる。向きで区別し、原因を上から掘り下げるのがFTA、故障モードを下から見つけるのがFMEA。","src":"解説書 p.323","conflict":"","alt":{"stem":"FTAは、発見された故障モードの原因を追究するために、頂上事象からその原因となる事象を順に洗い出していくトップダウンの解析手法である。","explanation":"正しい。頂上事象から原因事象を順に洗い出して原因を追究するトップダウンの手法はFTA(故障の木解析)である。FMEA(故障モード影響解析)は、潜在的な故障モードを見つけ、その影響を積み上げていくボトムアップの手法で、これとは区別する。決め手は、原因を上から掘り下げる目的か、故障モードを下から見つける目的かという点にある。"}},{"id":"r38q13n78","round":38,"q":13,"no":78,"part":"実践","field":"日常管理","fmt":"mc","stem":"部門別管理は、各部門に課せられた通常の業務の役割を確実に果たすことを目的とし、決められた標準類を守ることで何をする活動か。","options":["現状維持","革新","内部統制","組織の再編"],"answer":0,"explanation":"部門別管理(日常管理)は、方針管理ではカバーしきれない通常業務を、各部署が標準を守って確実にこなす活動で、基本は「現状維持」。標準を守って現在の水準を維持するのが部門別管理であるのに対し、水準を新たに引き上げる革新は方針管理の領域にあたり、向きが逆になる。内部統制は会社全体の業務の適正を確保する仕組みの話で、標準遵守の目的を表す語ではない。組織の再編は組織構造を変えることを指し、標準を守る活動とは別の話。標準を守る=維持(部門別管理)、水準を変える=革新(方針管理)と覚える。","src":"解説書 p.324","conflict":""},{"id":"r38q13n79","round":38,"q":13,"no":79,"part":"実践","field":"日常管理","fmt":"mc","stem":"部門別管理では、成果を測るための管理項目に加えて、その結果が良いか悪いかを評価するための基準を決めておき、基準を外れる異常を検出したら原因の追究と対策を行う。この評価の基準を表す用語はどれか。","options":["管理水準","監査基準","製品安全指標","内部統制"],"answer":0,"explanation":"管理項目で測った値を評価する物差しが「管理水準」で、これを外れたら異常として原因追究と対策に進む。管理項目と管理水準はセットで決める。監査基準は監査で適合かどうかを判定する拠り所であり、日常の業務の成果を評価する基準ではない。製品安全指標は管理項目の一種になりうる指標そのものだが、その値を評価する基準ではない。測るものが管理項目、評価する基準が管理水準。","src":"解説書 p.324","conflict":""},{"id":"r38q13n80","round":38,"q":13,"no":80,"part":"実践","field":"機能別管理","fmt":"tf","stem":"機能別管理は、部門ごとに全社的な目標を定め、それを効果的・効率的に達成する活動である。","ok":false,"explanation":"誤り。機能別管理は「経営基本要素ごと」に全社的な目標を定める。経営基本要素とは、品質・原価・量および納期・安全・環境などである。部門ごとに役割を確実に果たすのは部門別管理のほうで、両者の分け方の軸が違う。機能別管理は要素で切り、部門別管理は部門で切ると覚える。","src":"解説書 p.324","conflict":"","alt":{"stem":"機能別管理は、経営基本要素ごとに全社的な目標を定め、それを効果的・効率的に達成する活動である。","explanation":"正しい。機能別管理は、品質・原価・量および納期・安全・環境などの経営基本要素ごとに全社的な目標を定めて達成する活動である。部門ごとに役割を果たすのは部門別管理で、分け方の軸が異なる。決め手は、要素で切るのか部門で切るのかという管理の軸である。"}},{"id":"r38q13n81","round":38,"q":13,"no":81,"part":"実践","field":"機能別管理","fmt":"mc","stem":"機能別管理では、各部門の業務分担を適正にしたうえで、どのような形で連携や協力をして活動を進めることが基本か。","options":["部門横断的","部門最適","内部統制","組織"],"answer":0,"explanation":"品質や納期のような要素は特定の部門だけでは達成できず、複数の部門にまたがるため、機能別管理は部門の枠を越えた「部門横断的」な連携・協力で進める。部門最適は自部門だけの都合で考えることで、全体最適をねらう機能別管理とは反対の姿勢。要素ごとに切る機能別管理は、部門横断で全体最適をねらうと覚える。","src":"解説書 p.324","conflict":""},{"id":"r38q13n82","round":38,"q":13,"no":82,"part":"実践","field":"機能別管理","fmt":"mc","stem":"納期管理を全社の経営テーマとして機能別委員会を新設するとき、全社の各部門が納期管理に関して果たす役割を確定するために、明確にしておく必要があるものはどれか。","options":["責任と権限","感性品質","製造物責任","監査機能"],"answer":0,"explanation":"各部門が連携・協力して動くには、誰が何に責任を持ち、どこまで決められるかという「責任と権限」を明確にしておくことが前提になる。製造物責任は製品の欠陥による損害への賠償責任の話で、部門の役割分担とは別。感性品質は人の感覚で評価される品質、監査機能は監査を担う役割で、いずれも部門の役割確定の中身ではない。連携の前提は責任と権限の明確化と覚える。","src":"解説書 p.325","conflict":""},{"id":"r38q13n83","round":38,"q":13,"no":83,"part":"実践","field":"機能別管理","fmt":"tf","stem":"納期管理の機能別委員会は、経営指標を改善するための方向付けとフォローを、各部門の部門最適の視点から行う。","ok":false,"explanation":"誤り。機能別委員会は各部門の個別最適ではなく、「全社的視点」から全体最適を目指して方向付けとフォローを行う。納期は特定の部門だけでは決まらず、複数の部門の連携で初めて改善できるため、部門最適では成果が出にくい。機能別管理は全体最適、部門の枠内の話は部門最適と覚える。","src":"解説書 p.325","conflict":"","alt":{"stem":"納期管理の機能別委員会は、経営指標を改善するための方向付けとフォローを、全社的視点から行う。","explanation":"正しい。機能別委員会は各部門の個別最適ではなく、全社的視点から全体最適を目指して方向付けとフォローを行う。納期は特定の部門だけでは決まらず、複数の部門の連携で初めて改善できるため、部門最適では成果が出にくい。決め手は、機能別管理が部門の枠を越えて全体最適を目的とするという点である。"}},{"id":"r38q14n84","round":38,"q":14,"no":84,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準化の効果として、個人や職場に受け継がれてきたものづくりの勘やコツを含む技術を、企業の技術として蓄積でき、技術力の向上が図れる。ここでいう技術を表す用語はどれか。","options":["固有技術","統一化・ルール化","ばらつき","納期"],"answer":0,"explanation":"対象となる製品や分野そのものに固有の技術で、勘やコツも含めた知見を「固有技術」という。標準にして書き残せば、個人に頼らず会社の技術として蓄積できる。統一化・ルール化は業務の進め方をそろえる効果、ばらつきは品質の変動のこと、納期は生産管理で管理する対象であって、いずれも個人や職場に受け継がれてきた技術そのものを指す語ではない。標準化は、人に付いた技術を会社に残す手段と覚える。","src":"解説書 p.325","conflict":""},{"id":"r38q14n85","round":38,"q":14,"no":85,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準化により、製品や部品の互換性、システムの整合性が向上し、ムダ取りが進むことで、低減に寄与するものはどれか。","options":["コスト","固有技術","統一化・ルール化","体系"],"answer":0,"explanation":"互換性が上がれば部品の種類や在庫を絞れ、ムダ取りで手間も減るため、「コスト」の低減に寄与する。固有技術は蓄積して向上させるもの、統一化・ルール化は業務をそろえるという効果で、いずれも低減の対象ではない。低減の対象になるのは費用のほうで、ムダを取ってコストを下げると覚える。","src":"解説書 p.325","conflict":""},{"id":"r38q14n86","round":38,"q":14,"no":86,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準化により、業務の進め方が共通化・明文化されると、能率が向上し、部門内外の連携もよくなる。この効果を表す用語はどれか。","options":["統一化・ルール化","ばらつき","固有技術","コスト"],"answer":0,"explanation":"やり方を統一しルールとして定める「統一化・ルール化」が進むと、誰がやっても同じ手順になり、能率が上がって部門間の連携もとりやすくなる。ばらつきやコストは標準化で管理・低減する対象で、進むものではない。固有技術は蓄積するもの。業務をそろえて進めるのが統一化・ルール化と覚える。","src":"解説書 p.325","conflict":""},{"id":"r38q14n87","round":38,"q":14,"no":87,"part":"実践","field":"標準化","fmt":"tf","stem":"社内標準化により、固有技術を管理し低減させることで、品質が安定する。","ok":false,"explanation":"誤り。管理して低減させる対象は「ばらつき」である。品質が安定するのは、ばらつきが小さくなるから。固有技術は蓄積して高めるものであり、低減させるものではない。標準を守ればやり方がそろい、ばらつきが減って品質が安定する。ばらつきは低減、固有技術は蓄積と覚える。","src":"解説書 p.325","conflict":"","alt":{"stem":"社内標準化により、ばらつきを管理し低減させることで、品質が安定する。","explanation":"正しい。管理して低減させる対象はばらつきであり、品質が安定するのはばらつきが小さくなるからである。標準を守ればやり方がそろい、ばらつきが減る。固有技術は蓄積して高めるものであり、低減させるものではない。決め手は、標準化の目的が作業のやり方をそろえてばらつきを減らすことにある点である。"}},{"id":"r38q14n88","round":38,"q":14,"no":88,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準のうち、材料・製品・工具・設備などについて、要求する特定の形状・構造・寸法・成分・能力・精度・性能・製造方法・試験方法などを定めたものはどれか。","options":["仕様","規定","技術標準","作業標準"],"answer":0,"explanation":"モノに要求する形状・寸法・性能などを定めた標準が「仕様」。規定は組織や業務の内容・手順・手続きを定めたもの。技術標準は工程や製品ごとに必要な技術事項を定めたもの。作業標準は作業条件・作業方法・使用材料などの作業の基準を定めたもの。決め手は定める対象で、モノに要求する内容なら仕様、業務の進め方なら規定、作業のやり方なら作業標準と覚える。","src":"解説書 p.326","conflict":""},{"id":"r38q15n89","round":38,"q":15,"no":89,"part":"実践","field":"小集団活動","fmt":"mc","stem":"職場の業務上の問題に取り組むとき、個人で改善を進めるだけでなく、同じ職場のメンバーが集まって一つのまとまりとして取り組むと大きな効果がある。このまとまりを表す用語はどれか。","options":["小グループ","CFT","監査","後工程はお客様"],"answer":0,"explanation":"職場の問題は影響が職場全体に及ぶので、職場のメンバーが集まった「小グループ」で取り組むほうが、多様な意見が出て解決の効果も大きい。CFT(部門横断チーム)は部門をまたいで編成されるチームで、同じ職場のメンバーによるまとまりとは違う。監査は活動を検証する行為で、取り組みの単位ではない。後工程はお客様は、次の工程を顧客と見る考え方。職場の問題は職場の小グループで取り組むと覚える。","src":"解説書 p.326","conflict":""},{"id":"r38q15n90","round":38,"q":15,"no":90,"part":"実践","field":"小集団活動","fmt":"mc","stem":"一人ひとりがもつ知識・技能・見方・権限は、経験や地位によって限られる。組織にとって重要な問題に取り組むには、異なる知識や技能をもつ複数の人が何をすることが必要か。","options":["連携・協力","やる気","監査","後工程はお客様"],"answer":0,"explanation":"個人の力には限りがあるので、異なる能力をもつ人どうしが「連携・協力」して取り組むことが、重要な問題の解決に必要になる。これが小グループで活動する理由でもある。やる気は個人の意欲であり、それだけでは能力の限界を補えない。監査は活動を検証する行為で、問題を解く方法ではない。限られた力を補い合う=連携・協力。","src":"解説書 p.327","conflict":""},{"id":"r38q15n91","round":38,"q":15,"no":91,"part":"実践","field":"小集団活動","fmt":"mc","stem":"小集団活動のまとめ役であるリーダーが、メンバーに指示を与えながら人間関係にも配慮して集団を率い、小グループとしての力を発揮させる。このリーダーに求められる力はどれか。","options":["リーダーシップ","やる気","連携・協力","規律向上"],"answer":0,"explanation":"指示を与えつつ人間関係にも気を配って集団を導く力が「リーダーシップ」。この力は、リーダーとメンバーがお互いに協力して能力を発揮することで身につく。やる気は個人の意欲、連携・協力は複数の人が力を合わせることで、リーダー個人に求められる力の名前ではない。集団を率いる力がリーダーシップ。","src":"解説書 p.327","conflict":""},{"id":"r38q15n92","round":38,"q":15,"no":92,"part":"実践","field":"小集団活動","fmt":"tf","stem":"小集団活動では、相互の連携やまとまり、意見の集約のしやすさを考えて、1つの小グループの人数は10〜15名が望ましい。","ok":false,"explanation":"誤り。望ましい人数は5〜8名である。人数が多すぎると連携が取りにくく、出された意見も集約しにくい。少なすぎても意見が集まらず、効果を得にくい。5〜8名が適切な大きさと覚える。","src":"解説書 p.327","conflict":"","alt":{"stem":"小集団活動では、相互の連携やまとまり、意見の集約のしやすさを考えて、1つの小グループの人数は5〜8名が望ましい。","explanation":"正しい。人数が多すぎると連携が取りにくく、出された意見も集約しにくい。少なすぎても意見が集まらず効果を得にくい。連携と意見の集約のしやすさという目的から、5〜8名が適切な大きさとされる。"}},{"id":"r38q15n93","round":38,"q":15,"no":93,"part":"実践","field":"小集団活動","fmt":"mc","stem":"小集団活動は、上司に言われて行うのではなく、メンバーが自発的に問題を見つけて取り組むことを基本とする。どの問題を解決するか、進め方や役割をどうするかも、メンバー自身で決める。この基本となる考え方はどれか。","options":["自主性","規律向上","透明性","合理性"],"answer":0,"explanation":"自ら問題を見つけ、進め方や役割も自分たちで決めるのが「自主性」を基本にした活動。人は自分で考え、自分の意志で仕事をするほうが楽しく、成果も上がる。決め事が多く見えても、その中身をメンバー自身で決めていれば自主性は保たれる。規律向上、透明性、合理性は、自発的に決めるという点を表す語ではない。自分たちで決めるのが自主性。","src":"解説書 p.327・328","conflict":""},{"id":"r38q15n94","round":38,"q":15,"no":94,"part":"実践","field":"小集団活動","fmt":"mc","stem":"やりがい・働きがい・生きがいを最も感じるのは、自発的な思考のもとで活動し、成果を上げたときである。これは、良い職場づくりの基本である、働く人の何を尊重することに基づくか。","options":["人間性","合理性","透明性","傾聴力向上"],"answer":0,"explanation":"働く人の生きがいを尊重し、能力を最大限に発揮させる考え方が、働く人の「人間性」の尊重で、良い職場づくりの基本になる。合理性は無駄なく筋道立てて行う姿勢、透明性は情報や手続きが見えること、傾聴力向上は聞く力を高めることで、生きがいの尊重を表す語ではない。やりがい・生きがいの尊重=人間性の尊重と覚える。","src":"解説書 p.328","conflict":"","resolved":"ノート側のOCR番号ずれ。過去問データの正解を採用(2026-09-22確認): 解説書p.328の本文は「人間性志向」を95としているが、同ページの解答一覧では94がケ(人間性)、95がウ(管理・改善)であり、過去問データ(94=人間性)と一致する。本文の番号ずれと判断"},{"id":"r38q15n95","round":38,"q":15,"no":95,"part":"実践","field":"小集団活動","fmt":"mc","stem":"小集団活動は、職場の問題を見つけ、その原因を解析して再発を防止する、実践的な活動である。この活動を一言で表す言葉はどれか。","options":["管理・改善","新製品開発","規律向上","透明性"],"answer":0,"explanation":"職場の問題を見つけて原因を解析し、再発を防ぐのは、仕事を管理し改善していく実践的な活動、つまり「管理・改善」。経験や勘だけに頼らず、事実を正しくとらえて的確な行動につなげるために、QC的ものの見方・考え方やQC手法を使う。新製品開発は新しい製品を生み出す活動であり、職場の問題を解析して再発防止する活動とは目的が違う。問題を見つけて原因を解析し再発防止する=管理・改善。","src":"解説書 p.328","conflict":""},{"id":"r38q15n96","round":38,"q":15,"no":96,"part":"実践","field":"人材育成","fmt":"tf","stem":"QC的ものの見方・考え方やQC手法を適用して管理・改善を進めると、メンバーの共通認識と相互理解が生まれ、問題解決を適切に行える一人ひとりの能力が向上し、小集団活動が活性化していく。","ok":true,"explanation":"正しい。手法を使うと、事実にもとづいて話し合えるので共通認識と相互理解が生まれる。その結果、一人ひとりの問題解決の能力が向上し、活動が活性化していく。ただし手法を使うこと自体が目的ではなく、継続的に問題を解決することが目的で、手法はその手段である。活用の狙いは能力向上と活性化と覚える。","src":"解説書 p.328","conflict":""},{"id":"r38q16n97","round":38,"q":16,"no":97,"part":"実践","field":"診断・監査","fmt":"mc","stem":"TQMにおけるトップ診断は、品質の重要性を全員がしっかりと理解する意識を、企業全体に浸透させることをねらう。この意識を表す用語はどれか。","options":["品質経営","コストダウン","部門とのコミュニケーション","現場の判断"],"answer":0,"explanation":"TQM(総合的品質管理)で全社的に必要な意識は、品質の重要性を全員が理解し、経営の中心に品質を据える「品質経営」の意識である。コストダウンは経営の一要素にすぎず、品質の重要性を全員が理解する意識とは別。部門とのコミュニケーションはトップが円滑にすべき対象で、浸透させる意識の名前ではない。現場の判断は、トップが方針を示すことと関係が薄い。全社に浸透させるのは品質経営の意識。","src":"解説書 p.329","conflict":""},{"id":"r38q16n98","round":38,"q":16,"no":98,"part":"実践","field":"診断・監査","fmt":"mc","stem":"TQMの取組みを強化するため、トップマネジメント自身が、TQM導入の決意と推進の方針を組織内に示し展開するときに、十分に発揮することが期待される役割はどれか。","options":["リーダーシップ","権限委譲","現場の判断","重点指向"],"answer":0,"explanation":"トップが自ら決意を示し、方針を組織に展開して導入・推進を引っ張ることが「リーダーシップ」。権限委譲は任せることで、トップ自身が決意を示す役割とは向きが異なる。現場の判断は現場に任せる話であり、トップの役割ではない。重点指向は効果の大きい問題に絞って資源を集中する考え方で、トップの姿勢を表す語ではない。トップが先頭に立つ=リーダーシップ。TQMは総合的品質管理の略。","src":"解説書 p.329","conflict":""},{"id":"r38q16n99","round":38,"q":16,"no":99,"part":"実践","field":"診断・監査","fmt":"mc","stem":"トップマネジメントは、予算を計上して各部門の担当者を決めたら終わりとは考えず、トップ診断のねらいとして、トップが各部門との間で円滑にすべきものを強く意識しなければならない。それはどれか。","options":["部門とのコミュニケーション","権限委譲","コストダウン","重点指向"],"answer":0,"explanation":"全社で品質への意識を高めるために、トップが現場に出向いて対話し、円滑な「部門とのコミュニケーション」を図ることがねらいの一つになる。現場との対話でトップの本気度が伝わり、モチベーションも上がる。権限委譲は任せきりにすることで、担当者を決めて終わりにしない姿勢と反対の方向。コストダウンや重点指向は、円滑にすべき対象として問われている内容ではない。任せきりにせず自ら対話するのがトップ診断。","src":"解説書 p.329","conflict":""},{"id":"r38q16n100","round":38,"q":16,"no":100,"part":"実践","field":"方針管理","fmt":"mc","stem":"トップ診断は方針管理の進捗確認の側面をもつ。企業の使命・理念・ビジョン・戦略にもとづく経営計画について、全部門・全階層が参画して目標を達成するために、回すことが不可欠なものはどれか。","options":["PDCAサイクル","SDCAサイクル","重点指向","品質経営"],"answer":0,"explanation":"方針管理では、目標を立て(計画)、実施し、進捗を確認し(評価)、処置する管理のサイクルであるPDCAサイクルを回して、目標達成を目指す。SDCAサイクルは標準を守って現状の水準を維持する回し方で、新しい目標に向けて計画から始める方針管理には合わない。重点指向は考え方、品質経営は意識の名前で、回すものではない。目標達成のために計画から回すのがPDCA。","src":"解説書 p.329","conflict":""},{"id":"r38q16n101","round":38,"q":16,"no":101,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理でトップ診断を行うとき、目標と方策の整合とあわせて、両方に具体的に設定されていて食い違いがないか確認すべき、達成度を測る指標は何か。","options":["管理項目","品質特性","社内標準","保証の網"],"answer":0,"explanation":"目標にも方策にも具体的な「管理項目」を置き、両者の管理項目にずれがないかを確かめる。ずれがあると、経営の実行に大きな無駄が生じる。品質特性は製品やサービスの評価対象となる性質であり、方針の進み具合を測る指標ではない。社内標準は業務や作業の決まりで、保証の網は工程ごとの保証項目を一覧にした表なので、目標と方策の整合を見る指標ではない。整合を見る対象は管理項目。","src":"解説書 p.329・330","conflict":""},{"id":"r38q16n102","round":38,"q":16,"no":102,"part":"実践","field":"診断・監査","fmt":"mc","stem":"製品やサービスの品質、プロセスの効率や改善、顧客満足度などを検証し、品質マネジメントシステム(QMS)の潜在的な問題や改善点を特定する活動は、トップ診断と似た意味で使われる。この活動を表す用語はどれか。","options":["品質監査","日常管理","保証の網","QCD"],"answer":0,"explanation":"QMSに関わる検証を行い、問題や改善点を見つける活動は「品質監査」で、トップ診断と似た用語として扱われる。日常管理は各部門が標準を守って業務を維持する活動、保証の網は工程ごとの保証項目を整理した表、QCDは品質・コスト・納期という経営の基本要素で、いずれも検証活動の名前ではない。QMSの検証=品質監査と覚える。","src":"解説書 p.330","conflict":""},{"id":"r39q6n32","round":39,"q":6,"no":32,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"問題が発生するメカニズムや因果関係が複雑に絡み合っているとき、原因と結果の関係を矢線でつないで論理的に追究し、図に表す新QC七つ道具はどれか。","options":["連関図法","系統図法","親和図法","マトリックス図法"],"answer":0,"explanation":"原因と結果、目的と手段などが複雑に絡み合った問題について、その関係を論理的につないで問題を解明する手法が連関図法。系統図法は、目標に対する手段や方策を枝分かれさせて展開する手法で、絡み合いを追う手法ではない。親和図法は、言語データを親和性でまとめて問題の所在や形を明らかにする手法。決め手は、複雑に絡み合った原因と結果の関係を解きほぐすことを目的とするか、目標から手段へ順に展開することを目的とするかという定義の違いで、矢線を使う手法は他にもあるため矢線の有無は決め手にならない。","src":"解説書 p.349","conflict":""},{"id":"r39q6n33","round":39,"q":6,"no":33,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"達成したい目標に対して、その手段や方策を一次手段、二次手段、三次手段と具体的な内容になるまで順に枝分かれさせて展開していく手法はどれか。","options":["系統図法","連関図法","PDPC法","アローダイアグラム法"],"answer":0,"explanation":"目的や目標などのゴールを決め、そこへ至る手段や方策を系統立てて展開していくのが系統図法で、もれなく手段を列挙して効率的に最適な手段を選び出すのに向く。連関図法は複雑に絡んだ原因と結果の関係を解きほぐす手法で、目標から手段への展開ではない。PDPC法(過程決定計画図)は予期しないトラブルに備えて事前に結果を予測する手法、アローダイアグラム法は作業の順序関係から日程を組む手法。目標から手段へ枝分かれして展開するのが系統図法。","src":"解説書 p.349","conflict":""},{"id":"r39q6n34","round":39,"q":6,"no":34,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"プロジェクト活動で必要な作業を、順序関係が分かるように結合点と矢線で表し、最適な日程計画の立案や効率のよい進捗管理に用いる手法はどれか。","options":["アローダイアグラム法","PDPC法","マトリックス図法","系統図法"],"answer":0,"explanation":"順序関係のある作業を結合点と矢線で表して最適な日程計画を立てる手法が、アローダイアグラム法。紛らわしいPDPC法(過程決定計画図)は、計画を進める中で起こり得る予期しないトラブルをあらかじめ予測し、進行を望ましい方向へ導く手法で、日程を最適化する手法ではない。マトリックス図法は二元表で要素間の関係を見る手法、系統図法は目標から手段を展開する手法。決め手は目的で、日程計画と進捗管理ならアローダイアグラム法、不測の事態への備えならPDPC法。","src":"解説書 p.349","conflict":""},{"id":"r39q6n35","round":39,"q":6,"no":35,"part":"手法","field":"新QC七つ道具","fmt":"mc","stem":"商品のランク付けや問題の所在を明らかにするために、行と列に対になる要素を配置し、要素どうしの関係の強さなどを記号で表して整理する手法はどれか。","options":["マトリックス図法","マトリックス・データ解析法","親和図法","連関図法"],"answer":0,"explanation":"行に属する要素と列に属する要素で二元的に配置した図が、JISの定義でのマトリックス図で、その交点に着目して問題の所在や形態を探る手法がマトリックス図法。名前が似たマトリックス・データ解析法は、マトリックス図に並んだ多くの数値データを整理する手法(主成分分析という多変量解析の一手法)で、記号で関係を表す手法ではない。関係を記号で示すのが図法、数値データを解析するのがデータ解析法。","src":"解説書 p.349・350","conflict":""},{"id":"r39q7n36","round":39,"q":7,"no":36,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"ある装置を観測したところ、修理時間は無視できるものとして、累計2000時間動作する間に5回故障し、5回目の故障が起きた時点で観測を終えた。平均故障間動作時間(MTBF)は何時間か。","options":["400時間","500時間","1600時間","2000時間"],"answer":0,"explanation":"MTBFは、その期間の総動作時間を総故障数で割った値で、2000÷5=400時間になる。500時間とするのは、観測を終えた5回目の故障を数えずに4回で割った誤りで、観測期間中に起きた故障はすべて数える。2000時間は総動作時間そのもので、割り算を忘れた値。MTBFは総動作時間を故障回数で割る、と覚える。","src":"解説書 p.350","conflict":""},{"id":"r39q7n37","round":39,"q":7,"no":37,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"故障間動作時間が指数分布に従い、平均故障間動作時間(MTBF)が250時間のとき、1時間あたりの故障率はいくらか。","options":["0.004","0.0025","0.04","250"],"answer":0,"explanation":"故障間動作時間が指数分布に従うと、どの期間をとっても故障率は一定になり、MTBFは故障率の逆数になる。したがって故障率は1÷250=0.004。0.0025は1÷400にあたる値で、別の数字を逆数にしたもの。0.04は小数点の位置を取り違えた値。故障率とMTBFは逆数の関係、と覚える。","src":"解説書 p.350","conflict":""},{"id":"r39q7n38","round":39,"q":7,"no":38,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"システムを構成する要素のうち、一つでも故障するとシステム全体が故障に陥る接続の仕方を何というか。","options":["直列系","並列系","直並列系","待機冗長系"],"answer":0,"explanation":"各要素の一つでも故障するとシステムが故障するのは直列系で、信頼度は各要素の信頼度の積で求める。並列系はその逆で、少なくとも一つの要素が機能していればシステムとして動作する。直並列系は直列と並列を組み合わせた混合系、待機冗長系は予備の要素を待機させておき、故障したときに切り替えて使う構成。決め手は「一つでも故障したらシステムも故障」かどうかで、これに当てはまるのは直列系。","src":"解説書 p.351","conflict":""},{"id":"r39q7n39","round":39,"q":7,"no":39,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"二つの要素を並列に接続したシステムの信頼度は、各要素の信頼度の積で求められる。","ok":false,"explanation":"誤り。信頼度の積で求めるのは直列系で、並列系ではすべての要素が同時に故障する場合に着目する。各要素の不信頼度の積でシステムの不信頼度を求め、それを1から引いたものが信頼度になる(1-(1-R1)(1-R2))。たとえば信頼度0.8の要素を二つ並列にすると1-0.2×0.2=0.96で、単独の要素より高くなる。直列は信頼度の積、並列は不信頼度の積を1から引く、と覚える。","src":"解説書 p.351","conflict":"","alt":{"stem":"二つの要素を並列に接続したシステムの信頼度は、1から各要素の不信頼度の積を引いて求められる。","explanation":"正しい。並列系ではすべての要素が同時に故障したときだけシステムが故障するので、各要素の不信頼度の積がシステムの不信頼度になり、それを1から引いたものが信頼度になる(1-(1-R1)(1-R2))。たとえば信頼度0.8の要素を二つ並列にすると1-0.2×0.2=0.96で、単独の要素より高くなる。信頼度の積で求めるのは直列系で、並列系とは別である。決め手は、並列は冗長にして全部が壊れたときだけ故障とする構成という点である。"}},{"id":"r39q7n40","round":39,"q":7,"no":40,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"一つの要素に、二つの要素を並列に接続した部分を直列につないだ構成のシステムを何というか。","options":["直並列系","直列系","並列系","待機冗長系"],"answer":0,"explanation":"直列と並列が混在した混合系を直並列系という。要素が一つだけ直列に入り、その後ろに並列部分がつながる構成がその例。直列系はすべての要素が直列に並ぶだけ、並列系はすべてが並列の構成で、混在していない。待機冗長系は予備の要素を待機させる方式で、接続の混在を指す語ではない。直列と並列の両方が含まれていれば直並列系。","src":"解説書 p.351","conflict":""},{"id":"r39q7n41","round":39,"q":7,"no":41,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"信頼度が0.90の要素を二つ直列に接続したシステムの信頼度はいくらか。","options":["0.81","0.99","0.90","0.729"],"answer":0,"explanation":"直列系の信頼度は各要素の信頼度の積なので、0.90×0.90=0.81。0.99は、同じ二つの要素を並列にした場合(1-0.1×0.1)の値。0.729は0.90を三つ掛けた値で、要素数が違う。直列にするほど信頼度は下がり、どの要素よりも小さくなる、と覚えておくと検算できる。","src":"解説書 p.351","conflict":""},{"id":"r39q7n42","round":39,"q":7,"no":42,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"信頼度が0.70の要素を二つ並列に接続したシステムの信頼度はいくらか。","options":["0.91","0.49","0.51","0.70"],"answer":0,"explanation":"並列系は、両方が同時に故障する確率(不信頼度の積)を1から引く。不信頼度は0.30なので、1-0.30×0.30=1-0.09=0.91。0.49は0.70×0.70で、直列系の計算を当てはめた誤り。0.51はその0.49を1から引いた値で、手順を混ぜてしまった誤り。並列にすると信頼度は元の要素より高くなるので、0.70より大きい値になるはず、と検算できる。","src":"解説書 p.351","conflict":""},{"id":"r39q7n43","round":39,"q":7,"no":43,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"信頼度がいずれも0.90の三つの要素があり、一つの要素に、残り二つを並列にした部分を直列につないだ。このシステムの信頼度はいくらか。","options":["0.891","0.810","0.990","0.729"],"answer":0,"explanation":"並列部分を先に計算すると1-0.1×0.1=0.99。これと直列に入る要素の0.90を掛けて、0.90×0.99=0.891になる。0.990は並列部分だけの値で、直列の要素を掛け忘れている。0.729は三つを単純に直列とした場合の値。0.810は並列部分を0.90のまま扱った値で、並列にした効果を見落としている。内側の並列を先に処理し、そのあと直列の掛け算をする。","src":"解説書 p.351","conflict":""},{"id":"r39q8n44","round":39,"q":8,"no":44,"part":"手法","field":"抜取検査","fmt":"mc","stem":"抜取検査で、本来受け入れたい良いロットを誤って不合格と判定してしまう確率(α)を何というか。","options":["生産者危険","消費者危険","検査者危険","販売者危険"],"answer":0,"explanation":"良いロットが不合格になると不利益を被るのは、それを作った生産者側なので、この確率αを生産者危険という。逆に、悪いロットが合格してしまうと困るのは受け入れる消費者側で、その確率βが消費者危険。サンプルにはばらつきがあり、サンプルの不適合品率がロットの不適合品率と一致するとは限らないので、こうした誤判定が起こる。良いロットの誤不合格=生産者危険、悪いロットの誤合格=消費者危険。","src":"解説書 p.352","conflict":""},{"id":"r39q8n45","round":39,"q":8,"no":45,"part":"手法","field":"抜取検査","fmt":"tf","stem":"受け入れたくない悪いロットを誤って合格と判定してしまう確率βは、生産者危険と呼ばれる。","ok":false,"explanation":"誤り。悪いロットを誤って合格としてしまう確率βは消費者危険で、悪いロットを受け入れて不利益を被るのは消費者側だから。生産者危険は、良いロットを誤って不合格にする確率αのほう。規準型抜取検査は、この二つの危険を一定の小さい値に抑えて設計され、通常はα=0.05、β=0.10を用いる。不利益を被る側の名前がつく、と覚える。","src":"解説書 p.352","conflict":"","alt":{"stem":"受け入れたくない悪いロットを誤って合格と判定してしまう確率βは、消費者危険と呼ばれる。","explanation":"正しい。悪いロットを誤って合格としてしまう確率βは消費者危険で、悪いロットを受け入れて不利益を被るのは消費者側だからである。生産者危険は、良いロットを誤って不合格にする確率αのほうである。規準型抜取検査は、この二つの危険を一定の小さい値に抑えて設計され、通常はα=0.05、β=0.10を用いる。決め手は、誤判定で不利益を被る側の名前がつくという点にある。"}},{"id":"r39q8n50","round":39,"q":8,"no":50,"part":"手法","field":"抜取検査","fmt":"mc","stem":"計量規準型一回抜取検査で、下限規格値が5.0mm、標準偏差が0.2mm、合格判定係数kが1.50のとき、下限合格判定値はいくつか。","options":["5.30mm","4.70mm","5.03mm","6.50mm"],"answer":0,"explanation":"下限合格判定値は、下限規格値にkσを加えて求める。5.0+1.50×0.2=5.30mm。抜き取ったサンプルの平均値がこの値以上ならロットを合格とする。4.70mmは足すべきところを引いた誤り(引くのは上限規格値がある場合で、上限規格値-kσ)。5.03mmはkσの小数点の位置を取り違えた値。下限は規格値+kσ、上限は規格値-kσ、と覚える。","src":"解説書 p.353・354","conflict":""},{"id":"r39q8n51","round":39,"q":8,"no":51,"part":"手法","field":"抜取検査","fmt":"tf","stem":"同じ条件のもとで計数規準型と計量規準型の一回抜取検査を比べると、計数規準型のほうが必要なサンプル数がはるかに多い。","ok":true,"explanation":"正しい。計量値は個々のサンプルの値そのものを使って判定するため、同じ判別力を得るのに必要なサンプル数が少なくて済む。この問題の条件では、計数規準型がサンプル60個に対し、計量規準型は10個だった。ただし計量規準型は、個々の値を測定して平均値を計算する手間がかかり、どちらが適するかは検査内容や測定コストなどを考えて決める。計数は数が多いが判定が簡単、計量は数が少ないが測定と計算が必要。","src":"解説書 p.354","conflict":""},{"id":"r39q9n52","round":39,"q":9,"no":52,"part":"実践","field":"管理の方法","fmt":"mc","stem":"生産工程で異常が発生したとき、暫定処置として、異常が発生した工程を正常な状態に戻すために取り除く対象はどれか。","options":["異常な現象","真の原因","指示権限","不具合処理費用"],"answer":0,"explanation":"暫定処置は、損失をこれ以上大きくしないための応急的な処置で、異常な現象を除去して工程を正常な状態に戻すとともに、異常な工程で作られたものを正常品と混ぜず、後工程やお客様へ流さない処置も行う。真の原因を探して取り除くのは恒久処置のほうで、暫定処置の段階では行わない。現象を止めるのが暫定処置、原因を取り除くのが恒久処置と対で覚える。","src":"解説書 p.354・355","conflict":""},{"id":"r39q9n53","round":39,"q":9,"no":53,"part":"実践","field":"管理の方法","fmt":"mc","stem":"異常が発生したときに応急処置を迅速に行えるよう、異常発見時の行動や対処の手順とあわせて、あらかじめ明確にして全員が理解しておくべきものはどれか。","options":["応急処置の指示権限","不具合処理費用","標準化処置","特異性"],"answer":0,"explanation":"暫定処置は迅速さが求められるため、誰が応急処置を指示できるのかという指示権限を、処置の手順とあわせてルール化し、関係者全員が理解している必要がある。権限が曖昧だと、異常を見つけてもその場で動けず、損失が広がる。費用は処置の結果として生じるもので、事前に明確にして迅速さを確保するものではない。異常時の手順と権限を事前に決めておく、と覚える。","src":"解説書 p.355","conflict":""},{"id":"r39q9n54","round":39,"q":9,"no":54,"part":"実践","field":"管理の方法","fmt":"mc","stem":"すでに発生した異常について、その原因を取り除き、同じ異常を繰り返さないようにする恒久処置の基本となる処置はどれか。","options":["是正処置","予防処置","暫定処置","類似処置"],"answer":0,"explanation":"異常を発生させた真の原因を探し出して取り除き、再発を防ぐ処置が是正処置。予防処置は、まだ起きていない、起こり得る問題の原因を取り除くための処置で、すでに発生した異常が対象ではない。暫定処置は損失を広げないための応急的な処置で、原因は取り除かない。すでに起きた異常の再発を防ぐ=是正処置、まだ起きていない問題の発生を防ぐ=予防処置。","src":"解説書 p.355","conflict":""},{"id":"r39q9n55","round":39,"q":9,"no":55,"part":"実践","field":"管理の方法","fmt":"mc","stem":"異常の再発を防止するために、探し出して取り除き、そのうえで歯止めを確実に行うことが基本となるものはどれか。","options":["真の原因","異常な現象","不具合処理費用","特異性"],"answer":0,"explanation":"再発を防ぐには、異常を発生させた真の原因を探し出して取り除き、二度と同じ原因で問題が起きないように歯止めをかける。目に見える異常な現象を取り除くだけでは暫定処置にとどまり、原因が残っているため同じ異常が繰り返される。処置の対象が現象なら暫定、真の原因なら恒久、と区別する。","src":"解説書 p.355","conflict":""},{"id":"r39q9n56","round":39,"q":9,"no":56,"part":"実践","field":"管理の方法","fmt":"mc","stem":"その製品では発生していないが、類似の製品やプロセスで発生した問題が、放置すると将来起こり得る。この問題の再発を防ぐために、あらかじめ原因を取り除いておく処置はどれか。","options":["予防処置","是正処置","暫定処置","標準化処置"],"answer":0,"explanation":"予防処置は、まだ起きていない不適合(起こり得る望ましくない状況)の原因を取り除き、発生そのものを防ぐ処置(旧JIS Q 9000:2005の定義)。類似の製品で起きた問題を自分の製品に当てはめて先に手を打つ処置がこれにあたり、恒久処置に含まれる。是正処置は、すでに起きた不適合の原因を取り除いて再発を防ぐ処置。対象がまだ起きていなければ予防処置、すでに起きていれば是正処置。","src":"解説書 p.355","conflict":""},{"id":"r39q9n57","round":39,"q":9,"no":57,"part":"実践","field":"管理の方法","fmt":"tf","stem":"未然防止では、発生が想定される問題を、製品が出荷されて苦情を受けたあとの段階で洗い出し、そのときに対策を講じる。","ok":false,"explanation":"誤り。未然防止は、問題が発生する前に、製品設計や工程設計などの計画段階で問題を予測して洗い出し、事前に処置しておくことで発生を防ぐ活動。苦情を受けてから洗い出して対策するのは、起きた問題への事後の対応になり、未然防止とは言えない。予測の方法にはFMEAやFTAなどがある。未然防止は「計画段階で」「発生前に」がポイント。","src":"解説書 p.355","conflict":"","alt":{"stem":"未然防止では、発生が想定される問題を、製品設計や工程設計などの計画段階で洗い出し、あらかじめ対策を講じる。","explanation":"正しい。未然防止は、問題が発生する前の計画段階で問題を予測して洗い出し、事前に処置して発生を防ぐ活動である。苦情を受けてから対策するのは事後の対応で、未然防止とは言えない。予測の方法にはFMEAやFTAなどがある。決め手は、発生前に手を打つという目的である。"}},{"id":"r39q9n58","round":39,"q":9,"no":58,"part":"実践","field":"管理の方法","fmt":"mc","stem":"問題が発生する前に、製品設計や工程設計の段階で起こり得る問題を予測して洗い出し、修正や対策を事前に講じておくことで、問題の発生を防ぐ活動を何というか。","options":["未然防止","是正処置","暫定処置","三現主義"],"answer":0,"explanation":"問題が起きる前に予測して手を打つ活動が未然防止。是正処置は、すでに起きた異常の原因を取り除いて再発を防ぐ処置で、事後の対応になる。暫定処置は発生した異常に対する応急的な処置。三現主義は現場・現物・現実で事実を確かめる考え方で、予測して防ぐ活動を指す語ではない。「起きる前」なら未然防止、「起きたあと」なら是正処置や暫定処置。","src":"解説書 p.355","conflict":""},{"id":"r39q9n59","round":39,"q":9,"no":59,"part":"実践","field":"管理の方法","fmt":"mc","stem":"未然防止を効果的に行うために、過去に発生した問題を整理してまとめるとき、基本となる観点はどれか。","options":["類似性","発生の時間経過","影響解析","三現主義"],"answer":0,"explanation":"全く経験したことのない問題を防ぐのは難しいが、原因から結果に至る過程の一断面に限れば、共通する部分は多い。そこで、過去の問題を類似性に基づいて整理し、いろいろな状況に汎用的に使える共通的なものにまとめ、活用する方法を確立する。時間経過は発生の順序にすぎず、別の問題に応用する軸にならない。影響解析は問題を予測する手段のほうで、過去の問題を整理する観点ではない。過去の問題は似ているもの同士でまとめて再利用する、と覚える。","src":"解説書 p.355","conflict":""},{"id":"r39q10n60","round":39,"q":10,"no":60,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"QC工程図は、製造の各工程での設備や作業手順などを検討するときの拠り所としても使える。次のうち、QC工程図が活用できる資料はどれか。","options":["生産技術資料","設備保全資料","安全管理資料","労働時間管理資料"],"answer":0,"explanation":"QC工程図は工程の流れに沿って品質の管理方法を整理した図なので、各工程の設備や作業手順といった生産技術を検討するときの拠り所になる。生産技術と品質管理は密接に関わっているため。設備保全資料は、設備の仕様にはQC工程図が関係しても、設備の保全とは関係しない。安全管理資料も、作業手順にはQC工程図が関係しても、安全管理そのものとは関係しない。労働時間の管理も品質管理の対象外。QC工程図は工程の品質管理と生産技術に使う。","src":"解説書 p.356","conflict":""},{"id":"r39q10n61","round":39,"q":10,"no":61,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"次の事柄のうち、QC工程図の管理対象から最も離れているものはどれか。","options":["労働災害の調査","工程管理","異常の検出と処置","品質特性のチェック頻度"],"answer":0,"explanation":"工程管理、異常の検出と処置、作業標準、品質特性のチェック頻度は、いずれも品質管理の内容で、QC工程図に記載して管理する対象。労働災害の調査は品質管理の内容ではなく、QC工程図の管理対象から離れている。QC工程図は品質を作り込む工程の管理を整理する図なので、品質に関わるかどうかで判断する。","src":"解説書 p.356","conflict":""},{"id":"r39q10n62","round":39,"q":10,"no":62,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"新設した工程の試運転中で、最重要の管理項目の管理水準がまだ決まらず、QC工程図に記載できていない。試運転をしながら検討して、できるだけ早く決める予定である。QC工程図の扱いとして最も適切なものはどれか。","options":["製造前に条件を決定する目標日を決め、決定予定日を書いておく","決定するまでの間、この管理項目をQC工程図から削除しておく","決定するまでは「検討中」とだけ書いておく","水準が決まらない項目は管理項目として不適切なので、記載しない"],"answer":0,"explanation":"立ち上げ時にテスト稼働をしながら管理基準を調整することはあるが、未記載のままにするよりも、基準を決める予定日程や決定のプロセスを記載するべき。QC工程図に未記載の項目があると、生産管理や品質管理での活用に制約やヌケモレが生じるおそれがあるため。削除や記載しない対応はヌケモレの原因になる。「検討中」とだけでは、いつ・どう決めるのかが分からない。未記載にせず、決める予定日を書く。","src":"解説書 p.356・357","conflict":""},{"id":"r39q10n63","round":39,"q":10,"no":63,"part":"実践","field":"品質保証:プロセス保証","fmt":"mc","stem":"工程確認のために測定している光の透過率は、製品の規格値にはなく、レンズの材質など他の要因の影響を強く受けて、製造工程の中で直接管理できない。この項目のQC工程図での扱いとして適切なものはどれか。","options":["「参考値」と明記して記載する","管理できないので、QC工程図から削除する","製品規格と同じ扱いで、管理値として断定して記載する","QC工程図には載せず、口頭で伝える"],"answer":0,"explanation":"製造工程の中で直接管理ができず、他の要因の影響を受ける項目は、QC工程図では「参考値」として扱う。工程確認に役立つ情報なので削除はせず、管理値と区別して明記することで、読む人が誤って管理項目と受け取らないようにする。規格値として断定すると、直接管理できないものを管理していることになってしまう。直接管理できず影響を受ける項目は、参考値と書いて残す。","src":"解説書 p.357","conflict":""},{"id":"r39q11n64","round":39,"q":11,"no":64,"part":"実践","field":"管理の方法","fmt":"tf","stem":"新規業務への対応や、現状を大幅に改善する場合には、問題解決型QCストーリーを適用すると効果的である。","ok":false,"explanation":"誤り。この場合は課題達成型QCストーリーが適する。問題解決型は、従来から行っていることの問題点を明確にして、あるべき姿(良い状態)に戻すタイプ。課題達成型は、新規に課題を設定したり現状を打破したりして、過去に到達したことのないありたい姿へ持っていくタイプ。戻すなら問題解決型、新しく創るなら課題達成型。","src":"解説書 p.357・358","conflict":"","alt":{"stem":"新規業務への対応や、現状を大幅に改善する場合には、課題達成型QCストーリーを適用すると効果的である。","explanation":"正しい。新規に課題を設定したり現状を打破したりして、過去に到達したことのないありたい姿へ持っていく場合は課題達成型が適する。問題解決型は、従来から行っていることの問題点を明確にして、あるべき姿(良い状態)に戻すタイプで、紛らわしいが別である。決め手は、目的が元の良い状態に戻すことなら問題解決型、新しく創ることなら課題達成型という点である。"}},{"id":"r39q11n65","round":39,"q":11,"no":65,"part":"実践","field":"管理の方法","fmt":"mc","stem":"課題達成型QCストーリーで、ありたい姿と現状のギャップを明確にして現状を把握したあと、これまでに実施したことのない理想の状態に到達するために、何をどの指標でどれくらいの値にすればよいかを見いだすステップはどれか。","options":["攻め所と目標の設定","現状把握","要因の解析","方策の立案"],"answer":0,"explanation":"課題達成型では、現状把握でギャップを明らかにしたあと、何を(どの指標を)どのくらいにすれば課題達成になるのかを見いだす。これを攻め所と目標の設定と呼ぶ。現状把握はその前段のギャップの把握で、目標の値までは決めない。方策の立案は目標が決まったあとに、具体的な実施内容のアイデアを出すステップ。指標と目標値を決めるのが攻め所と目標の設定。","src":"解説書 p.358","conflict":""},{"id":"r39q11n66","round":39,"q":11,"no":66,"part":"実践","field":"管理の方法","fmt":"mc","stem":"課題達成型QCストーリーで、目標を達成できそうなアイデアをできるだけ多く列挙し、期待効果の観点から有力な候補を選び出すステップはどれか。","options":["方策の立案","成功シナリオの追究","効果の確認","対策の実施"],"answer":0,"explanation":"これまでに到達していないレベルを目指すので、今までにない策のアイデアを出し、複数の候補の中から目標を達成できる効果的な方策を立案する。これが方策の立案。成功シナリオの追究は、その候補を実現する方法や手順を検討して期待効果を予測する、次のステップ。効果の確認は実施後の評価。アイデアを出して選ぶのが方策の立案、選んだ案の実現手順を練るのが成功シナリオの追究。","src":"解説書 p.358","conflict":""},{"id":"r39q11n67","round":39,"q":11,"no":67,"part":"実践","field":"新QC七つ道具","fmt":"mc","stem":"課題達成型QCストーリーで、選んだ方策を実現する方法や手順を、フローチャートとあわせて検討する。途中で起こり得る不測の事態も予測して、進め方を望ましい方向へ導くために使う新QC七つ道具はどれか。","options":["PDPC法","親和図法","マトリックス図法","アローダイアグラム法"],"answer":0,"explanation":"PDPC法(過程決定計画図)は、計画を実施していくうえで予期しないトラブルを防ぐため、事前に考えられるさまざまな結果を予測し、プロセスの進行を望ましい方向へ導く手法なので、方策の実現手順の検討に合う。アローダイアグラム法は作業の順序関係から最適な日程計画を立てる手法で、不測の事態への備えが目的ではない。親和図法は言語データの整理、マトリックス図法は二元表での関係の把握に使う。不測の事態を見込むならPDPC法。","src":"補筆(PDPC法の定義は解説書 p.349)","conflict":""},{"id":"r39q11n68","round":39,"q":11,"no":68,"part":"実践","field":"管理の方法","fmt":"tf","stem":"課題達成型QCストーリーで、選んだ方策を実現する方法や手順を検討し、期待効果を予測するステップは、「要因の解析」である。","ok":false,"explanation":"誤り。方策の実現方法や手順を検討して期待効果を予測するステップは「成功シナリオの追究」。要因の解析は、問題解決型QCストーリーで、問題を起こしている原因を調べるステップで、課題達成型の手順には出てこない。課題達成型では、課題の明確化・現状把握のあとに、攻め所と目標の設定→方策の立案→成功シナリオの追究→実施→効果の確認と進む。案を選んだあと、うまくいく筋道を描くのが成功シナリオの追究。","src":"補筆","conflict":"","alt":{"stem":"課題達成型QCストーリーで、選んだ方策を実現する方法や手順を検討し、期待効果を予測するステップは、「成功シナリオの追究」である。","explanation":"正しい。方策の実現方法や手順を検討して期待効果を予測するステップは成功シナリオの追究である。要因の解析は、問題解決型QCストーリーで、問題を起こしている原因を調べるステップで、課題達成型の手順には出てこない。課題達成型は、攻め所と目標の設定、方策の立案、成功シナリオの追究、実施、効果の確認と進む。決め手は、選んだ案がうまくいく筋道を描くという目的にある。"}},{"id":"r39q11n69","round":39,"q":11,"no":69,"part":"実践","field":"新QC七つ道具","fmt":"mc","stem":"課題達成型QCストーリーで、飛躍のある仮説を立てたり新しいアイデアを生んだりするための発想法として、ブレーンストーミングやNM法とあわせて用いられる、言語データを親和性でまとめて問題の所在を明らかにする手法はどれか。","options":["親和図法","アローダイアグラム法","系統図法","マトリックス・データ解析法"],"answer":0,"explanation":"親和図法は、言語データを相互の親和性によって統合して図にし、解決すべき問題の所在や形を明らかにしていく手法で、発想法として用いられる。系統図法は、目標に対する手段を展開する手法で、言語データを親和性でまとめるものではない。アローダイアグラム法は日程計画、マトリックス・データ解析法は数値データの整理に使う。言語データをまとめて発想を得るのが親和図法。NM法は考案者・中山正和の頭文字に由来する発想法。","src":"補筆(親和図法の定義は解説書 p.349)","conflict":""},{"id":"r39q12n70","round":39,"q":12,"no":70,"part":"実践","field":"日常管理","fmt":"mc","stem":"事業計画を実現して充実させるには、二つの活動が両輪として不可欠になる。一つは、すでに実現できている部分を確実に実施し続ける活動、もう一つは不足している部分に新たな課題を設定して改善・革新に向かう方針管理である。前者の活動はどれか。","options":["日常管理","リスクアセスメント","全体合意","結果のレビュー"],"answer":0,"explanation":"日々の業務遂行に不可欠な、すでにできていることを確実に実施する活動が「日常管理」で、新たな課題に取り組む活動である方針管理と対になる。リスクアセスメントは、リスクの特定・分析・評価をする一連の活動で、業務を確実に実施し続ける活動の名称ではない。全体合意や結果のレビューも、この活動の名前ではない。覚え方は、維持して確実にやる=日常管理、新しい課題に挑む=方針管理。","src":"解説書 p.360","conflict":""},{"id":"r39q12n71","round":39,"q":12,"no":71,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理は、全部門・全階層が参画し、向きをそろえて方針を達成していく活動と定義される。人・時間・コストなどの経営資源に限りがあることを踏まえ、この達成の進め方として示されている考え方はどれか。","options":["重点指向","全体合意","管理のサイクル","トップダウンとボトムアップ"],"answer":0,"explanation":"経営資源は有限なので、課題を絞って集中的に取り組む「重点指向」で達成していく、というのが方針管理の定義の骨格。管理のサイクルは、達成の途中で回し続ける仕組みで、経営資源が限られているから選ぶ、という理由づけとは別の話。トップダウンとボトムアップは、方針を展開する際の情報の流れ方を指す語で、資源の制約への対応ではない。決め手は「限られた資源」への対応で、それは絞って集中する重点指向。","src":"解説書 p.360","conflict":""},{"id":"r39q12n72","round":39,"q":12,"no":72,"part":"実践","field":"方針管理","fmt":"mc","stem":"目標と方策を決め、方策どおりに実施し、進捗を確認し、問題があれば目標や方策を見直す。方針管理を実践するうえで、この一連の流れを継続的に回していくことを表す用語はどれか。","options":["管理のサイクル","結果のレビュー","リスクアセスメント","全体合意"],"answer":0,"explanation":"決める、実施する、確認する、見直すという流れを繰り返すのはPDCAで、「管理のサイクル」ともいう。結果のレビューは、確認の場面の一つにすぎず、流れ全体を回し続けることは指さない。リスクアセスメントは、リスクを特定して評価する活動で、方針の展開状況を回す仕組みではない。覚え方は、見直しまで含めて繰り返す流れ全体が管理のサイクル。","src":"解説書 p.360","conflict":""},{"id":"r39q12n73","round":39,"q":12,"no":73,"part":"実践","field":"方針管理","fmt":"mc","stem":"組織として取り組むべき課題は数多くあるが、投入できる経営資源には限りがある。その中から重点課題を決めるとき、考慮すべきものはどれか。","options":["優先順位","業務分掌","応急対策","集約点"],"answer":0,"explanation":"課題が多くて資源が限られるときは、どれから取り組むかを決める必要があり、その考慮対象が「優先順位」。業務分掌は、部門や担当の役割分担を決めたもので、課題を選ぶ基準ではない。応急対策は、起きた問題への暫定的な処置で、方針の課題選びとは関係が薄い。決め手は「数ある課題から絞る」なので優先順位。","src":"解説書 p.360(73の途中まで。前後は補筆)","conflict":""},{"id":"r39q12n74","round":39,"q":12,"no":74,"part":"実践","field":"方針管理","fmt":"tf","stem":"方針管理の要素のうち、目標とは、目的を達成するために選ばれた手段のことである。","ok":false,"explanation":"誤り。目標は、目的を達成するために追求する到達点。目的を達成するために選ばれた手段は「方策」で、この二つは別の要素。方策で目標に近づく、という関係で覚える。到達点=目標、手段=方策。","src":"補筆","conflict":"","alt":{"stem":"方針管理の要素のうち、目標とは、目的を達成するために追求する到達点のことである。","explanation":"正しい。目標は、目的を達成するために追求する到達点である。目的を達成するために選ばれた手段は方策で、両者は別の要素。方策によって目標に近づくという関係になる。決め手は、到達点を示すのか手段を示すのかという定義の違いである。"}},{"id":"r39q12n75","round":39,"q":12,"no":75,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理で、目標の達成状況を管理するために評価尺度として選定するものはどれか。","options":["管理項目","管理水準","到達点","集約点"],"answer":0,"explanation":"目標の達成を管理するための評価尺度が「管理項目」。管理水準は、その項目についてプロセスが安定または計画どおりのとき示すはずの値や範囲で、尺度そのものではなく尺度の基準値にあたる。到達点は目標そのものを指す。尺度=管理項目、基準の値や範囲=管理水準と対で覚える。","src":"補筆","conflict":""},{"id":"r39q12n76","round":39,"q":12,"no":76,"part":"実践","field":"方針管理","fmt":"mc","stem":"方針管理で、プロセスが安定している、または計画どおりに進んでいる状態を表す値または範囲を何というか。","options":["管理水準","管理項目","到達点","期末のレビュー"],"answer":0,"explanation":"安定した、または計画どおりのプロセスの状態を表す値や範囲が「管理水準」。管理項目は、その状態を測る評価尺度そのもので、値や範囲ではない。到達点は目標を表す語、期末のレビューは期末に行う見直しで、状態の値ではない。「値または範囲」と出たら管理水準。","src":"補筆","conflict":""},{"id":"r39q13n77","round":39,"q":13,"no":77,"part":"実践","field":"標準化","fmt":"tf","stem":"実際の作業に合わなくなった社内標準は改訂し、使われていない社内標準は、要否を検討したうえで廃止しなければならない。","ok":true,"explanation":"正しい。標準が実態と合わないままだと、標準と実際の仕事がずれ、使われない標準が積み上がる。使われていないものを無条件に廃止するのではなく、必要かどうかを検討してから廃止する点まで含めて正しい。改訂と廃止をセットで管理する。","src":"解説書 p.362","conflict":""},{"id":"r39q13n78","round":39,"q":13,"no":78,"part":"実践","field":"標準化","fmt":"mc","stem":"社内標準化が定着するかどうかは、標準化の方針を自ら打ち出す姿勢にかかっている、とされる。標準化を推進する組織やスタッフを配置して取り組む立場にあたるのは誰か。","options":["経営層","作業者","従業員","現場の監督者"],"answer":0,"explanation":"社内標準化は経営効率を高める手段であり、方針を打ち出し組織やスタッフを配置できるのは「経営層」。現場の監督者や作業者、従業員は標準を守り実践する側で、標準化の方針を決めて体制を整える立場ではない。決め手は方針を示す役割で、それは経営層。","src":"解説書 p.362","conflict":""},{"id":"r39q13n79","round":39,"q":13,"no":79,"part":"実践","field":"標準化","fmt":"mc","stem":"経営者や上級管理者は、社内標準を品質マネジメントシステムのどのような取組みの一環と認識して、標準化を進める組織やスタッフを配置すべきか。","options":["体制・仕組みの整備","認証維持のための書類づくり","従業員教育の実施","問題解決の手順化"],"answer":0,"explanation":"経営者や上級管理者は、社内標準づくりを品質マネジメントシステムという「体制・仕組みの整備」の一環と認識し、それを担う組織やスタッフを配置する立場にある。認証維持のための書類づくりは、標準が使われず存在しているだけになる状態そのものなので、望ましい位置付けではない。教育の実施や問題解決の手順化は、整えた仕組みを運用する側の活動であり、仕組みそのものを整える立場である経営者の位置付けとは違う。","src":"解説書 p.362","conflict":""},{"id":"r39q13n80","round":39,"q":13,"no":80,"part":"実践","field":"標準化","fmt":"mc","stem":"標準化を単なる社内活動にとどめず、国際標準への適合を見据えて、新しい技術やビジネスモデルを早期に標準化することも含めて経営計画として推進する。この標準化を何というか。","options":["戦略的な標準化","監査対応のための標準化","認証維持のための標準化","作業者教育のための標準化"],"answer":0,"explanation":"国際動向を注視し、将来を見据えて位置付ける標準化が「戦略的な標準化」。監査対応や認証維持のための標準化は、標準が存在しているだけで使われなくなる後ろ向きの状態で、経営計画としての標準化ではない。作業者教育は標準を定着させる手段の一つで、国際標準を見据えたものとは目的が違う。決め手は「経営計画」と「国際動向」。","src":"解説書 p.362","conflict":""},{"id":"r39q13n81","round":39,"q":13,"no":81,"part":"実践","field":"標準化","fmt":"mc","stem":"標準化を統括する部門は、全社の標準の整備について年度ごとに何を立案し、PDCAを回して最新版を管理するか。","options":["実行計画","品質目標","倫理教育","予防保全"],"answer":0,"explanation":"統括する事務局は年度ごとに「実行計画」を立て、定期的にチェックし、問題があれば標準担当部署へ改善を勧告するなどしてPDCAを回す。品質目標は品質に関する目標で、標準の整備を進める計画ではない。倫理教育と予防保全は、標準の整備の年度計画とは別の活動。年度ごとの立案=実行計画。","src":"解説書 p.362","conflict":""},{"id":"r39q13n82","round":39,"q":13,"no":82,"part":"実践","field":"標準化","fmt":"mc","stem":"標準を整備しても、活用する企業の風土に何かが欠けていれば不祥事につながりかねない。コンプライアンスやリスク管理の基本として、社内規則や社会規範を守る意識を高める必要があるが、その意識にあたるものはどれか。","options":["企業モラル","ヒューマンエラー","予防保全","品質目標"],"answer":0,"explanation":"社内規則や規範を守るというモラルが欠ければ、標準があっても不祥事になり得る。これが「企業モラル」で、その意識向上と実践が社会的信頼につながる。ヒューマンエラーは人の不注意による誤りで、規範を守る意識の問題ではない。予防保全は設備の故障を防ぐ保全、品質目標は品質の到達点で、いずれも意識ではない。","src":"解説書 p.362・363","conflict":""},{"id":"r39q13n83","round":39,"q":13,"no":83,"part":"実践","field":"標準化","fmt":"mc","stem":"現場の監督者が自ら社内標準を実践して範を示し、朝・夕会などで繰り返し教育する。この取組みで整えることを目指す環境はどれか。","options":["決めたことを守る","多くの決まりを作る","予防保全","ヒューマンエラー"],"answer":0,"explanation":"標準は制定・改訂して周知したのち、監督者が率先して守る姿勢を示し、朝・夕会で繰り返し教育することで定着する。目指すのは決めたことを守る環境。決まりの数を増やすことは目的ではなく、増やしても守られなければ標準は機能しない。予防保全とヒューマンエラーは、この場面の目的とは別の話。","src":"解説書 p.363","conflict":""},{"id":"r39q14n84","round":39,"q":14,"no":84,"part":"実践","field":"人材育成","fmt":"mc","stem":"企業の教育・訓練のうち、上司や先輩が部下や後輩に対して、日常の職務を進める中で必要な知識・技能を教える方法はどれか。","options":["OJT","OFF-JT","JTS","階層別教育"],"answer":0,"explanation":"日常の業務を遂行しながら、仕事を通じて教える方法が「OJT(職場内訓練)」。実際の職場で行うので実践的で即戦力の育成に向く一方、指導者の能力や経験で質がばらつきやすく、企業全体の価値観や体系的な知識の習得には不向きという弱点もある。OFF-JT(職場外訓練)は職場を離れて行う教育で、対になる。階層別教育は、教える場所でなく対象の分け方を表す語で、軸が違う。","src":"解説書 p.363・369(84の本文説明は判読不能。補筆を含む)","conflict":""},{"id":"r39q14n85","round":39,"q":14,"no":85,"part":"実践","field":"人材育成","fmt":"mc","stem":"企業の教育・訓練のうち、現在の職務や職場を離れて、研修やセミナーなどを通じて行う方法はどれか。","options":["OFF-JT","OJT","JTS","能力別教育"],"answer":0,"explanation":"職務・職場を離れて行う教育が「OFF-JT(職場外訓練)」。OJT(職場内訓練)は職務遂行の中で教える方法で、離れて行うかどうかで区別する。OJTだけでは教育担当者の質や特性にばらつきが出て人材を十分に活かせない場合があるため、両者を併用して関連づけるのが望ましい。職場の中=OJT、職場の外=OFF-JT。","src":"解説書 p.363・369","conflict":""},{"id":"r39q14n86","round":39,"q":14,"no":86,"part":"実践","field":"人材育成","fmt":"mc","stem":"経営者、管理職、リーダー、一般社員、新入社員など、役職や階層ごとに求められる役割に合わせて実施する教育はどれか。","options":["階層別教育","職能別教育","能力別教育","学歴別教育"],"answer":0,"explanation":"役職・階層ごとに実施するのが「階層別教育」で、新入社員には社会人マナー、管理職にはマネジメントや部下育成のように、階層で求められる内容を教える。職能別教育は、設計や営業などの職種ごとに、その職種に特化した内容を教える教育で、分け方が別。学歴別教育は一般的な区分ではない。役職で分ける=階層別、職種で分ける=職能別。","src":"解説書 p.363・364","conflict":""},{"id":"r39q14n87","round":39,"q":14,"no":87,"part":"実践","field":"人材育成","fmt":"tf","stem":"職能別教育とは、新入社員教育では社会人マナーを、管理職教育ではマネジメントや部下育成を教えるように、役職ごとに教育内容を変える教育である。","ok":false,"explanation":"誤り。ここで述べているのは階層別教育。職能別教育は、営業職や技術職、設計・調達・品質保証・製造といった職種(専門機能)ごとに、その職種に特化したスキルや知識を教える教育。役職で分ける=階層別、職種で分ける=職能別。","src":"解説書 p.363・364","conflict":"","alt":{"stem":"階層別教育とは、新入社員教育では社会人マナーを、管理職教育ではマネジメントや部下育成を教えるように、役職ごとに教育内容を変える教育である。","explanation":"正しい。役職や階層ごとに教育内容を変えるのは階層別教育である。職能別教育は、営業職や技術職、設計・調達・品質保証・製造といった職種(専門機能)ごとに、その職種に特化したスキルや知識を教える教育で、別のものである。決め手は、教育の目的が役割に応じた能力を育てることか、専門機能に必要な技能を育てることかという分け方の違いである。"}},{"id":"r39q14n88","round":39,"q":14,"no":88,"part":"実践","field":"人材育成","fmt":"mc","stem":"人材育成の場面でも、トップマネジメントは組織の目標達成に参画できるように、明確なビジョンとともに、品質に関する組織の全体的な意図と方向づけを経営トップが表明したものを示す必要がある。これに当たるものはどれか。","options":["品質方針","行動原理","経営基盤","SDGs"],"answer":0,"explanation":"品質に関する組織の全体的な意図と方向づけを経営トップが表明したものが「品質方針」で、組織の価値観にもなる。行動原理は、従業員の基本姿勢を決める根拠で、トップが方向づけを表明する文書とは位置づけが違う。経営基盤は経営を支える土台となる要素の総称、SDGsは持続可能な開発目標であり、いずれも組織のトップが自組織の品質の方向を示すものではない。","src":"解説書 p.364","conflict":""},{"id":"r39q14n89","round":39,"q":14,"no":89,"part":"実践","field":"人材育成","fmt":"mc","stem":"トップマネジメントが同じ価値観を組織で共有させ、そのうえで定める、従業員としての基本姿勢を決定づける根拠、つまり行動を起こす根本的な理由や動機となるものはどれか。","options":["行動原理","品質方針","経営基盤","アメーバ"],"answer":0,"explanation":"従業員の基本姿勢を決定づける根拠は、行動を起こす根本的な理由や動機となる「行動原理」。品質方針は、経営トップが品質に関する意図と方向づけを表明したものという定義で、行動を起こす根本的な理由や動機を指す語ではない。経営基盤は経営を支える土台、アメーバは小集団に分けて独立採算で運営する経営手法。方向づけを示す=品質方針、行動の根拠=行動原理。","src":"解説書 p.364","conflict":""},{"id":"r39q14n90","round":39,"q":14,"no":90,"part":"実践","field":"人材育成","fmt":"mc","stem":"人種、性別、年齢など、さまざまな属性をもつ人々が共存している状態を受け入れ、組織の成長や活性化、企業価値の向上に活かそうとする経営を何というか。","options":["ダイバーシティ経営","アメーバ経営","SDGs経営","LGBT経営"],"answer":0,"explanation":"人の多様性を受け入れて活かす経営が「ダイバーシティ経営」。多様性はばらつきの原因と考えられがちだが、トップの方向づけと人材育成による共通意識の醸成で、企業の新たな価値を生み出せる。アメーバ経営は小集団を独立採算にする手法、SDGsは持続可能な開発目標、LGBTは性的少数者の総称で、いずれも人の多様性を活かす経営を指す語ではない。","src":"解説書 p.364","conflict":""},{"id":"r39q14n91","round":39,"q":14,"no":91,"part":"実践","field":"人材育成","fmt":"mc","stem":"ダイバーシティ経営で、トップがビジョンを明確に示し、人材育成で共通意識を醸成すると、価値観の異なる人々が個性や能力を活かして共に活躍できる状態が生まれる。この状態を何というか。","options":["インクルージョン","ダイバーシティ","アメーバ","経営基盤"],"answer":0,"explanation":"多様な人々が個性や能力を活かして共に活躍できる状態が「インクルージョン」。ダイバーシティは、さまざまな属性の人々が共存している状態そのものを指す点が違う。共存しているだけか、共に活躍しているかで区別する。アメーバや経営基盤は、この状態を指す語ではない。共存=ダイバーシティ、共に活躍=インクルージョン。","src":"解説書 p.364","conflict":""},{"id":"r39q15n92","round":39,"q":15,"no":92,"part":"実践","field":"診断・監査","fmt":"mc","stem":"経営層によるトップ診断のテーマを決めるとき、社長・部門長方針の重点事項に加えて参考にする、以前の診断での記録や残された課題を何と呼ぶか。","options":["重点指摘事項","4M","5S","QCサークル"],"answer":0,"explanation":"テーマ決定では、方針の重点事項と、前回診断で実施したこと・残ったことの記録である「重点指摘事項」を参考にする。4Mは人・機械・材料・方法という要因の分類、5Sは整理・整頓・清掃・清潔・躾という職場の状態を表す活動、QCサークルは職場の小集団活動で、いずれも過去の診断の記録ではない。","src":"解説書 p.365","conflict":""},{"id":"r39q15n93","round":39,"q":15,"no":93,"part":"実践","field":"診断・監査","fmt":"mc","stem":"トップ診断では、方針に掲げた戦略目標の結果だけでなく、業務をどのように進めているかという仕事の進め方の状態も確認すべきである。この仕事の進め方を表す語はどれか。","options":["プロセス","4M","報連相","重点指摘事項"],"answer":0,"explanation":"結果に対して、そこに至る仕事の流れや進め方を表すのが「プロセス」で、業務プロセスの状態も診断で確認する。4Mは要因の分類、報連相は情報共有の習慣で、いずれも仕事の進め方全体を指す語ではない。重点指摘事項は過去の診断の記録。結果=目標、進め方=プロセスと対で覚える。","src":"解説書 p.365","conflict":""},{"id":"r39q15n94","round":39,"q":15,"no":94,"part":"実践","field":"診断・監査","fmt":"tf","stem":"トップ診断で、整理・整頓・清掃・清潔・躾の状態を見ることは、日常業務がうまくいっているかどうかを知る、診断資料には現れない手がかりになる。","ok":true,"explanation":"正しい。整理・整頓・清掃・清潔・躾は5Sで、職場の状態は資料の数字には出にくいが、業務の運営状況を映す手がかりになる。トップ診断では、戦略目標の数字だけでなく、資料に出にくい職場の実態(例えば5Sの状態)も見て、日常業務がうまくいっているかを判断する。","src":"解説書 p.365","conflict":""},{"id":"r39q15n95","round":39,"q":15,"no":95,"part":"実践","field":"診断・監査","fmt":"mc","stem":"トップ診断を行うと、各部門が普段行っている業務が、経営の基本方針に沿って運営されているかどうかを把握・評価できる。この、各部門の普段の業務を表す語はどれか。","options":["日常業務","重点指摘事項","QCサークル","4M"],"answer":0,"explanation":"各部門が普段行っている仕事が「日常業務」で、その運営が経営の基本方針に準拠しているかを評価するのがトップ診断の効果の一つ。重点指摘事項は過去の診断の記録、QCサークルは小集団活動、4Mは要因の分類で、いずれも各部門の普段の業務全体を指す語ではない。","src":"解説書 p.365","conflict":""},{"id":"r39q15n96","round":39,"q":15,"no":96,"part":"実践","field":"診断・監査","fmt":"mc","stem":"トップ診断で事実を把握するときには、客観的であることに加えて、統計的な手法に限らず、QCDの達成状況など数値で示す評価も用いる。この数値で示す性質を表す語はどれか。","options":["定量的","統計的","プロセス","日常業務"],"answer":0,"explanation":"事実把握では、客観的であることに並べて、数値で示せる「定量的」な指標を使い、QCD(品質・コスト・納期)の達成状況などを評価する。統計的は統計手法に基づく指標に限られた意味で、範囲が狭い。プロセスは仕事の進め方、日常業務は各部門の普段の仕事を指す語で、性質を表す語ではない。","src":"解説書 p.365・366","conflict":""},{"id":"r39q15n97","round":39,"q":15,"no":97,"part":"実践","field":"診断・監査","fmt":"mc","stem":"トップ診断は、経営層と受診部門との対話を深め、業務上の重要な情報の共有が円滑に行われるきっかけにもなる。この情報共有の代表的な習慣を指す語はどれか。","options":["報連相","4M","5S","QCサークル"],"answer":0,"explanation":"報告・連絡・相談を略した「報連相」は、業務プロセスの中で重要な情報共有の習慣で、円滑に行われることが望ましい。4Mは要因の分類、5Sは職場の状態づくり、QCサークルは小集団活動で、いずれも情報共有そのものを指す語ではない。","src":"解説書 p.366","conflict":""},{"id":"r39q16n98","round":39,"q":16,"no":98,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"品質に関して組織が進むべき方向性を示すもので、トップマネジメントが公式に表明したものはどれか。","options":["品質方針","品質目標","品質保証","品質管理"],"answer":0,"explanation":"組織が進むべき方向性を示すのが「品質方針」。品質目標は、その方針と整合して設定する、品質に関して追求する到達点で、方向性そのものではない。品質保証は要求事項が満たされるという確信を与える活動、品質管理は要求事項を満たすための運用活動で、いずれも方向性を示す文書ではない。決め手は「方向性」。","src":"解説書 p.366","conflict":""},{"id":"r39q16n99","round":39,"q":16,"no":99,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"品質マネジメントの七つの原則の一つである顧客重視では、主眼として、顧客のどのようなものを満たすことが挙げられているか。","options":["要求事項","顧客満足","方針","対策"],"answer":0,"explanation":"顧客重視の主眼は、顧客の「要求事項」を満たすことと、顧客の期待を超える努力をすること。顧客満足は、こうした活動の結果として得られるもので、満たす対象ではない。対策や方針は、顧客重視の内容を表す語ではない。満たす対象=要求事項、その結果=顧客満足。","src":"解説書 p.367","conflict":""},{"id":"r39q16n100","round":39,"q":16,"no":100,"part":"実践","field":"品質マネジメントシステム","fmt":"mc","stem":"顧客重視の考え方のもとで、各活動が進んでいけば、結果として得られるはずのものはどれか。","options":["顧客満足","要求事項","関係性管理","問題解決"],"answer":0,"explanation":"顧客重視の延長線上で得られるのは「顧客満足」。要求事項は、顧客重視で満たす対象で、結果ではない。関係性管理は七つの原則の一つで、活動の結果として得られるものではない。問題解決も手段の一つで、顧客重視の成果を表す語ではない。","src":"解説書 p.367","conflict":""},{"id":"r39q16n101","round":39,"q":16,"no":101,"part":"実践","field":"品質マネジメントシステム","fmt":"tf","stem":"品質マネジメントの七つの原則のうち、組織と密接に関連する利害関係者との適切な関係をマネジメントする原則は、「人々の積極的参加」である。","ok":false,"explanation":"誤り。利害関係者との関係をマネジメントする原則は「関係性管理」。人々の積極的参加は、組織内の全階層の人々が力量をもち、積極的に参加する点に着目する別の原則。七つの原則は、顧客重視、リーダーシップ、人々の積極的参加、プロセスアプローチ、改善、客観的事実に基づく意思決定、関係性管理。組織の外の関係者=関係性管理、組織の中の人々=人々の積極的参加。","src":"解説書 p.367","conflict":"","alt":{"stem":"品質マネジメントの七つの原則のうち、組織と密接に関連する利害関係者との適切な関係をマネジメントする原則は、「関係性管理」である。","explanation":"正しい。利害関係者との関係をマネジメントする原則は関係性管理である。人々の積極的参加は、組織内の全階層の人々が力量をもち、積極的に参加する点に着目する別の原則である。七つの原則は、顧客重視、リーダーシップ、人々の積極的参加、プロセスアプローチ、改善、客観的事実に基づく意思決定、関係性管理である。決め手は、対象が組織の外の関係者か、組織の中の人々かという点にある。"}},{"id":"r40q7n37","round":40,"q":7,"no":37,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"故障の木解析(FTA)で、樹形図の最上部に掲げる、防ぎたい好ましくない事象は何と呼ばれるか。","options":["トップ事象","基本事象","展開事象","非展開事象"],"answer":0,"explanation":"FTAは、まず望ましくない事象を決め、その発生要因を一次要因、二次要因と上から下へ掘り下げていく手法で、最上部に置く事象をトップ事象(トップイベント)と呼ぶ。基本事象・展開事象・非展開事象は、掘り下げる途中や末端で使う事象の種類であり、最上部の事象ではない。決め手は「木の一番上に置く」という位置で、頂点=トップ。","src":"解説書 p.389・390","conflict":""},{"id":"r40q7n38","round":40,"q":7,"no":38,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"FTAの樹形図で、下位の二つの原因事象が両方そろってはじめて上位の事象が発生する関係を表す論理記号はどれか。","options":["ANDゲート","ORゲート","抑制ゲート","排他的ORゲート"],"answer":0,"explanation":"二つの要因が同時に発生したときに上位事象が発生する関係がANDゲート。二つのうちいずれか一方でも起これば上位事象が発生するのがORゲートで、こちらは「そろう」必要がない。抑制ゲートは、入力に加えて付帯条件が成立するときだけ出力するゲートで、二つの原因事象が両方そろう関係を表すものではない。排他的ORゲートは、どちらか一方だけが起きたときに出力する。覚え方は、「両方そろって」ならAND、「どちらか一つで」ならOR。FTAは故障の木解析の略。","src":"解説書 p.390(補筆を含む)","conflict":""},{"id":"r40q7n39","round":40,"q":7,"no":39,"part":"手法","field":"信頼性工学","fmt":"tf","stem":"FTAで用いるORゲートは、下位の事象がすべてそろったときにだけ上位の事象が発生する関係を表す。","ok":false,"explanation":"誤り。すべてそろったときにだけ発生する関係を表すのはANDゲートで、ORゲートは下位の事象のいずれか一つでも起これば上位の事象が発生する関係を表す。両者は論理記号と呼ばれ、事象を表す事象記号と使い分けながらツリー図を完成させる。決め手は「一つでも」ならOR、「すべて」ならAND。FTAは故障の木解析の略。","src":"解説書 p.390","conflict":"","alt":{"stem":"FTAで用いるANDゲートは、下位の事象がすべてそろったときにだけ上位の事象が発生する関係を表す。","explanation":"正しい。ANDゲートは、下位の事象がすべてそろったときにだけ上位の事象が発生する関係を表す。ORゲートは下位の事象のいずれか一つでも起これば上位の事象が発生する関係を表す。両者は論理記号で、事象記号と使い分けてツリー図を完成させる。決め手は、上位事象が発生する条件がすべてか一つでもかである。"}},{"id":"r40q7n40","round":40,"q":7,"no":40,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"FTAで、二つの原因事象が両方そろってはじめて上位事象が発生する関係を表すANDゲートは、どの形の記号で示すか。","options":["下辺が直線で、上部が半円のドーム形","下辺が内側に湾曲し、上部が尖った形","長方形","ひし形"],"answer":0,"explanation":"ANDゲートは、下辺がまっすぐで上部が丸いドーム形の記号で表す。下辺が内側に湾曲して上部が尖った形はORゲートの記号で、二つの形は見た目が似ているので取り違えやすい。長方形やひし形は、論理関係ではなく事象そのものを表す事象記号であり、ゲートではない。覚え方は、ANDは「下が平ら」、ORは「下がへこんで尖る」。FTAは故障の木解析の略。","src":"解説書 p.390","conflict":""},{"id":"r40q7n41","round":40,"q":7,"no":41,"part":"手法","field":"信頼性工学","fmt":"mc","stem":"縦軸に故障率、横軸に期間をとり、製品の故障率が時間とともに変化する様子を表した曲線は、その形状から何と呼ばれるか。","options":["バスタブ曲線","ワイブル曲線","指数曲線","OC曲線"],"answer":0,"explanation":"故障率曲線は、初期に高く、中ほどで低く一定になり、後半で再び上がる形が浴槽の断面に似ているため、バスタブ曲線と呼ばれる。ワイブルや指数は故障の寿命を表す分布の名前で、曲線全体の形の通称ではない。OC曲線(検査特性曲線)は抜取検査で合格確率を表す曲線で、まったく別の分野の用語。決め手は「浴槽の形」で、名前が形から来ていると覚える。","src":"解説書 p.390(補筆を含む)","conflict":""},{"id":"r40q7n42","round":40,"q":7,"no":42,"part":"手法"
